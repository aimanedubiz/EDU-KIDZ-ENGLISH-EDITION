    <script>
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playCorrect() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } catch(e) {}
            },
            playWrong() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch(e) {}
            },
            playClick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } catch(e) {}
            }
        };

        const TOPICS = [
            { id: 1, title: "TOPIC 1 – RECOGNISING NUMBERS", short: "Recognising Numbers", desc: "Recognise, read and write numbers up to 10,000." },
            { id: 2, title: "TOPIC 2 – EXPLORING NUMBERS", short: "Exploring Numbers", desc: "Identify the place value of digits." },
            { id: 3, title: "TOPIC 3 – PARTITIONING NUMBERS", short: "Partitioning Numbers", desc: "Partition numbers by place value and digit value." },
            { id: 4, title: "TOPIC 4 – COMPARING NUMBERS", short: "Comparing Numbers", desc: "Compare pairs of whole numbers." },
            { id: 5, title: "TOPIC 5 – ORDERING NUMBERS", short: "Ordering Numbers", desc: "Arrange numbers in ascending order." },
            { id: 6, title: "TOPIC 6 – ESTIMATING NUMBERS", short: "Estimating Numbers", desc: "Estimate quantities using a reference quantity." },
            { id: 7, title: "TOPIC 7 – ROUNDING NUMBERS", short: "Rounding Numbers", desc: "Round numbers to the nearest hundred." },
            { id: 8, title: "TOPIC 8 – IDENTIFYING NUMBER PATTERNS", short: "Number Patterns", desc: "Identify increasing number patterns and their intervals." },
            { id: 9, title: "TOPIC 9 – PROBLEM SOLVING", short: "Problem Solving", desc: "Solve everyday problems involving numbers up to 10,000." }
        ];

        let appState = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('math_kids_users') || '[]'),
            currentView: 'welcome',
            selectedTopic: 1,
            selectedMode: 'OBJEKTIF',
            selectedLevel: 'SENANG',
            selectedTime: 60,
            activeQuestions: [],
            currentQuestionIndex: 0,

            timerInterval: null,
            timeLeft: 0
        };

        function saveAppStateToStorage() {
            localStorage.setItem('math_kids_users', JSON.stringify(appState.users));
        }

        function numToWords(n) {
            const units = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
                'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
            const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
            if (n < 20) return units[n];
            if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? '-' + units[n % 10] : '');
            if (n < 1000) return units[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + numToWords(n % 100) : '');
            const remainder = n % 1000;
            return numToWords(Math.floor(n / 1000)) + ' thousand'
                + (remainder ? (remainder < 100 ? ' and ' : ' ') + numToWords(remainder) : '');
        }

        function generateQuestionBank(topicId, level) {
            let questions = [];
            let prefix = "T3-N10000-T" + topicId + "-" + level.charAt(0);
            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const formatNum = (n) => n.toLocaleString('en-GB');

            for (let i = 1; i <= 20; i++) {
                let id = prefix + "-" + String(i).padStart(3, '0');
                let qData = {};

                if (topicId === 1) {
                    let targetNum = rnd(1001, 9999);
                    let words = numToWords(targetNum);
                    let options = [formatNum(targetNum), formatNum(targetNum + (targetNum <= 9900 ? 10 : -20)), formatNum(Math.max(100, targetNum - 10)), formatNum(targetNum + (targetNum <= 9900 ? 100 : -100))].sort(() => Math.random() - 0.5);
                    
                    qData = {
                        id: id, topik: "Recognising Numbers", tahap: level, aras_kognitif: "Remembering", jenis_game: "OBJEKTIF",
                        soalan: "Write this number in numerals:<br><strong class='text-emerald-700 text-lg sm:text-xl'>\"" + words + "\"</strong>",
                        gambarajah: "Number Word Card (KSSR Year 3)",
                        pilihan: options,
                        jawapan: formatNum(targetNum),
                        markah: 5,
                        penerangan: "The number \"" + words + "\" is written in numerals as " + formatNum(targetNum) + "."
                    };
                } else if (topicId === 2) {
                    let n;
                    do { n = rnd(1234, 9876); } while (new Set(String(n)).size < 4);
                    let sStr = String(n);
                    let posIdx = i % 4;
                    let places = ["thousands", "hundreds", "tens", "ones"];
                    let digits = [sStr[0], sStr[1], sStr[2], sStr[3]];
                    let targetDigit = digits[posIdx];
                    let placeName = places[posIdx];

                    qData = {
                        id: id, topik: "Exploring Numbers", tahap: level, aras_kognitif: "Remembering", jenis_game: "OBJEKTIF",
                        soalan: "In the number <strong>" + formatNum(n) + "</strong>, what is the place value of the digit <span class='text-rose-600 font-bold underline'>" + targetDigit + "</span>?",
                        gambarajah: "Place Value Chart (Thousands | Hundreds | Tens | Ones)",
                        pilihan: ["Thousands", "Hundreds", "Tens", "Ones"].sort(() => Math.random() - 0.5),
                        jawapan: placeName.charAt(0).toUpperCase() + placeName.slice(1),
                        markah: 5,
                        penerangan: "In the number " + formatNum(n) + ", digit " + targetDigit + " is in the " + placeName + " place."
                    };
                } else if (topicId === 3) {
                    let r = rnd(1, 9) * 1000;
                    let rt = rnd(1, 9) * 100;
                    let p = rnd(1, 9) * 10;
                    let s = rnd(1, 9);
                    let total = r + rt + p + s;
                    let correctCerakin = r + " + " + rt + " + " + p + " + " + s;
                    let wrong1 = r + " + " + rt + " + " + p + " + " + (s + 1);
                    let wrong2 = (r+100) + " + " + rt + " + " + p + " + " + s;
                    let wrong3 = r + " + " + rt + " + " + (p+10) + " + " + s;

                    qData = {
                        id: id, topik: "Partitioning Numbers", tahap: level, aras_kognitif: "Understanding", jenis_game: "OBJEKTIF",
                        soalan: "Choose the correct expanded form of <strong>" + formatNum(total) + "</strong>:",
                        gambarajah: "Digit Values",
                        pilihan: [correctCerakin, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                        jawapan: correctCerakin,
                        markah: 5,
                        penerangan: "The expanded form of " + formatNum(total) + " is " + correctCerakin + "."
                    };
                } else if (topicId === 4) {
                    let a = rnd(1000, 9500);
                    let b = a + rnd(10, 300) * (i % 2 === 0 ? 1 : -1);
                    if (b < 1000) b = 1500;
                    if (a === b) b = a + 45;
                    let larger = Math.max(a, b);

                    qData = {
                        id: id, topik: "Comparing Numbers", tahap: level, aras_kognitif: "Understanding", jenis_game: "OBJEKTIF",
                        soalan: "Which of these numbers is greater?<br><span class='text-lg sm:text-xl text-indigo-700 font-bold'>" + formatNum(a) + " &nbsp; and &nbsp; " + formatNum(b) + "</span>",
                        gambarajah: "Comparing on a Number Line",
                        pilihan: [formatNum(a), formatNum(b), "They are equal", "Not sure"].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(larger),
                        markah: 5,
                        penerangan: "When comparing " + formatNum(a) + " and " + formatNum(b) + ", the greater number is " + formatNum(larger) + "."
                    };
                } else if (topicId === 5) {
                    let base = rnd(2000, 7000);
                    let step = rnd(50, 200);
                    let seq = [base, base + step, base + (step*2), base + (step*3)];
                    const given = [seq[2], seq[0], seq[3], seq[1]];

                    qData = {
                        id: id, topik: "Ordering Numbers", tahap: level, aras_kognitif: "Understanding", jenis_game: "OBJEKTIF",
                        soalan: "Arrange these numbers in <strong>ascending order</strong> (smallest to largest).<br><span class='text-base sm:text-lg font-bold text-sky-700'>" + given.map(formatNum).join(', ') + "</span>",
                        gambarajah: "Ascending Order Chart",
                        pilihan: [
                            seq.map(formatNum).join(' , '),
                            [seq[3], seq[2], seq[1], seq[0]].map(formatNum).join(' , '),
                            [seq[1], seq[0], seq[3], seq[2]].map(formatNum).join(' , '),
                            [seq[2], seq[0], seq[1], seq[3]].map(formatNum).join(' , ')
                        ].sort(() => Math.random() - 0.5),
                        jawapan: seq.map(formatNum).join(' , '),
                        markah: 5,
                        penerangan: "In ascending order, the numbers go from smallest to largest: " + seq.map(formatNum).join(', ') + "."
                    };
                } else if (topicId === 6) {
                    const reference = rnd(15, 32) * 100;
                    const approx = reference * 2;

                    qData = {
                        id: id, topik: "Estimating Numbers", tahap: level, aras_kognitif: "Applying", jenis_game: "OBJEKTIF",
                        soalan: "A half-full jar contains about <strong>" + formatNum(reference) + "</strong> marbles. About how many marbles would the full jar contain?",
                        gambarajah: "Estimating the Number of Marbles",
                        pilihan: [formatNum(approx), formatNum(reference), formatNum(reference * 3), formatNum(reference / 2)].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(approx),
                        markah: 5,
                        penerangan: "A full jar holds about twice as many marbles as a half-full jar: 2 × " + formatNum(reference) + " = " + formatNum(approx) + "."
                    };
                } else if (topicId === 7) {
                    let num = rnd(1234, 8950);
                    let rounded = Math.round(num / 100) * 100;

                    qData = {
                        id: id, topik: "Rounding Numbers", tahap: level, aras_kognitif: "Understanding", jenis_game: "OBJEKTIF",
                        soalan: "Round <strong>" + formatNum(num) + "</strong> to the <strong>nearest hundred</strong>.",
                        gambarajah: "Rounding to the Nearest Hundred on a Number Line",
                        pilihan: [formatNum(rounded), formatNum(rounded + 100), formatNum(Math.max(100, rounded - 100)), formatNum(rounded + 500)].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(rounded),
                        markah: 5,
                        penerangan: "Use the tens digit to round to the nearest hundred. The rounded value of " + formatNum(num) + " is " + formatNum(rounded) + "."
                    };
                } else if (topicId === 8) {
                    let start = rnd(1000, 4000);
                    let step = [10, 100, 1000, 50][i % 4];
                    let s1 = start;
                    let s2 = start + step;
                    let s3 = start + (step * 2);
                    let s4 = start + (step * 3);
                    let s5 = start + (step * 4);

                    qData = {
                        id: id, topik: "Number Patterns", tahap: level, aras_kognitif: "Understanding", jenis_game: "OBJEKTIF",
                        soalan: "Identify the number pattern and find the missing number (?).<br><strong class='text-emerald-700 text-base sm:text-lg'>" + formatNum(s1) + " → " + formatNum(s2) + " → " + formatNum(s3) + " → ? → " + formatNum(s5) + "</strong>",
                        gambarajah: "Increasing Number Pattern",
                        pilihan: [formatNum(s4), formatNum(s4 + step), formatNum(s4 - step), formatNum(s4 + 200)].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(s4),
                        markah: 5,
                        penerangan: "This number pattern increases by " + step + " at each step. The missing number is " + formatNum(s4) + "."
                    };
                } else {
                    let pType = (i - 1) % 20;
                    let qText = "";
                    let ansVal = 0;
                    let explanation = "";

                    if (pType === 0) {
                        let a = rnd(2100, 4500);
                        let b = rnd(1200, 2300);
                        ansVal = a + b;
                        qText = "Mr Ali handed out " + formatNum(a) + " health leaflets. The following week, he handed out another " + formatNum(b) + ". How many leaflets did he hand out altogether?";
                        explanation = "Add " + formatNum(a) + " and " + formatNum(b) + " to get " + formatNum(ansVal) + " leaflets.";
                    } else if (pType === 1) {
                        let total = rnd(6500, 9800);
                        let sold = rnd(2100, 4200);
                        ansVal = total - sold;
                        qText = "A factory made " + formatNum(total) + " toy cars and sold " + formatNum(sold) + " of them. How many toy cars are left?";
                        explanation = "Subtract " + formatNum(sold) + " from " + formatNum(total) + " to get " + formatNum(ansVal) + " toy cars.";
                    } else if (pType === 2) {
                        let box = rnd(120, 250);
                        let count = 20;
                        ansVal = box * count;
                        if (ansVal > 9999) ansVal = 4800;
                        qText = "A large box contains " + formatNum(count) + " coloured pencils. Mrs Zetty buys " + formatNum(box) + " boxes. How many pencils does she buy?";
                        explanation = "Multiply " + formatNum(box) + " boxes by " + formatNum(count) + " pencils per box to get " + formatNum(ansVal) + " pencils.";
                    } else if (pType === 3) {
                        let total = rnd(4000, 8000);
                        total = Math.round(total / 4) * 4;
                        ansVal = total / 4;
                        qText = "A total of " + formatNum(total) + " mangoes are shared equally among 4 baskets. How many mangoes are in each basket?";
                        explanation = "Divide " + formatNum(total) + " by 4 to get " + formatNum(ansVal) + " mangoes per basket.";
                    } else if (pType === 4) {
                        let init = rnd(1500, 3000);
                        let add1 = rnd(1100, 2200);
                        let add2 = rnd(1300, 2400);
                        ansVal = init + add1 + add2;
                        qText = "A tuition centre has " + formatNum(init) + " pupils in the morning, " + formatNum(add1) + " in the afternoon and " + formatNum(add2) + " in the evening. How many pupils are there altogether?";
                        explanation = "Add the three groups to get " + formatNum(ansVal) + " pupils.";
                    } else if (pType === 5) {
                        let target = rnd(6000, 9500);
                        let saved = rnd(2100, 4300);
                        ansVal = target - saved;
                        qText = "Farhan wants to save " + formatNum(target) + " sen for a bicycle. He has saved " + formatNum(saved) + " sen. How much more does he need to save?";
                        explanation = "Subtract the amount saved from the target to get " + formatNum(ansVal) + " sen.";
                    } else if (pType === 6) {
                        let initial = rnd(5000, 8000);
                        let taken = rnd(1500, 2500);
                        let added = rnd(1200, 3000);
                        ansVal = initial - taken + added;
                        qText = "A warehouse has " + formatNum(initial) + " boxes of books. Workers take out " + formatNum(taken) + " boxes and then bring in " + formatNum(added) + " boxes. How many boxes are in the warehouse now?";
                        explanation = "Subtract the boxes taken out and add the boxes brought in to get " + formatNum(ansVal) + " boxes.";
                    } else if (pType === 7) {
                        let perRow = rnd(150, 300);
                        let rows = 12;
                        ansVal = perRow * rows;
                        if (ansVal > 9999) ansVal = 3600;
                        qText = "A hall has " + formatNum(rows) + " rows of chairs with " + formatNum(perRow) + " chairs in each row. How many chairs are there altogether?";
                        explanation = "Multiply the number of rows by the number of chairs per row to get " + formatNum(ansVal) + " chairs.";
                    } else if (pType === 8) {
                        let total = rnd(4500, 9000);
                        total = Math.round(total / 5) * 5;
                        ansVal = total / 5;
                        qText = "A length of fabric measuring " + formatNum(total) + " metres is cut into 5 equal pieces. How long is each piece?";
                        explanation = "Divide the total length by 5 to get " + formatNum(ansVal) + " metres per piece.";
                    } else if (pType === 9) {
                        let b1 = rnd(1100, 2300);
                        let b2 = rnd(1400, 2600);
                        let b3 = rnd(1200, 2100);
                        ansVal = b1 + b2 + b3;
                        qText = "A library records " + formatNum(b1) + " storybooks, " + formatNum(b2) + " science books and " + formatNum(b3) + " magazines. How many items are there altogether?";
                        explanation = "Add the three groups to get " + formatNum(ansVal) + " items.";
                    } else if (pType === 10) {
                        let budget = rnd(8000, 9900);
                        let spent = rnd(3400, 5200);
                        ansVal = budget - spent;
                        qText = "The Parent-Teacher Association sets aside RM" + formatNum(budget) + " and spends RM" + formatNum(spent) + ". How much money is left?";
                        explanation = "Subtract the amount spent from the budget to get RM" + formatNum(ansVal) + ".";
                    } else if (pType === 11) {
                        let kids = rnd(2000, 3500);
                        let adults = rnd(1500, 2500);
                        let seniors = rnd(800, 1300);
                        ansVal = kids + adults + seniors;
                        qText = "A concert is attended by " + formatNum(kids) + " children, " + formatNum(adults) + " adults under 60 and " + formatNum(seniors) + " people aged 60 or over. How many people attend altogether?";
                        explanation = "Add the three groups to get " + formatNum(ansVal) + " people.";
                    } else if (pType === 12) {
                        let birds = rnd(4000, 7000);
                        let flown = rnd(1500, 2800);
                        ansVal = birds - flown;
                        qText = "There are " + formatNum(birds) + " birds in a wetland. Then " + formatNum(flown) + " of them fly away. How many birds are left?";
                        explanation = "Subtract the number that flew away from the starting number to get " + formatNum(ansVal) + " birds.";
                    } else if (pType === 13) {
                        let packs = rnd(120, 200);
                        ansVal = packs * 30;
                        qText = "A shop receives " + formatNum(packs) + " packs of pens. Each pack contains 30 pens. How many pens are there altogether?";
                        explanation = "Multiply the number of packs by 30 to get " + formatNum(ansVal) + " pens.";
                    } else if (pType === 14) {
                        let packets = rnd(4000, 8000);
                        packets = Math.round(packets / 8) * 8;
                        ansVal = packets / 8;
                        qText = "A total of " + formatNum(packets) + " packets of powder are shared equally among 8 boxes. How many packets are in each box?";
                        explanation = "Divide the total number of packets by 8 to get " + formatNum(ansVal) + " packets per box.";
                    } else if (pType === 15) {
                        let s1 = rnd(2000, 3500);
                        let s2 = rnd(2100, 4000);
                        ansVal = s1 + s2;
                        qText = "Red House scores " + formatNum(s1) + " points in the first half and " + formatNum(s2) + " points in the second half. How many points does it score altogether?";
                        explanation = "Add the scores from both halves to get " + formatNum(ansVal) + " points.";
                    } else if (pType === 16) {
                        let cap = rnd(8000, 9900);
                        let curr = rnd(4500, 7000);
                        ansVal = cap - curr;
                        qText = "A stadium has " + formatNum(cap) + " seats. Today, " + formatNum(curr) + " spectators each take one seat. How many seats are empty?";
                        explanation = "Subtract the number of spectators from the number of seats to get " + formatNum(ansVal) + " empty seats.";
                    } else if (pType === 17) {
                        let dist = rnd(1500, 3000);
                        ansVal = dist * 3;
                        qText = "Town A is " + formatNum(dist) + " metres away. Town B is three times as far away as Town A. How far away is Town B?";
                        explanation = "Multiply the distance to Town A by 3 to get " + formatNum(ansVal) + " metres.";
                    } else if (pType === 18) {
                        let money = rnd(5000, 9000);
                        money = Math.round(money / 5) * 5;
                        ansVal = money / 5;
                        qText = "A donation of " + formatNum(money) + " sen is shared equally among 5 children. How much does each child receive?";
                        explanation = "Divide the total donation by 5 to get " + formatNum(ansVal) + " sen per child.";
                    } else {
                        let stock = rnd(6000, 9500);
                        let s1 = rnd(1200, 2200);
                        let s2 = rnd(1500, 2500);
                        ansVal = stock - s1 - s2;
                        qText = "A shop has " + formatNum(stock) + " tins of milk. It sells " + formatNum(s1) + " tins in the first week and " + formatNum(s2) + " tins in the second week. How many tins are left?";
                        explanation = "Subtract the sales from both weeks from the starting stock to get " + formatNum(ansVal) + " tins.";
                    }

                    let w1 = ansVal + rnd(100, 300);
                    let w2 = ansVal > 400 ? ansVal - rnd(100, 300) : ansVal + 400;
                    let w3 = ansVal + rnd(401, 800);
                    let options = [formatNum(ansVal), formatNum(w1), formatNum(w2), formatNum(w3)].sort(() => Math.random() - 0.5);

                    qData = {
                        id: id, topik: "Problem Solving", tahap: level, aras_kognitif: "Applying", jenis_game: "OBJEKTIF",
                        soalan: qText,
                        gambarajah: "Everyday Problems (KSSR Year 3)",
                        pilihan: options,
                        jawapan: formatNum(ansVal),
                        markah: 5,
                        penerangan: explanation
                    };
                }

                questions.push(qData);
            }
            return questions;
        }

                                <button onclick="setGameLevel('SENANG', this)" class="level-btn py-3 px-2 sm:px-4 bg-emerald-50 border-2 border-emerald-500 text-emerald-700 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">EASY</button>
                                <button onclick="setGameLevel('SEDERHANA', this)" class="level-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">MEDIUM</button>
                                <button onclick="setGameLevel('SUKAR', this)" class="level-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">HARD</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-2">CHOOSE A TIME LIMIT</label>
                            <div class="grid grid-cols-3 gap-2 sm:gap-3">
                                <button onclick="setGameTime(30, this)" class="time-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">30 SECONDS</button>
                                <button onclick="setGameTime(60, this)" class="time-btn py-3 px-2 sm:px-4 bg-emerald-50 border-2 border-emerald-500 text-emerald-700 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">1 MINUTE</button>
                                <button onclick="setGameTime(0, this)" class="time-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">NO TIME LIMIT</button>
                            </div>
                        </div>

                        <button onclick="startGameSession()" class="w-full py-3.5 sm:py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 font-fun text-base sm:text-lg transition-all active:scale-95">
                            START QUIZ 🚀
                        </button>
                    </div>
                </div>
            `;
            appState.selectedLevel = 'SENANG';
            appState.selectedTime = 60;
        }

        function setGameLevel(lvl, el) {
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                b.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-600');
            });
            el.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-600');
            el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            appState.selectedLevel = lvl;
        }

        function setGameTime(t, el) {
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                b.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-600');
            });
            el.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-600');
            el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            appState.selectedTime = t;
        }

        function startGameSession() {
            SoundFX.playClick();
            appState.activeQuestions = generateQuestionBank(appState.selectedTopic, appState.selectedLevel);
            appState.currentQuestionIndex = 0;
            appState.score = 0;
            appState.correctCount = 0;
            appState.wrongCount = 0;
            appState.timeLeft = appState.selectedTime;
            
            renderQuizQuestion();

            if (appState.selectedTime > 0) {
                if (appState.timerInterval) clearInterval(appState.timerInterval);
                appState.timerInterval = setInterval(() => {
                    appState.timeLeft--;
                    const timerEl = document.getElementById('quiz-timer-display');
                    if (timerEl) timerEl.innerText = appState.timeLeft + 's';
                    if (appState.timeLeft <= 0) {
                        clearInterval(appState.timerInterval);
                        endGameSession();
                    }
                }, 1000);
            }
        }

        function renderQuizQuestion() {
            if (appState.currentQuestionIndex >= appState.activeQuestions.length) {
                endGameSession();
                return;
            }

            const q = appState.activeQuestions[appState.currentQuestionIndex];
            const topic = TOPICS.find(t => t.id === appState.selectedTopic);
            const vp = document.getElementById('main-viewport');

            let optionsHTML = "";
            if (q.pilihan && Array.isArray(q.pilihan)) {
                optionsHTML = q.pilihan.map((opt, idx) => `
                    <button onclick="handleAnswerSelection('${opt.toString().replace(/'/g, "\\'")}', this)" class="answer-option w-full p-3.5 sm:p-4 bg-slate-50 hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-500 rounded-2xl font-bold text-slate-800 text-left transition-all flex items-center justify-between group active:scale-[0.98]">
                        <span class="flex items-center space-x-3">
                            <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-500 group-hover:bg-emerald-500 group-hover:text-white group-hover:border-emerald-500 transition-all shrink-0">${String.fromCharCode(65 + idx)}</span>
                            <span class="text-sm sm:text-base">${opt}</span>
                        </span>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-emerald-600 transition-all text-sm shrink-0"></i>
                    </button>
                `).join('');
            }

            vp.innerHTML = `
                <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-5 sm:p-8 border border-slate-100 flex flex-col my-auto">
                    <div class="flex items-center justify-between mb-4 sm:mb-6 pb-3 sm:pb-4 border-b border-slate-100 gap-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-emerald-100 text-emerald-800 text-[10px] sm:text-xs font-bold px-2.5 sm:px-3 py-1 rounded-full">${topic.short}</span>
                            <span class="text-[11px] sm:text-xs font-bold text-slate-400">Question ${appState.currentQuestionIndex + 1} / 20</span>
                        </div>
                        <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                            <div class="text-[11px] sm:text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 sm:px-3 py-1.5 rounded-xl">⭐ ${appState.score}</div>
                            ${appState.selectedTime > 0 ? `<div id="quiz-timer-display" class="text-[11px] sm:text-xs font-bold text-rose-600 bg-rose-50 px-2.5 sm:px-3 py-1.5 rounded-xl"><i class="fa-solid fa-clock mr-1"></i>${appState.timeLeft}s</div>` : ''}
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-slate-50 to-emerald-50/40 border border-slate-100 rounded-2xl p-4 mb-5 sm:mb-6 text-center">
                        <div class="text-[10px] sm:text-xs font-bold text-emerald-700 uppercase tracking-wide mb-1"><i class="fa-solid fa-chart-pie mr-1"></i> ${q.gambarajah}</div>
                        <div class="text-xs sm:text-sm font-medium text-slate-700 leading-relaxed">${q.soalan}</div>
                    </div>

                    <div class="space-y-2.5 sm:space-y-3 mb-5 sm:mb-6">
                        ${optionsHTML}
                    </div>

                    <div id="feedback-box" class="hidden rounded-2xl p-4 mb-4 text-xs sm:text-sm"></div>

                    <button id="next-btn" onclick="nextQuestion()" class="hidden w-full py-3.5 sm:py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 font-fun text-base sm:text-lg transition-all active:scale-95">
                        NEXT QUESTION <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            `;
        }

        function handleAnswerSelection(selectedOpt, btnEl) {
            document.querySelectorAll('.answer-option').forEach(b => b.disabled = true);
            
            const q = appState.activeQuestions[appState.currentQuestionIndex];
            const isCorrect = (selectedOpt.trim() === q.jawapan.toString().trim());

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                SoundFX.playCorrect();
                appState.score += 5;
                appState.correctCount++;
                btnEl.classList.remove('bg-slate-50', 'border-slate-200');
                btnEl.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                
                feedbackBox.className = "rounded-2xl p-4 mb-4 bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs sm:text-sm";
                feedbackBox.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-emerald-700 mb-1 text-sm sm:text-base">
                        <i class="fa-solid fa-circle-check"></i><span>CORRECT! (+5 marks)</span>
                    </div>
                    <p class="text-emerald-800">${q.penerangan}</p>
                `;
                
                try {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                } catch(e) {}
            } else {
                SoundFX.playWrong();
                appState.wrongCount++;
                btnEl.classList.remove('bg-slate-50', 'border-slate-200');
                btnEl.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');

                feedbackBox.className = "rounded-2xl p-4 mb-4 bg-rose-50 border border-rose-200 text-rose-900 text-xs sm:text-sm";
                feedbackBox.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-rose-700 mb-1 text-sm sm:text-base">
                        <i class="fa-solid fa-circle-xmark"></i><span>TRY AGAIN!</span>
                    </div>
                    <p class="text-rose-800 mb-1">Your answer: <strong>${selectedOpt}</strong> | Correct answer: <strong class="text-emerald-700">${q.jawapan}</strong></p>
                    <p class="text-slate-700">${q.penerangan}</p>
                `;
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            SoundFX.playClick();
            appState.currentQuestionIndex++;
            renderQuizQuestion();
        }

        function endGameSession() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            
            const u = appState.currentUser;
            if (u) {
                if (!u.topicScores) u.topicScores = {};
                u.score += appState.score;
                u.stats.totalAnswered += (appState.correctCount + appState.wrongCount);
                u.stats.totalCorrect += appState.correctCount;
                u.stats.totalWrong += appState.wrongCount;
                
                if (!u.topicScores[appState.selectedTopic] || appState.score > u.topicScores[appState.selectedTopic]) {
                    u.topicScores[appState.selectedTopic] = appState.score;
                }

                if (!u.completedTopics.includes(appState.selectedTopic)) {
                    u.completedTopics.push(appState.selectedTopic);
                }
                saveAppStateToStorage();
            }

            const topic = TOPICS.find(t => t.id === appState.selectedTopic);
            const vp = document.getElementById('main-viewport');
            const totalQ = appState.correctCount + appState.wrongCount || 1;
            const accuracy = Math.round((appState.correctCount / totalQ) * 100);

            vp.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 text-center my-auto">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-emerald-100 text-emerald-600 rounded-3xl mx-auto flex items-center justify-center text-3xl sm:text-4xl mb-4 shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold font-fun text-slate-900 mb-1">WELL DONE! 🎉</h2>
                    <p class="text-xs text-slate-500 mb-5">You have completed the practice session for ${topic.title}</p>

                    <div class="bg-slate-50 rounded-2xl p-4 mb-6 space-y-2 text-left text-xs font-bold text-slate-700">
                        <div class="flex justify-between"><span>Difficulty:</span><span class="text-indigo-600">${{ SENANG: 'Easy', SEDERHANA: 'Medium', SUKAR: 'Hard' }[appState.selectedLevel]}</span></div>
                        <div class="flex justify-between"><span>Correct Answers:</span><span class="text-emerald-600">${appState.correctCount} / 20</span></div>
                        <div class="flex justify-between"><span>Incorrect Answers:</span><span class="text-rose-600">${appState.wrongCount}</span></div>
                        <div class="flex justify-between"><span>Marks Awarded:</span><span class="text-amber-600">${appState.score} / 100</span></div>
                        <div class="flex justify-between"><span>Accuracy:</span><span class="text-teal-600">${accuracy}%</span></div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="startGameSession()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/30 font-fun text-sm sm:text-base transition-all active:scale-95">
                            PLAY AGAIN
                        </button>
                        <button onclick="renderDashboard()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl font-fun text-sm sm:text-base transition-all active:scale-95">
                            MAIN DASHBOARD
                        </button>
                    </div>
                </div>
            `;
            try {
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
            } catch(e) {}
        }

        function renderLeaderboard() {
            SoundFX.playClick();
            let sortedUsers = [...appState.users].sort((a, b) => b.score - a.score);
            let lbHTML = sortedUsers.map((u, idx) => `
                <div class="flex items-center justify-between p-3.5 sm:p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-amber-100 text-amber-700 font-bold flex items-center justify-center text-xs shrink-0">#${idx + 1}</span>
                        <div class="w-9 h-9 sm:w-10 sm:h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid ${u.avatar}"></i></div>
                        <div>
                            <div class="text-xs font-bold text-slate-800">${u.name}</div>
                            <div class="text-[10px] text-slate-400">Topics Completed: ${u.completedTopics ? u.completedTopics.length : 0}</div>
                        </div>
                    </div>
                    <div class="text-xs sm:text-sm font-bold text-emerald-600 shrink-0">⭐ ${u.score}</div>
                </div>
            `).join('');

            if (sortedUsers.length === 0) {
                lbHTML = `<div class="text-center text-xs text-slate-400 py-8">There are no player records yet.</div>`;
            }

            const vp = document.getElementById('main-viewport');
            vp.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 my-auto">
                    <div class="flex items-center space-x-3 mb-6">
                        <button onclick="renderDashboard()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 font-bold shrink-0"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h2 class="text-base sm:text-lg font-bold text-slate-900 font-fun">🏆 LEADERBOARD</h2>
                            <p class="text-xs text-slate-500">Player Rankings</p>
                        </div>
                    </div>
                    <div class="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                        ${lbHTML}
                    </div>
                </div>
            `;
        }

        window.onload = function () {
            renderWelcomeScreen();
        };
    </script>
</body>
</html>
