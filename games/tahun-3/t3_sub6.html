<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids Bernama Edu Kidz - Year 3 Mathematics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Poppins -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

            font-family: 'Poppins', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);

            transition: all 0.2s ease-in-out;

            transform: translateY(-4px);

        /* Custom Scrollbar */

        ::-webkit-scrollbar-track {
            background: #f1f5f9;

        ::-webkit-scrollbar-thumb {

</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.showScreen('home')">
                <div class="bg-yellow-400 text-blue-900 font-extrabold p-2 rounded-xl text-2xl shadow-md flex items-center justify-center w-12 h-12">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl tracking-wide">Bernama Edu Kidz</h1>
                    <p class="text-xs text-blue-200 font-medium">Year 3 Mathematics: Length, Mass and Volume of Liquid</p>
                </div>
            </div>
            
            <!-- Navigation Links / User Status -->
            <div class="flex items-center space-x-2 sm:space-x-4" id="nav-user-area">
                <!-- Dynamically updated based on login state -->
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6" id="main-container">
        <!-- Dynamic Screens injected here -->
    </main>

    <footer class="bg-slate-800 text-slate-300 py-6 mt-auto border-t border-slate-700">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="font-semibold text-sm sm:text-base text-white">Math Kids Bernama Edu Kidz &copy; 2026</p>
            <p class="text-xs text-slate-400 mt-1">Malaysia’s Ministry of Education • Year 3 Primary School Standard Curriculum (KSSR)</p>
        </div>
    </footer>

    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-100" id="modal-content">
            <!-- Modal content dynamically loaded -->
        </div>
    </div>

    <script>
        // --- DATA STRUCTURE & COMPREHENSIVE QUESTION BANK (660 UNIQUE QUESTIONS GENERATOR) ---
        
        const categoriesData = [
            { id: 1, name: "Converting Units of Length", icon: "fa-ruler", color: "bg-blue-500", desc: "Convert between metres (m) and centimetres (cm)." },
            { id: 2, name: "Adding and Subtracting Lengths", icon: "fa-ruler-combined", color: "bg-indigo-500", desc: "Add and subtract lengths in metres and centimetres." },
            { id: 3, name: "Multiplying and Dividing Lengths", icon: "fa-scissors", color: "bg-violet-500", desc: "Multiply and divide lengths." },
            { id: 4, name: "Converting Units of Mass", icon: "fa-weight-scale", color: "bg-amber-500", desc: "Convert between kilograms (kg) and grams (g)." },
            { id: 5, name: "Adding and Subtracting Masses", icon: "fa-scale-balanced", color: "bg-orange-500", desc: "Add and subtract the masses of objects." },
            { id: 6, name: "Multiplying and Dividing Masses", icon: "fa-boxes-packing", color: "bg-red-500", desc: "Multiply and divide masses." },
            { id: 7, name: "Converting Units of Volume of Liquid", icon: "fa-bottle-droplet", color: "bg-teal-500", desc: "Convert between litres (l) and millilitres (ml)." },
            { id: 8, name: "Adding and Subtracting Volumes", icon: "fa-jug-detergent", color: "bg-cyan-500", desc: "Add and subtract volumes of liquid." },
            { id: 9, name: "Multiplying and Dividing Volumes", icon: "fa-glass-water", color: "bg-sky-500", desc: "Multiply and divide volumes of liquid." },
            { id: 10, name: "Number Sentences from Pictures", icon: "fa-image", color: "bg-emerald-500", desc: "Complete number sentences using the diagrams." },
            { id: 11, name: "Problem Solving", icon: "fa-brain", color: "bg-purple-500", desc: "Solve problems about everyday situations." }
        ];

        // Question Bank Storage generator guaranteeing exactly 20 unique questions per level
        const levelLabels = { Senang: "Easy", Sederhana: "Medium", Susah: "Hard" };

        class QuestionBankGenerator {
            static generateAll() {
                const bank = {};
                categoriesData.forEach(cat => {
                    bank[cat.id] = {
                        senang: this.generateCategoryQuestions(cat.id, 'Senang', 20),
                        sederhana: this.generateCategoryQuestions(cat.id, 'Sederhana', 20),
                        susah: this.generateCategoryQuestions(cat.id, 'Susah', 20)
                    };
                });
                return bank;
            }

            static generateCategoryQuestions(catId, level, count) {
                const list = [];
                for (let i = 1; i <= count; i++) {
                    const qId = `CAT${catId}_${level.toUpperCase()}_${String(i).padStart(3, '0')}`;
                    list.push(this.createSpecificQuestion(catId, level, i, qId));
                }
                return list;
            }

            static createSpecificQuestion(catId, level, index, qId) {
                let qText = "", options = [], answer = "";

                switch(catId) {
                    case 1: // Converting Units of Length
                        if (level === 'Senang') {
                            const m = index;
                            qText = `How many centimetres are there in ${m} m?`;
                            answer = `${m * 100} cm`;
                            options = [`${m * 100} cm`, `${m * 10 + 50} cm`, `${m * 100 + 10} cm`, `${m} cm`];
                        } else if (level === 'Sederhana') {
                            const cm = index * 100 + 50;
                            qText = `Express ${cm} cm in metres and centimetres.`;
                            const mPart = Math.floor(cm / 100);
                            const cmPart = cm % 100;
                            answer = `${mPart} m ${cmPart} cm`;
                            options = [`${mPart} m ${cmPart} cm`, `${mPart + 1} m ${cmPart} cm`, `${mPart} m ${cmPart + 20} cm`, `${mPart - 1} m ${cmPart} cm`];
                        } else {
                            const m = index + 4;
                            const cm = 5 + index * 4;
                            qText = `Convert ${m} m ${cm} cm to centimetres (cm).`;
                            const total = m * 100 + cm;
                            answer = `${total} cm`;
                            options = [`${total} cm`, `${total + 50} cm`, `${total - 25} cm`, `${total + 100} cm`];
                        }
                        break;
                    case 2: // Adding and Subtracting Lengths
                        if (level === 'Senang') {
                            const a = index * 10;
                            const b = index * 5;
                            qText = `${a} cm + ${b} cm = ______ cm`;
                            answer = `${a + b} cm`;
                            options = [`${a + b} cm`, `${a + b + 10} cm`, `${Math.abs(a - b)} cm`, `${a + b - 5} cm`];
                        } else if (level === 'Sederhana') {
                            const m1 = index;
                            const m2 = index + 2;
                            qText = `${m1} m 40 cm + ${m2} m 30 cm = ______ m ______ cm`;
                            const tM = m1 + m2;
                            const tCm = 70;
                            answer = `${tM} m ${tCm} cm`;
                            options = [`${tM} m ${tCm} cm`, `${tM + 1} m ${tCm} cm`, `${tM} m ${tCm - 20} cm`, `${tM - 1} m ${tCm} cm`];
                        } else {
                            const m = index + 5;
                            qText = `${m} m - 2 m 45 cm = ______ cm`;
                            const totalCm = m * 100 - 245;
                            answer = `${totalCm} cm`;
                            options = [`${totalCm} cm`, `${totalCm + 10} cm`, `${totalCm - 5} cm`, `${totalCm + 100} cm`];
                        }
                        break;
                    case 3: // Multiplying and Dividing Lengths
                        if (level === 'Senang') {
                            qText = `A ribbon is ${index * 10} cm long. What is the total length of 2 ribbons of the same length?`;
                            const ans = index * 20;
                            answer = `${ans} cm`;
                            options = [`${ans} cm`, `${ans + 10} cm`, `${ans - 5} cm`, `${ans + 20} cm`];
                        } else if (level === 'Sederhana') {
                            const m = index * 2;
                            qText = `${m} m 50 cm × 3 = ______ m ______ cm`;
                            const totalCm = (m * 100 + 50) * 3;
                            const resM = Math.floor(totalCm / 100);
                            const resCm = totalCm % 100;
                            answer = `${resM} m ${resCm} cm`;
                            options = [`${resM} m ${resCm} cm`, `${resM + 1} m ${resCm} cm`, `${resM} m ${resCm + 10} cm`, `${resM - 1} m ${resCm} cm`];
                        } else {
                            const cm = index * 100 + 200;
                            qText = `${cm} cm ÷ 4 = ______ cm`;
                            const ans = cm / 4;
                            answer = `${ans} cm`;
                            options = [`${ans} cm`, `${ans + 10} cm`, `${ans - 10} cm`, `${ans + 25} cm`];
                        }
                        break;
                    case 4: // Converting Units of Mass
                        if (level === 'Senang') {
                            const kg = index;
                            qText = `How many grams are there in ${kg} kg?`;
                            answer = `${kg * 1000} g`;
                            options = [`${kg * 1000} g`, `${kg * 100} g`, `${kg * 1000 + 500} g`, `${kg} g`];
                        } else if (level === 'Sederhana') {
                            const g = index * 250 + 1000;
                            qText = `Convert ${g} g to kilograms and grams.`;
                            const kgPart = Math.floor(g / 1000);
                            const gPart = g % 1000;
                            answer = `${kgPart} kg ${gPart} g`;
                            options = [`${kgPart} kg ${gPart} g`, `${kgPart + 1} kg ${gPart} g`, `${kgPart} kg ${gPart + 100} g`, `${kgPart} kg ${gPart + 200} g`];
                        } else {
                            const kg = index + 1;
                            const g = index * 45;
                            qText = `Express ${kg} kg ${g} g in grams.`;
                            const total = kg * 1000 + g;
                            answer = `${total} g`;
                            options = [`${total} g`, `${total + 100} g`, `${total - 50} g`, `${total + 250} g`];
                        }
                        break;
                    case 5: // Adding and Subtracting Masses (Refined Susah Level with High Variety)
                        if (level === 'Senang') {
                            const a = index * 100;
                            const b = index * 50;
                            qText = `${a} g + ${b} g = ______ g`;
                            answer = `${a + b} g`;
                            options = [`${a + b} g`, `${a + b + 100} g`, `${Math.abs(a - b)} g`, `${a + b - 50} g`];
                        } else if (level === 'Sederhana') {
                            const kg1 = index;
                            const kg2 = index + 1;
                            qText = `${kg1} kg 300 g + ${kg2} kg 400 g = ______ kg ______ g`;
                            const tKg = kg1 + kg2;
                            const tG = 700;
                            answer = `${tKg} kg ${tG} g`;
                            options = [`${tKg} kg ${tG} g`, `${tKg + 1} kg ${tG} g`, `${tKg} kg ${tG - 100} g`, `${tKg} kg ${tG + 200} g`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 5 (Adding and Subtracting Masses)
                            const diffTypes = [
                                {
                                    q: `Work out in grams (g):\n6 kg 450 g + 3 kg 820 g − 2 kg 100 g = ______ g`,
                                    ans: (6 * 1000 + 450) + (3 * 1000 + 820) - (2 * 1000 + 100),
                                    unit: 'g'
                                },
                                {
                                    q: `A container holds 12 kg 350 g of rice. Workers add 4 bags of rice, each with a mass of 1 kg 500 g. What is the total mass of rice in grams?`,
                                    ans: (12 * 1000 + 350) + 4 * (1 * 1000 + 500),
                                    unit: 'g'
                                },
                                {
                                    q: `Work out in kg and g:\n15 kg 200 g − 4 kg 750 g + 3 kg 400 g = ______ kg ______ g`,
                                    ansTotal: (15 * 1000 + 200) - (4 * 1000 + 750) + (3 * 1000 + 400)
                                },
                                {
                                    q: `Mum buys 3 packets of flour. Packet A has a mass of 850 g, packet B has a mass of 1 kg 200 g and packet C has a mass of 2 kg 450 g. Find the total mass in grams.`,
                                    ans: 850 + (1 * 1000 + 200) + (2 * 1000 + 450),
                                    unit: 'g'
                                },
                                {
                                    q: `A lorry carries 25 kg of durians. It delivers 7 kg 650 g to a stall. What mass of durians is left, in kilograms and grams?`,
                                    ansTotal: (25 * 1000) - (7 * 1000 + 650)
                                },
                                {
                                    q: `Find the total in grams:\n4 kg 90 g + 7 kg 500 g + 2 kg 85 g = ______ g`,
                                    ans: (4 * 1000 + 90) + (7 * 1000 + 500) + (2 * 1000 + 85),
                                    unit: 'g'
                                },
                                {
                                    q: `A box of mangoes has a mass of 10 kg. The empty box has a mass of 1 kg 250 g. What is the mass of the mangoes alone, in grams?`,
                                    ans: (10 * 1000) - (1 * 1000 + 250),
                                    unit: 'g'
                                },
                                {
                                    q: `Kamil carries a load with a mass of 18 kg 400 g. He removes 9 kg 880 g. What is the mass of the remaining load in grams?`,
                                    ans: (18 * 1000 + 400) - (9 * 1000 + 880),
                                    unit: 'g'
                                }
                            ];

                            const selectedProblem = diffTypes[(index - 1) % diffTypes.length];
                            qText = selectedProblem.q;

                            if (selectedProblem.unit === 'g') {
                                const totalG = selectedProblem.ans;
                                answer = `${totalG} g`;
                                options = [
                                    `${totalG} g`,
                                    `${totalG + 250} g`,
                                    `${totalG - 150} g`,
                                    `${totalG + 500} g`
                                ];
                            } else {
                                const totalG = selectedProblem.ansTotal;
                                const kPart = Math.floor(totalG / 1000);
                                const gPart = totalG % 1000;
                                answer = `${kPart} kg ${gPart} g`;
                                options = [
                                    `${kPart} kg ${gPart} g`,
                                    `${kPart + 1} kg ${gPart} g`,
                                    `${kPart} kg ${gPart + 200} g`,
                                    `${kPart - 1} kg ${gPart} g`
                                ];
                            }
                        }
                        break;
                    case 6: // Multiplying and Dividing Masses
                        if (level === 'Senang') {
                            const g = index * 100;
                            qText = `A loaf of bread has a mass of ${g} g. What is the total mass of 3 loaves of the same mass?`;
                            const ans = g * 3;
                            answer = `${ans} g`;
                            options = [`${ans} g`, `${ans + 50} g`, `${ans - 100} g`, `${ans + 200} g`];
                        } else if (level === 'Sederhana') {
                            qText = `${index + 1} kg 200 g × 4 = ______ kg ______ g`;
                            const totalG = ((index + 1) * 1000 + 200) * 4;
                            const rKg = Math.floor(totalG / 1000);
                            const rG = totalG % 1000;
                            answer = `${rKg} kg ${rG} g`;
                            options = [`${rKg} kg ${rG} g`, `${rKg + 1} kg ${rG} g`, `${rKg} kg ${rG + 100} g`, `${rKg - 1} kg ${rG} g`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 6 (Multiplying and Dividing Masses)
                            const diffTypes = [
                                {
                                    q: `Work out in kilograms and grams:\n(5 kg 400 g × 3) ÷ 2 = ______ kg ______ g`,
                                    ansTotal: ((5 * 1000 + 400) * 3) / 2
                                },
                                {
                                    q: `A factory makes 8 packets of biscuits with the same mass. Together they have a mass of 6 kg 400 g. What is the mass of 3 packets in grams?`,
                                    ans: (6400 / 8) * 3,
                                    unit: 'g'
                                },
                                {
                                    q: `Work out in grams:\n12 kg 600 g ÷ 4 + 2 kg 350 g × 2 = ______ g`,
                                    ans: (12600 / 4) + ((2 * 1000 + 350) * 2),
                                    unit: 'g'
                                },
                                {
                                    q: `Mum buys 5 cakes, each with a mass of 1 kg 800 g. She shares them equally among 3 families. What mass of cake does each family receive, in grams?`,
                                    ans: (5 * (1 * 1000 + 800)) / 3,
                                    unit: 'g'
                                },
                                {
                                    q: `A container holds 4 boxes of goods. Each box has a mass of 3 kg 750 g. Find the total mass in kilograms and grams.`,
                                    ansTotal: (3 * 1000 + 750) * 4
                                },
                                {
                                    q: `Work out in kg and g:\n9 kg 120 g ÷ 3 × 2 = ______ kg ______ g`,
                                    ansTotal: (9120 / 3) * 2
                                },
                                {
                                    q: `Mr Ali packs oil palm fruit into 6 bags of equal mass. The bags have a total mass of 24 kg 600 g. What is the mass of 4 bags, in kilograms and grams?`,
                                    ansTotal: (24600 / 6) * 4
                                },
                                {
                                    q: `A lorry carries 6 gas cylinders. Each has a mass of 14 kg 500 g. Find the total mass in grams.`,
                                    ans: (14 * 1000 + 500) * 6,
                                    unit: 'g'
                                }
                            ];

                            const selectedProblem = diffTypes[(index - 1) % diffTypes.length];
                            qText = selectedProblem.q;

                            if (selectedProblem.unit === 'g') {
                                const totalG = selectedProblem.ans;
                                answer = `${totalG} g`;
                                options = [
                                    `${totalG} g`,
                                    `${totalG + 200} g`,
                                    `${totalG - 100} g`,
                                    `${totalG + 500} g`
                                ];
                            } else {
                                const totalG = selectedProblem.ansTotal;
                                const kPart = Math.floor(totalG / 1000);
                                const gPart = totalG % 1000;
                                answer = `${kPart} kg ${gPart} g`;
                                options = [
                                    `${kPart} kg ${gPart} g`,
                                    `${kPart + 1} kg ${gPart} g`,
                                    `${kPart} kg ${gPart + 150} g`,
                                    `${kPart - 1} kg ${gPart} g`
                                ];
                            }
                        }
                        break;
                    case 7: // Converting Units of Volume of Liquid
                        if (level === 'Senang') {
                            const l = index;
                            qText = `How many millilitres are there in ${l} l?`;
                            answer = `${l * 1000} ml`;
                            options = [`${l * 1000} ml`, `${l * 100} ml`, `${l * 1000 + 250} ml`, `${l} ml`];
                        } else if (level === 'Sederhana') {
                            const ml = index * 250 + 1000;
                            qText = `Convert ${ml} ml to litres and millilitres.`;
                            const lPart = Math.floor(ml / 1000);
                            const mlPart = ml % 1000;
                            answer = `${lPart} l ${mlPart} ml`;
                            options = [`${lPart} l ${mlPart} ml`, `${lPart + 1} l ${mlPart} ml`, `${lPart} l ${mlPart + 100} ml`, `${lPart} l ${mlPart + 200} ml`];
                        } else {
                            const l = index + 1;
                            const ml = index * 45;
                            qText = `Convert ${l} l ${ml} ml to millilitres (ml).`;
                            const total = l * 1000 + ml;
                            answer = `${total} ml`;
                            options = [`${total} ml`, `${total + 50} ml`, `${total - 100} ml`, `${total + 200} ml`];
                        }
                        break;
                    case 8: // Adding and Subtracting Volumes
                        if (level === 'Senang') {
                            const a = index * 100;
                            const b = index * 50;
                            qText = `${a} ml + ${b} ml = ______ ml`;
                            answer = `${a + b} ml`;
                            options = [`${a + b} ml`, `${a + b + 50} ml`, `${Math.abs(a - b)} ml`, `${a + b + 200} ml`];
                        } else if (level === 'Sederhana') {
                            const l1 = index;
                            const l2 = index + 1;
                            qText = `${l1} l 200 ml + ${l2} l 500 ml = ______ l ______ ml`;
                            const tL = l1 + l2;
                            const tMl = 700;
                            answer = `${tL} l ${tMl} ml`;
                            options = [`${tL} l ${tMl} ml`, `${tL + 1} l ${tMl} ml`, `${tL} l ${tMl - 100} ml`, `${tL} l ${tMl + 200} ml`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 8 (Adding and Subtracting Volumes)
                            const diffTypes = [
                                {
                                    q: `Work out in millilitres (ml):\n5 l 350 ml + 2 l 820 ml − 1 l 500 ml = ______ ml`,
                                    ans: (5 * 1000 + 350) + (2 * 1000 + 820) - (1 * 1000 + 500),
                                    unit: 'ml'
                                },
                                {
                                    q: `A large container holds 15 l of water. Mrs Suri pours out 3 l 450 ml and adds 2 l 120 ml of orange juice. What is the volume of liquid now, in litres and millilitres?`,
                                    ansTotal: (15 * 1000) - (3 * 1000 + 450) + (2 * 1000 + 120)
                                },
                                {
                                    q: `Work out in l and ml:\n8 l 100 ml − 2 l 650 ml + 4 l 300 ml = ______ l ______ ml`,
                                    ansTotal: (8 * 1000 + 100) - (2 * 1000 + 650) + (4 * 1000 + 300)
                                },
                                {
                                    q: `Three bottles contain 1 l 250 ml, 950 ml and 2 l 100 ml of juice. Find the total volume of juice in millilitres.`,
                                    ans: (1 * 1000 + 250) + 950 + (2 * 1000 + 100),
                                    unit: 'ml'
                                },
                                {
                                    q: `Maju Restaurant prepares 20 l of tea. Customers drink 13 l 750 ml. What volume of tea is left, in litres and millilitres?`,
                                    ansTotal: (20 * 1000) - (13 * 1000 + 750)
                                },
                                {
                                    q: `Find the total in millilitres:\n3 l 80 ml + 6 l 450 ml + 1 l 900 ml = ______ ml`,
                                    ans: (3 * 1000 + 80) + (6 * 1000 + 450) + (1 * 1000 + 900),
                                    unit: 'ml'
                                },
                                {
                                    q: `A tank contains 12 l of water. A gardener uses 4 l 850 ml to water some flowers. What volume of water remains, in millilitres?`,
                                    ans: (12 * 1000) - (4 * 1000 + 850),
                                    unit: 'ml'
                                },
                                {
                                    q: `Amin has 10 l of mineral water. He fills 4 bottles that hold 1 l 200 ml each. What volume of water does he have left, in litres and millilitres?`,
                                    ansTotal: (10 * 1000) - (4 * (1 * 1000 + 200))
                                }
                            ];

                            const selectedProblem = diffTypes[(index - 1) % diffTypes.length];
                            qText = selectedProblem.q;

                            if (selectedProblem.unit === 'ml') {
                                const totalMl = selectedProblem.ans;
                                answer = `${totalMl} ml`;
                                options = [
                                    `${totalMl} ml`,
                                    `${totalMl + 200} ml`,
                                    `${totalMl - 150} ml`,
                                    `${totalMl + 500} ml`
                                ];
                            } else {
                                const totalMl = selectedProblem.ansTotal;
                                const lPart = Math.floor(totalMl / 1000);
                                const mlPart = totalMl % 1000;
                                answer = `${lPart} l ${mlPart} ml`;
                                options = [
                                    `${lPart} l ${mlPart} ml`,
                                    `${lPart + 1} l ${mlPart} ml`,
                                    `${lPart} l ${mlPart + 150} ml`,
                                    `${lPart - 1} l ${mlPart} ml`
                                ];
                            }
                        }
                        break;
                    case 9: // Multiplying and Dividing Volumes
                        if (level === 'Senang') {
                            const ml = index * 100;
                            qText = `A bottle holds ${ml} ml of juice. What volume do 3 identical bottles hold altogether?`;
                            const ans = ml * 3;
                            answer = `${ans} ml`;
                            options = [`${ans} ml`, `${ans + 50} ml`, `${ans - 50} ml`, `${ans + 100} ml`];
                        } else if (level === 'Sederhana') {
                            qText = `${index} l 500 ml × 3 = ______ l ______ ml`;
                            const totalMl = (index * 1000 + 500) * 3;
                            const rL = Math.floor(totalMl / 1000);
                            const rMl = totalMl % 1000;
                            answer = `${rL} l ${rMl} ml`;
                            options = [`${rL} l ${rMl} ml`, `${rL + 1} l ${rMl} ml`, `${rL} l ${rMl + 100} ml`, `${rL - 1} l ${rMl} ml`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 9 (Multiplying and Dividing Volumes)
                            const diffTypes = [
                                {
                                    q: `Work out in litres and millilitres:\n(3 l 200 ml × 4) ÷ 2 = ______ l ______ ml`,
                                    ansTotal: ((3 * 1000 + 200) * 4) / 2
                                },
                                {
                                    q: `Six identical bottles contain a total of 9 l 600 ml of mineral water. What volume of water do 4 bottles contain, in millilitres?`,
                                    ans: (9600 / 6) * 4,
                                    unit: 'ml'
                                },
                                {
                                    q: `Work out in millilitres:\n14 l 800 ml ÷ 4 + 1 l 500 ml × 3 = ______ ml`,
                                    ans: (14800 / 4) + ((1 * 1000 + 500) * 3),
                                    unit: 'ml'
                                },
                                {
                                    q: `Mrs Aminah prepares 4 jugs of orange juice, each containing 2 l 250 ml. She shares the juice equally among 5 containers. How much does each container hold, in millilitres?`,
                                    ans: (4 * (2 * 1000 + 250)) / 5,
                                    unit: 'ml'
                                },
                                {
                                    q: `A large container holds 18 l of water. The water is shared equally among 8 buckets. What volume of water is there in 3 buckets, in litres and millilitres?`,
                                    ansTotal: (18000 / 8) * 3
                                },
                                {
                                    q: `Work out in l and ml:\n10 l 500 ml ÷ 5 × 4 = ______ l ______ ml`,
                                    ansTotal: (10500 / 5) * 4
                                },
                                {
                                    q: `Five buckets of water are poured into a paddling pool. Each bucket holds 4 l 200 ml. Find the total volume of water in millilitres.`,
                                    ans: (4 * 1000 + 200) * 5,
                                    unit: 'ml'
                                },
                                {
                                    q: `Mr Abu shares 15 l 600 ml of cleaning liquid equally among 6 large bottles. How much liquid is in 2 bottles, in litres and millilitres?`,
                                    ansTotal: (15600 / 6) * 2
                                }
                            ];

                            const selectedProblem = diffTypes[(index - 1) % diffTypes.length];
                            qText = selectedProblem.q;

                            if (selectedProblem.unit === 'ml') {
                                const totalMl = selectedProblem.ans;
                                answer = `${totalMl} ml`;
                                options = [
                                    `${totalMl} ml`,
                                    `${totalMl + 250} ml`,
                                    `${totalMl - 100} ml`,
                                    `${totalMl + 500} ml`
                                ];
                            } else {
                                const totalMl = selectedProblem.ansTotal;
                                const lPart = Math.floor(totalMl / 1000);
                                const mlPart = totalMl % 1000;
                                answer = `${lPart} l ${mlPart} ml`;
                                options = [
                                    `${lPart} l ${mlPart} ml`,
                                    `${lPart + 1} l ${mlPart} ml`,
                                    `${lPart} l ${mlPart + 200} ml`,
                                    `${lPart - 1} l ${mlPart} ml`
                                ];
                            }
                        }
                        break;
                    case 10: // Number Sentences from Pictures
                        if (level === 'Senang') {
                            const val = index * 100;
                            qText = `[Diagram: 2 bottles of water, each containing ${val} ml]\nComplete the number sentence: ${val} ml + ${val} ml = ______ ml`;
                            const ans = val * 2;
                            answer = `${ans} ml`;
                            options = [`${ans} ml`, `${ans + 50} ml`, `${ans - 50} ml`, `${ans + 100} ml`];
                        } else if (level === 'Sederhana') {
                            const val = index * 200;
                            qText = `[Diagram: A container holds ${val * 3} ml of water. ${val} ml is poured out.]\nComplete the number sentence: ${val * 3} ml - ${val} ml = ______ ml`;
                            const ans = val * 2;
                            answer = `${ans} ml`;
                            options = [`${ans} ml`, `${ans + 100} ml`, `${ans - 50} ml`, `${ans + 250} ml`];
                        } else {
                            const val = index * 50;
                            qText = `[Diagram: 4 packets of flour, each with a mass of ${val} g]\nComplete the number sentence: 4 × ${val} g = ______ g`;
                            const ans = val * 4;
                            answer = `${ans} g`;
                            options = [`${ans} g`, `${ans + 50} g`, `${ans - 25} g`, `${ans + 100} g`];
                        }
                        break;
                    case 11: // Problem Solving
                        if (level === 'Senang') {
                            const m = index + 2;
                            qText = `Aina has a ribbon that is ${m} m long. She uses 50 cm. How many centimetres of ribbon are left?`;
                            const ans = m * 100 - 50;
                            answer = `${ans} cm`;
                            options = [`${ans} cm`, `${ans + 50} cm`, `${ans - 10} cm`, `${ans + 100} cm`];
                        } else if (level === 'Sederhana') {
                            qText = `A basket contains 3 kg 200 g of mangoes and 1 kg 500 g of oranges. What is the total mass of the fruit?`;
                            answer = `4 kg 700 g`;
                            options = [`4 kg 700 g`, `5 kg 200 g`, `4 kg 500 g`, `3 kg 700 g`];
                        } else {
                            qText = `Mum shares 2 l of cordial equally among 4 glasses. How much is in each glass, in millilitres?`;
                            answer = `500 ml`;
                            options = [`500 ml`, `250 ml`, `400 ml`, `1,000 ml`];
                        }
                        break;
                }

                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                return {
                    id: qId,
                    tahun: 3,
                    kategori: categoriesData.find(c => c.id === catId).name,
                    subtopik: `Question ${index}`,
                    tahap: level,
                    aras_kognitif: level === 'Senang' ? 'Remembering' : level === 'Sederhana' ? 'Understanding' : 'Applying',
                    jenis: 'Multiple Choice',
                    soalan: qText,
                    pilihan: options,
                    jawapan: answer,
                    markah: 5,
                    gambarajah: null,
                    penerangan: `The correct answer is ${answer}. Convert mixed units to the smaller unit before calculating. Convert back if the question asks for both units.`
                };
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            let users = JSON.parse(localStorage.getItem('edu_kidz_users')) || [];
            if (users.some(u => u.username === username)) {
                showModal("That username is already taken. Choose a different one.");
                return;
            }

            const newUser = {
                username,
                password,
                history: [],
                masteredCount: 0
            };

            users.push(newUser);
            localStorage.setItem('edu_kidz_users', JSON.stringify(users));
            app.currentUser = newUser;
            app.saveUser();

            showModal(`Account created. Welcome, ${username}.`, () => {
                app.showScreen('home');
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            let users = JSON.parse(localStorage.getItem('edu_kidz_users')) || [];
            const found = users.find(u => u.username === username && u.password === password);

            if (found) {
                app.currentUser = found;
                app.saveUser();
                showModal(`Welcome back, ${username}.`, () => {
                    app.showScreen('home');
                });
            } else {
                showModal("Invalid username or password. Try again.");

        function setTimerOption(seconds) {
            app.selectedTimer = seconds;
            [30, 60, 0].forEach(sec => {
                const btn = document.getElementById(`timer-${sec}`);
                if (btn) {
                    if (sec === seconds) {
                        btn.className = "py-3 px-4 rounded-xl border-2 font-extrabold transition text-sm border-blue-600 bg-blue-50 text-blue-700";
                    } else {
                        btn.className = "py-3 px-4 rounded-xl border-2 font-extrabold transition text-sm border-slate-200 text-slate-700 hover:border-blue-500";
                    }
                }
            });

        function startActualGame() {
            const catBank = globalQuestionBank[app.selectedCategory][app.selectedLevel.toLowerCase()];
            // Uses all 20 questions generated in the bank
            app.currentQuestions = [...catBank];
            app.currentQuestionIndex = 0;
            app.score = 0;
            app.correctCount = 0;
            app.wrongCount = 0;
            app.userAnswersHistory = [];
            app.sessionStartTime = new Date().toLocaleDateString('en-GB');

            app.showScreen('game');
            setTimeout(() => {
                initGamePlay();
            }, 50);
        }

        function initGamePlay() {
            loadQuestion();
        }

        function loadQuestion() {
            if (app.currentQuestionIndex >= app.currentQuestions.length) {
                finishGame();
                return;
            }

            const q = app.currentQuestions[app.currentQuestionIndex];
            const cat = categoriesData.find(c => c.id === app.selectedCategory);

            const qCounterEl = document.getElementById('game-q-counter');
            if (!qCounterEl) return;

            qCounterEl.innerText = `Question ${app.currentQuestionIndex + 1}/${app.currentQuestions.length}`;
            document.getElementById('game-cat-label').innerText = cat ? cat.name : '';
            document.getElementById('game-level-badge').innerText = `Difficulty: ${levelLabels[app.selectedLevel]}`;
            document.getElementById('game-score-display').innerText = app.score;
            document.getElementById('question-text').innerText = q.soalan;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            document.getElementById('feedback-box').classList.add('hidden');

            q.pilihan.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 text-slate-800 font-extrabold py-3.5 px-4 rounded-2xl transition text-base text-center shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.jawapan, q);
                optContainer.appendChild(btn);
            });

            if (app.selectedTimer > 0) {
                app.timeLeft = app.selectedTimer;
                document.getElementById('timer-box').classList.remove('hidden');
                document.getElementById('game-timer-display').innerText = `${app.timeLeft}s`;
                
                if (app.timerInterval) clearInterval(app.timerInterval);
                app.timerInterval = setInterval(() => {
                    app.timeLeft--;
                    const timerDisplay = document.getElementById('game-timer-display');
                    if (timerDisplay) timerDisplay.innerText = `${app.timeLeft}s`;
                    if (app.timeLeft <= 0) {
                        clearInterval(app.timerInterval);
                        checkAnswer(null, q.jawapan, q);
                    }
                }, 1000);
            } else {
                const timerBox = document.getElementById('timer-box');
                if (timerBox) timerBox.classList.add('hidden');
            }
        }

        function checkAnswer(selected, correct, questionObj) {
            if (app.timerInterval) clearInterval(app.timerInterval);

            const isCorrect = (selected === correct);
            const feedbackBox = document.getElementById('feedback-box');
            if (!feedbackBox.classList.contains('hidden')) return;
            feedbackBox.classList.remove('hidden');

            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.innerText === correct) {
                    b.className = "bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-extrabold py-3.5 px-4 rounded-2xl text-base text-center";
                } else if (b.innerText === selected && !isCorrect) {
                    b.className = "bg-rose-100 border-2 border-rose-500 text-rose-800 font-extrabold py-3.5 px-4 rounded-2xl text-base text-center";
                }
            });

            if (isCorrect) {
                app.score += 5;
                app.correctCount++;
                feedbackBox.className = "rounded-2xl p-4 text-center space-y-2 bg-emerald-50 border border-emerald-200 text-emerald-800";
                feedbackBox.innerHTML = `
                    <h4 class="font-extrabold text-lg"><i class="fa-solid fa-circle-check"></i> Well done! Correct answer. (+5 marks)</h4>
                    <p class="text-xs">${questionObj.penerangan}</p>
                `;
                if (typeof confetti === "function") confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            } else {
                app.wrongCount++;
                feedbackBox.className = "rounded-2xl p-4 text-center space-y-2 bg-rose-50 border border-rose-200 text-rose-800";
                feedbackBox.innerHTML = `
                    <h4 class="font-extrabold text-lg"><i class="fa-solid fa-circle-xmark"></i> Keep Practising!</h4>
                    <p class="text-xs">The correct answer is: <strong>${correct}</strong></p>
                    <p class="text-xs text-slate-600">${questionObj.penerangan}</p>
                `;
            }

            app.userAnswersHistory.push({
                question: questionObj.soalan,
                selected: selected || 'Time’s Up',
                correct: correct,
                isCorrect: isCorrect
            });

            setTimeout(() => {
                app.currentQuestionIndex++;
                loadQuestion();
            }, 3000);
        }

        function finishGame() {
            if (app.currentUser) {
                const cat = categoriesData.find(c => c.id === app.selectedCategory);
                const record = {
                    categoryId: app.selectedCategory,
                    categoryName: cat ? cat.name : '',
                    level: app.selectedLevel,
                    score: app.score,
                    correct: app.correctCount,
                    total: app.currentQuestions.length,
                    date: new Date().toLocaleDateString('en-GB')
                };

                if (!app.currentUser.history) app.currentUser.history = [];
                app.currentUser.history.push(record);
                
                const uniqueCategories = new Set(app.currentUser.history.map(h => h.categoryId));
                app.currentUser.masteredCount = uniqueCategories.size;

                app.saveUser();
            }

            app.showScreen('result');
        }

        function showModal(message, callback) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="text-center space-y-4">
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <p class="text-slate-800 font-bold text-base">${message}</p>
                    <button onclick="closeModal(${callback ? callback.toString() : null})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-xl shadow transition">
                        OK
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal(cb) {
            document.getElementById('custom-modal').classList.add('hidden');
            if (typeof cb === 'function') cb();
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
