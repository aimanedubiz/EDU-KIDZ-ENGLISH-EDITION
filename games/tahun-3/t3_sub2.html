<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids Bernama Edu Kidz – Year 3 Mathematics</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            top: -10px;
            animation: fall 2s ease-in-out forwards;
            z-index: 9999;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-amber-50 to-emerald-50 min-h-screen text-slate-800 flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigate('home')">
                <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white font-extrabold text-xl shadow-md">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-blue-900 text-lg leading-tight">Math Kids</h1>
                    <p class="text-xs text-emerald-600 font-semibold">Bernama Edu Kidz • Year 3</p>
                </div>
            </div>
            
            <div id="nav-user-info" class="flex items-center space-x-3">
                <!-- Dynamically populated user badge -->
            </div>
        </div>
    </header>

    <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col">
        <!-- Views dynamically injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Math Kids Bernama Edu Kidz &copy; 2026 • Malaysian Primary School Standard Curriculum (KSSR)
    </footer>

    <!-- Notification Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl border border-slate-100 text-center">
            <div id="modal-icon" class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-info"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-slate-900 mb-2">Notice</h3>
            <p id="modal-message" class="text-slate-600 mb-6 text-sm">System message...</p>
            <button onclick="app.closeModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-200 cursor-pointer">
                OK, Continue
            </button>
        </div>
    </div>

    <script>
        const TOPICS = [
            { id: 1, code: "TAM2", name: "Topic 1: Adding Two Numbers", desc: "Add two numbers in the thousands, with or without regrouping." },
            { id: 2, code: "TAM3", name: "Topic 2: Adding Three Numbers", desc: "Add three numbers in the thousands using the column method." },
            { id: 3, code: "TOL2", name: "Topic 3: Subtracting Two Numbers", desc: "Subtract two numbers in the thousands." },
            { id: 4, code: "TOL3", name: "Topic 4: Subtracting Three Numbers", desc: "Subtract three numbers in the thousands in two steps." },
            { id: 5, code: "MST",  name: "Topic 5: Addition and Subtraction Word Problems", desc: "Solve everyday addition and subtraction problems." },
            { id: 6, code: "DAR",  name: "Topic 6: Multiplication", desc: "Use multiplication facts and multiply by a one-digit number." },
            { id: 7, code: "BAH",  name: "Topic 7: Division", desc: "Share equally, form equal groups and use related multiplication facts." },
            { id: 8, code: "MSD",  name: "Topic 8: Multiplication and Division Word Problems", desc: "Solve everyday multiplication and division problems." }
        ];

        class MathKidApp {
            constructor() {
                this.currentUser = JSON.parse(localStorage.getItem('edu_current_user')) || null;
                this.users = JSON.parse(localStorage.getItem('edu_users')) || [];
                this.currentView = 'home';
                this.selectedTopic = null;
                this.selectedDifficulty = null;
                this.selectedMode = 'Objektif';
                this.selectedTime = 30;
                this.questions = [];
                this.currentQIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.incorrectCount = 0;
                this.unansweredCount = 0;
                this.timer = null;
                this.timeLeft = 30;
                this.testAnswers = [];
                this.questionBank = {};
                
                this.initQuestionBank();
                this.render();
            }

            showModal(title, message, iconClass = 'fa-solid fa-info') {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                document.getElementById('modal-icon').innerHTML = `<i class="${iconClass}"></i>`;
                document.getElementById('custom-modal').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('custom-modal').classList.add('hidden');
            }

            navigate(view) {
                this.stopTimer();
                this.currentView = view;
                this.render();
            }

            initQuestionBank() {
                TOPICS.forEach(topic => {
                    ['S', 'M', 'H'].forEach(diffCode => {
                        const key = `${topic.code}_${diffCode}`;
                        this.questionBank[key] = [];

                        for (let i = 1; i <= 20; i++) {
                            const qId = `${topic.code}_${diffCode}_${String(i).padStart(3, '0')}`;
                            let qData = this.generateDiverseQuestion(topic.id, diffCode, i, qId);
                            this.questionBank[key].push(qData);
                        }
                    });
                });
            }

            generateDiverseQuestion(topicId, diff, index, id) {
                let num1, num2, num3, ans, questionText, subtopic, cognitive, options, explanation, steps;
                const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

                switch(topicId) {
                    case 1: // Adding Two Numbers
                        subtopic = "Column Method and Place Value";
                        if (diff === 'S') {
                            num1 = 120 + (index * 15);
                            num2 = 210 + (index * 12);
                            ans = num1 + num2;
                            cognitive = "Remembering";
                            questionText = `Find the sum of ${num1} and ${num2}.`;
                            explanation = `Add ones to ones, tens to tens and hundreds to hundreds. The sum is ${ans}.`;
                            steps = [`Add the ones digits: ${num1%10} + ${num2%10}.`, `Continue with the tens and hundreds columns, regrouping where needed.`];
                        } else if (diff === 'M') {
                            num1 = 1400 + (index * 42);
                            num2 = 2300 + (index * 31);
                            ans = num1 + num2;
                            cognitive = "Understanding";
                            questionText = `Work out ${num1} + ${num2}.`;
                            explanation = `Add by place value and regroup where needed. The sum is ${ans}.`;
                            steps = [`Line up the thousands, hundreds, tens and ones columns.`, `Regroup whenever a column adds up to 10 or more.`];
                        } else {
                            num1 = 3500 + (index * 88);
                            num2 = 2100 + (index * 64);
                            ans = num1 + num2;
                            cognitive = "Applying";
                            questionText = `A factory prints ${num1} storybooks in the morning and another ${num2} in the afternoon. How many storybooks does it print altogether?`;
                            explanation = `Total storybooks = ${num1} + ${num2} = ${ans}.`;
                            steps = [`Find the number of books printed in the morning and in the afternoon.`, `Add the two quantities.`];
                        }
                        break;

                    case 2: // Adding Three Numbers
                        subtopic = "Adding Three Quantities";
                        if (diff === 'S') {
                            num1 = 100 + (index * 10);
                            num2 = 200 + (index * 14);
                            num3 = 150 + (index * 8);
                            ans = num1 + num2 + num3;
                            cognitive = "Remembering";
                            questionText = `Find the sum: ${num1} + ${num2} + ${num3} = ?`;
                            explanation = `The sum of the three numbers is ${ans}.`;
                            steps = [`Add the first two numbers (${num1} + ${num2}).`, `Add the third number (${num3}) to that sum.`];
                        } else if (diff === 'M') {
                            num1 = 1100 + (index * 25);
                            num2 = 1300 + (index * 20);
                            num3 = 1250 + (index * 30);
                            ans = num1 + num2 + num3;
                            cognitive = "Understanding";
                            questionText = `Use the column method to work out ${num1} + ${num2} + ${num3}.`;
                            explanation = `The sum is ${ans}.`;
                            steps = [`Write the numbers vertically, lining up the digits by place value.`, `Add from right to left, regrouping where needed.`];
                        } else {
                            num1 = 2100 + (index * 50);
                            num2 = 1800 + (index * 35);
                            num3 = 1400 + (index * 40);
                            ans = num1 + num2 + num3;
                            cognitive = "Applying";
                            questionText = `Mr Amir collects ${num1} bottle caps in January, ${num2} in February and ${num3} in March. How many does he collect over the three months?`;
                            explanation = `Mr Amir collects ${ans} bottle caps altogether.`;
                            steps = [`Add the amounts collected in January, February and March.`];
                        }
                        break;

                    case 3: // Subtracting Two Numbers
                        subtopic = "Subtracting Numbers in the Thousands";
                        if (diff === 'S') {
                            num1 = 800 + (index * 30);
                            num2 = 300 + (index * 15);
                            ans = num1 - num2;
                            cognitive = "Remembering";
                            questionText = `Work out ${num1} − ${num2}.`;
                            explanation = `${num1} − ${num2} = ${ans}.`;
                            steps = [`Subtract from right to left, starting with the ones. Regroup where needed.`];
                        } else if (diff === 'M') {
                            num1 = 4500 + (index * 75);
                            num2 = 1600 + (index * 25);
                            ans = num1 - num2;
                            cognitive = "Understanding";
                            questionText = `Work out ${num1} − ${num2}.`;
                            explanation = `Subtract by place value and regroup where needed. The difference is ${ans}.`;
                            steps = [`If the top digit is smaller, regroup one unit from the column to its left.`];
                        } else {
                            num1 = 8200 + (index * 45);
                            num2 = 3400 + (index * 20);
                            ans = num1 - num2;
                            cognitive = "Applying";
                            questionText = `A library has ${num1} books. Pupils borrow ${num2} of them. How many books are left in the library?`;
                            explanation = `Books left = ${num1} − ${num2} = ${ans}.`;
                            steps = [`Subtract the number of books borrowed from the original total.`];
                        }
                        break;

                    case 4: // Subtracting Three Numbers
                        subtopic = "Subtraction in Two Steps";
                        if (diff === 'S') {
                            num1 = 900 + (index * 20);
                            num2 = 200 + (index * 8);
                            num3 = 150 + (index * 5);
                            ans = num1 - num2 - num3;
                            cognitive = "Remembering";
                            questionText = `Work out ${num1} − ${num2} − ${num3}.`;
                            explanation = `The final difference is ${ans}.`;
                            steps = [`Subtract ${num2} from ${num1}, then subtract ${num3} from the result.`];
                        } else if (diff === 'M') {
                            num1 = 5000 + (index * 50);
                            num2 = 1200 + (index * 20);
                            num3 = 1100 + (index * 15);
                            ans = num1 - num2 - num3;
                            cognitive = "Understanding";
                            questionText = `Work out ${num1} − ${num2} − ${num3}.`;
                            explanation = `The final difference is ${ans}.`;
                            steps = [`Subtract from left to right, one step at a time.`];
                        } else {
                            num1 = 7900 + (index * 60);
                            num2 = 2200 + (index * 25);
                            num3 = 1400 + (index * 15);
                            ans = num1 - num2 - num3;
                            cognitive = "Applying";
                            questionText = `Mrs Suri has ${num1} beads. She uses ${num2} for crafts and gives ${num3} to her child’s friend. How many beads does she have left?`;
                            explanation = `Mrs Suri has ${ans} beads left.`;
                            steps = [`Subtract the beads she uses, then subtract the beads she gives away.`];
                        }
                        break;

                    case 5: // Addition and Subtraction Word Problems
                        subtopic = "Everyday Situations";
                        if (diff === 'S') {
                            num1 = 300 + (index * 20);
                            num2 = 250 + (index * 15);
                            ans = num1 + num2;
                            cognitive = "Understanding";
                            questionText = `Ali has ${num1} marbles. His father gives him ${num2} more. How many marbles does Ali have now?`;
                            explanation = `Total marbles = ${num1} + ${num2} = ${ans}.`;
                            steps = [`Add the original number of marbles and the number given to Ali.`];
                        } else if (diff === 'M') {
                            num1 = 2500 + (index * 40);
                            num2 = 800 + (index * 20);
                            num3 = 450 + (index * 10);
                            ans = num1 - num2 + num3;
                            cognitive = "Applying";
                            questionText = `A warehouse stores ${num1} boxes of oranges. It sends ${num2} boxes to a supermarket and then receives ${num3} boxes from a farm. How many boxes are there now?`;
                            explanation = `${num1} − ${num2} + ${num3} = ${ans} boxes.`;
                            steps = [`Subtract the boxes sent out, then add the boxes received.`];
                        } else {
                            num1 = 4500 + (index * 55);
                            num2 = 1800 + (index * 25);
                            num3 = 1200 + (index * 20);
                            ans = num1 - num2 - num3;
                            cognitive = "Applying";
                            questionText = `A toy factory makes ${num1} toy cars. It sells ${num2} on Monday and another ${num3} on Tuesday. How many toy cars are left?`;
                            explanation = `The factory has ${ans} toy cars left.`;
                            steps = [`Subtract Monday’s sales, then subtract Tuesday’s sales.`];
                        }
                        break;

                    case 6: // Multiplication
                        subtopic = "Multiplication Facts";
                        if (diff === 'S') {
                            num1 = (index % 7) + 2;
                            num2 = (index % 6) + 2;
                            ans = num1 * num2;
                            cognitive = "Remembering";
                            questionText = `What is the product of ${num1} and ${num2}?`;
                            explanation = `${num1} × ${num2} = ${ans}.`;
                            steps = [`Use the ${num1} times table to find ${num1} × ${num2}.`];
                        } else if (diff === 'M') {
                            num1 = 120 + (index * 15);
                            num2 = 4;
                            ans = num1 * num2;
                            cognitive = "Understanding";
                            questionText = `Work out ${num1} × ${num2}.`;
                            explanation = `${num1} × ${num2} = ${ans}.`;
                            steps = [`Multiply each place-value part by ${num2}, then add the partial products.`];
                        } else {
                            num1 = 340 + (index * 16);
                            num2 = 6;
                            ans = num1 * num2;
                            cognitive = "Applying";
                            questionText = `A box holds ${num1} coloured pencils. How many pencils are in ${num2} boxes of the same size?`;
                            explanation = `Total pencils = ${num1} × ${num2} = ${ans}.`;
                            steps = [`Multiply the number of pencils in one box by the number of boxes.`];
                        }
                        break;

                    case 7: // Division
                        subtopic = "Sharing Equally";
                        if (diff === 'S') {
                            num2 = (index % 5) + 2;
                            ans = (index % 7) + 3;
                            num1 = num2 * ans;
                            cognitive = "Remembering";
                            questionText = `Work out ${num1} ÷ ${num2}.`;
                            explanation = `${num1} ÷ ${num2} = ${ans}.`;
                            steps = [`Use the related multiplication fact: ${num2} × ${ans} = ${num1}.`];
                        } else if (diff === 'M') {
                            num1 = 480 + (index * 24);
                            num2 = 4;
                            ans = num1 / num2;
                            cognitive = "Understanding";
                            questionText = `Work out ${num1} ÷ ${num2}.`;
                            explanation = `${num1} ÷ ${num2} = ${ans}.`;
                            steps = [`Divide from left to right, carrying any remainder to the next place as you go.`];
                        } else {
                            num1 = 910 + (index * 21);
                            num2 = 7;
                            ans = num1 / num2;
                            cognitive = "Applying";
                            questionText = `A total of ${num1} oranges are shared equally among ${num2} baskets. How many oranges are in each basket?`;
                            explanation = `Each basket contains ${ans} oranges (${num1} ÷ ${num2}).`;
                            steps = [`Divide the total number of oranges by the number of baskets.`];
                        }
                        break;

                    case 8: // Multiplication and Division Word Problems
                        subtopic = "Everyday Word Problems";
                        if (diff === 'S') {
                            const items = ["pencil cases", "biscuits", "shirts", "storybooks", "sweets"];
                            const item = items[index % items.length];
                            num1 = 3 + (index % 5);
                            num2 = 4 + (index % 4);
                            ans = num1 * num2;
                            cognitive = "Understanding";
                            questionText = `Mum buys ${num1} packs of ${item}. Each pack contains ${num2}. How many ${item} does she buy altogether?`;
                            explanation = `${num1} × ${num2} = ${ans} items.`;
                            steps = [`Multiply the number of packs by the number of items in each pack.`];
                        } else if (diff === 'M') {
                            const items = ["stamps", "oranges", "ice lollies", "marbles", "sheets of coloured paper"];
                            const item = items[index % items.length];
                            num2 = 3 + (index % 5);
                            ans = 15 + (index * 6);
                            num1 = num2 * ans;
                            cognitive = "Applying";
                            questionText = `Miss Lina shares ${num1} ${item} equally among ${num2} pupils. How many ${item} does each pupil receive?`;
                            explanation = `${num1} ÷ ${num2} = ${ans} items per pupil.`;
                            steps = [`Divide the total number of items by the number of pupils.`];
                        } else {
                            const scenarios = [
                                { q: (n1, n2, n3) => `A bakery makes ${n1} cakes each day. It shares the cakes it makes in ${n2} days equally among ${n3} shops. How many cakes does each shop receive?`, calc: (n1, n2, n3) => (n1 * n2) / n3 },
                                { q: (n1, n2, n3) => `Mr Ali shares ${n1} mangoes equally among ${n2} baskets. He sells ${n3} of the baskets. How many mangoes are left in the unsold baskets?`, calc: (n1, n2, n3) => (n1 / n2) * (n2 - n3) }
                            ];
                            num1 = 120 + (index * 15);
                            num2 = 4;
                            num3 = index % 2 === 0 ? 3 : 1;
                            const divisor = index % 2 === 0 ? num3 : num2;
                            num1 = Math.ceil(num1 / divisor) * divisor;
                            const sc = scenarios[index % scenarios.length];
                            ans = sc.calc(num1, num2, num3);
                            cognitive = "Applying";
                            questionText = sc.q(num1, num2, num3);
                            explanation = `The final answer is ${ans}.`;
                            steps = [`Find the total number of cakes first, or find the number of mangoes in one basket first. Then use that result in the next step.`];
                        }
                        break;
                }

                let wrong1 = ans + rand(1, 12);
                let wrong2 = Math.max(0, ans - rand(1, 12));
                let wrong3 = ans + rand(13, 28);
                if (wrong1 === ans) wrong1 += 1;
                if (wrong2 === ans || wrong2 === wrong1) wrong2 += 2;
                if (wrong3 === ans || wrong3 === wrong1 || wrong3 === wrong2) wrong3 += 3;

                options = [String(ans), String(wrong1), String(wrong2), String(wrong3)];
                for (let i = options.length - 1; i > 0; i--) {
                    const j = rand(0, i);
                    [options[i], options[j]] = [options[j], options[i]];
                }

                return {
                    id: id,
                    topik: TOPICS.find(t => t.id === topicId).name,
                    subtopik: subtopic,
                    tahap: diff === 'S' ? 'Easy' : diff === 'M' ? 'Medium' : 'Hard',
                    aras_kognitif: cognitive,
                    jenis: "Objektif",
                    soalan: questionText,
                    pilihan: options,
                    jawapan: String(ans),
                    markah: 5,
                    penerangan: explanation,
                    langkah_pengiraan: steps
                };
            }

            registerUser(e) {
                e.preventDefault();
                const username = document.getElementById('reg-username').value.trim();
                const displayname = document.getElementById('reg-displayname').value.trim();
                const pass = document.getElementById('reg-pass').value;

                if (!username || !displayname || !pass) {
                    this.showModal('Notice', 'Please complete all registration fields.', 'fa-solid fa-triangle-exclamation');
                    return;
                }

                if (this.users.some(u => u.username === username)) {
                    this.showModal('Error', 'That username is already taken. Please choose another.', 'fa-solid fa-circle-xmark');
                    return;
                }

                const newUser = {
                    username,
                    displayname,
                    pass,
                    stats: { gamesPlayed: 0, totalQuestions: 0, correct: 0, incorrect: 0, score: 0, highscore: 0 }
                };

                this.users.push(newUser);
                localStorage.setItem('edu_users', JSON.stringify(this.users));
                this.currentUser = newUser;
                localStorage.setItem('edu_current_user', JSON.stringify(this.currentUser));

                this.showModal('Success!', 'Your account is ready. Enjoy learning!', 'fa-solid fa-circle-check');
                this.navigate('home');
            }

            loginUser(e) {
                e.preventDefault();
                const username = document.getElementById('login-username').value.trim();
                const pass = document.getElementById('login-pass').value;

                const user = this.users.find(u => u.username === username && u.pass === pass);
                if (!user) {
                    this.showModal('Login Error', 'Invalid username or password.', 'fa-solid fa-circle-xmark');
                    return;
                }

                this.currentUser = user;
                localStorage.setItem('edu_current_user', JSON.stringify(this.currentUser));
                this.navigate('home');
            }

            loginGuest() {
                this.currentUser = {
                    username: 'tetamu_' + Math.floor(Math.random() * 1000),
                    displayname: 'Murid Guest',
                    isGuest: true,
                    stats: { gamesPlayed: 0, totalQuestions: 0, correct: 0, incorrect: 0, score: 0, highscore: 0 }
                };
                localStorage.setItem('edu_current_user', JSON.stringify(this.currentUser));
                this.navigate('home');
            }

            logout() {
                this.currentUser = null;
                localStorage.removeItem('edu_current_user');
                this.navigate('home');
            }

            startQuiz(topicId, difficulty, mode = 'Objektif', timeOption = 30) {
                this.selectedTopic = TOPICS.find(t => t.id === topicId);
                this.selectedDifficulty = difficulty;
                this.selectedMode = mode;
                this.selectedTime = timeOption;

                const key = `${this.selectedTopic.code}_${difficulty}`;
                const bank = this.questionBank[key] || [];
                
                // Set exactly all 20 questions available in the bank for this difficulty level
                const count = 20;
                this.questions = [...bank].sort(() => 0.5 - Math.random()).slice(0, count);
                this.currentQIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.incorrectCount = 0;
                this.unansweredCount = 0;
                this.testAnswers = [];

                this.navigate('play');
                this.loadQuestion();
            }

            loadQuestion() {
                this.stopTimer();
                if (this.currentQIndex >= this.questions.length) {
                    this.finishQuiz();
                    return;
                }

                const q = this.questions[this.currentQIndex];
                const container = document.getElementById('quiz-screen-area');
                if (!container) return;

                let optionsHTML = '';
                if (this.selectedMode === 'Objektif') {
                    q.pilihan.forEach((opt, idx) => {
                        optionsHTML += `
                            <button onclick="app.submitAnswer('${opt.replace(/'/g, "\\'")}')" class="w-full text-left bg-white hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 p-4 rounded-2xl font-bold text-slate-700 shadow-sm transition flex items-center justify-between cursor-pointer">
                                <span><span class="inline-block w-8 h-8 bg-blue-100 text-blue-600 rounded-lg text-center leading-8 mr-3 font-extrabold">${String.fromCharCode(65 + idx)}</span> ${opt}</span>
                                <i class="fa-solid fa-chevron-right text-slate-300"></i>
                            </button>
                        `;
                    });
                } else {
                    optionsHTML = `
                        <div class="space-y-4">
                            <input type="text" id="subjective-ans" placeholder="Type your numerical answer here..." class="w-full p-4 border-2 border-slate-300 rounded-2xl text-lg font-bold focus:border-blue-500 focus:outline-none bg-white">

            startTimer() {
                this.timeLeft = this.selectedTime;
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    const valEl = document.getElementById('time-left-val');
                    if (valEl) valEl.innerText = this.timeLeft;

                    if (this.timeLeft <= 0) {
                        this.stopTimer();
                        this.handleTimeout();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            handleTimeout() {
                this.unansweredCount++;
                const q = this.questions[this.currentQIndex];
                this.testAnswers.push({ q: q.soalan, userAns: "Unanswered (Time’s Up)", correctAns: q.jawapan, isCorrect: false, explanation: q.penerangan });
                
                const fb = document.getElementById('feedback-box');
                if (fb) {
                    fb.className = "rounded-2xl p-4 mb-4 bg-amber-50 border border-amber-200 text-amber-800";
                    fb.innerHTML = `<h4 class="font-bold text-lg mb-1"><i class="fa-solid fa-hourglass-end mr-2"></i> Time’s Up!</h4><p class="text-sm mb-2">The correct answer is: <strong>${q.jawapan}</strong></p><p class="text-xs text-amber-700">${q.penerangan}</p>`;
                    fb.classList.remove('hidden');
                }

                setTimeout(() => {
                    this.currentQIndex++;
                    this.loadQuestion();
                }, 3000);
            }

            submitAnswer(selectedOption) {
                this.stopTimer();
                const q = this.questions[this.currentQIndex];
                const isCorrect = selectedOption === q.jawapan;

                if (isCorrect) {
                    this.score += 5;
                    this.correctCount++;
                    this.triggerConfetti();
                } else {
                    this.incorrectCount++;
                }

                this.testAnswers.push({ q: q.soalan, userAns: selectedOption, correctAns: q.jawapan, isCorrect, explanation: q.penerangan });

                const fb = document.getElementById('feedback-box');
                if (fb) {
                    if (isCorrect) {
                        fb.className = "rounded-2xl p-4 mb-4 bg-emerald-50 border border-emerald-200 text-emerald-800";
                        fb.innerHTML = `<h4 class="font-bold text-lg mb-1"><i class="fa-solid fa-circle-check mr-2 text-emerald-600"></i> Well done! Correct answer.</h4><p class="text-sm">You earned 5 marks.</p>`;
                    } else {
                        fb.className = "rounded-2xl p-4 mb-4 bg-rose-50 border border-rose-200 text-rose-800";
                        fb.innerHTML = `<h4 class="font-bold text-lg mb-1"><i class="fa-solid fa-circle-xmark mr-2 text-rose-600"></i> Incorrect. Review the solution below.</h4><p class="text-sm mb-1">Correct answer: <strong>${q.jawapan}</strong></p><p class="text-xs text-rose-700">${q.penerangan}</p>`;
                    }
                    fb.classList.remove('hidden');
                }

                setTimeout(() => {
                    this.currentQIndex++;
                    this.loadQuestion();
                }, isCorrect ? 2000 : 3500);
            }

            submitSubjective() {
                const input = document.getElementById('subjective-ans');
                if (!input) return;
                const val = input.value.trim();
                if (!val) {
                    this.showModal('Notice', 'Please enter a numerical answer.', 'fa-solid fa-triangle-exclamation');
                    return;
                }
                this.submitAnswer(val);
            }

            triggerConfetti() {
                for (let i = 0; i < 30; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + 'vw';
                    piece.style.backgroundColor = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899'][Math.floor(Math.random() * 4)];
                    piece.style.animationDuration = (Math.random() * 1 + 1) + 's';
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 2000);
                }
            }

                if (this.currentUser && !this.currentUser.isGuest) {
                    this.currentUser.stats.gamesPlayed = (this.currentUser.stats.gamesPlayed || 0) + 1;
                    this.currentUser.stats.totalQuestions = (this.currentUser.stats.totalQuestions || 0) + this.questions.length;
                    this.currentUser.stats.correct = (this.currentUser.stats.correct || 0) + this.correctCount;
                    this.currentUser.stats.incorrect = (this.currentUser.stats.incorrect || 0) + this.incorrectCount;
                    this.currentUser.stats.score = (this.currentUser.stats.score || 0) + this.score;
                    if (this.score > (this.currentUser.stats.highscore || 0)) {

                this.tempMode = mode;
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.className = "mode-btn bg-slate-100 text-slate-700 p-3 rounded-xl font-bold text-xs transition cursor-pointer";
                });
                btn.className = "mode-btn bg-blue-600 text-white p-3 rounded-xl font-bold text-xs transition cursor-pointer";
            }

            renderPlay(container) {
                container.innerHTML = `
                    <div id="quiz-screen-area" class="flex-1 flex flex-col justify-center">
                        <!-- Loaded dynamically -->
                    </div>
                `;
            }

            renderResult(container) {
                const totalQ = this.questions.length;
                const maxScore = totalQ * 5;
                const percentage = Math.round((this.score / maxScore) * 100);

                let reviewHTML = '';
                this.testAnswers.forEach((ans, idx) => {
                    reviewHTML += `
                        <div class="p-4 rounded-2xl border ${ans.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'} mb-3">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-sm text-slate-900">Q.${idx + 1}: ${ans.q}</span>
                                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full ${ans.isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                                    ${ans.isCorrect ? '+5 Marks' : '0 Marks'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-600 mb-1">Your answer: <strong>${ans.userAns}</strong> | Correct answer: <strong>${ans.correctAns}</strong></p>
                            <p class="text-xs text-slate-500">${ans.explanation}</p>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 shadow-md">
                                <i class="fa-solid fa-trophy"></i>
                            </div>
                            <h2 class="text-3xl font-extrabold text-slate-900 mb-1">Quiz Results</h2>
                            <p class="text-slate-500 text-sm">Well done on completing the quiz!</p>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center">
                            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                <span class="text-xs text-blue-600 font-bold block mb-1">Marks</span>
                                <span class="text-2xl font-extrabold text-blue-900">${this.score} / ${maxScore}</span>
                            </div>
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <span class="text-xs text-emerald-600 font-bold block mb-1">Accuracy</span>
                                <span class="text-2xl font-extrabold text-emerald-900">${percentage}%</span>
                            </div>
                            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                <span class="text-xs text-amber-600 font-bold block mb-1">Correct</span>
                                <span class="text-2xl font-extrabold text-amber-900">${this.correctCount}</span>
                            </div>
                            <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                                <span class="text-xs text-rose-600 font-bold block mb-1">Incorrect</span>
                                <span class="text-2xl font-extrabold text-rose-900">${this.incorrectCount}</span>
                            </div>
                        </div>

                        <h3 class="font-extrabold text-slate-900 mb-4 text-lg">Answer Review and Solutions</h3>
                        <div class="space-y-3 mb-8 max-h-96 overflow-y-auto pr-2">
                            ${reviewHTML}
                        </div>

                        <div class="flex flex-wrap gap-4 justify-center">
                            <button onclick="app.navigate('topics')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition cursor-pointer">
                                Choose Another Topic
                            </button>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-3 rounded-xl transition cursor-pointer">
                                Home
                            </button>
                        </div>
                    </div>
                `;
            }

            renderProgress(container) {
                const stats = this.currentUser ? this.currentUser.stats : { gamesPlayed: 0, totalQuestions: 0, correct: 0, incorrect: 0, score: 0, highscore: 0 };
                const accuracy = stats.totalQuestions > 0 ? Math.round((stats.correct / stats.totalQuestions) * 100) : 0;

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-chart-line"></i>
                                </div>
                                <div>
                                    <h2 class="text-2xl font-extrabold text-slate-900">Learning Progress</h2>
                                    <p class="text-xs text-slate-500">Account Statistics: ${this.currentUser ? this.currentUser.displayname : 'Guest'}</p>
                                </div>
                            </div>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">
                                Home
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 text-center">
                                <span class="text-xs font-bold text-blue-600 block mb-1">Games Played</span>
                                <span class="text-3xl font-extrabold text-blue-900">${stats.gamesPlayed}</span>
                            </div>
                            <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 text-center">
                                <span class="text-xs font-bold text-emerald-600 block mb-1">Highest Score</span>
                                <span class="text-3xl font-extrabold text-emerald-900">${stats.highscore}</span>
                            </div>
                            <div class="bg-purple-50 p-6 rounded-2xl border border-purple-100 text-center">
                                <span class="text-xs font-bold text-purple-600 block mb-1">Average Accuracy</span>
                                <span class="text-3xl font-extrabold text-purple-900">${accuracy}%</span>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                            <h3 class="font-bold text-slate-900 mb-2">Progress Note</h3>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                The question bank contains 480 questions, with 20 per difficulty level in each of the eight topics.
                            </p>
                        </div>
                    </div>
                `;
            }

            renderLeaderboard(container) {
                let ranked = [...this.users].sort((a, b) => (b.stats.score || 0) - (a.stats.score || 0));
                if (ranked.length === 0 && this.currentUser) {
                    ranked = [this.currentUser];
                }

                let listHTML = '';
                ranked.forEach((u, idx) => {
                    listHTML += `
                        <div class="flex items-center justify-between p-4 rounded-2xl border border-slate-100 bg-slate-50/50 mb-3">
                            <div class="flex items-center space-x-4">
                                <div class="w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-white ${idx === 0 ? 'bg-amber-500' : idx === 1 ? 'bg-slate-400' : idx === 2 ? 'bg-amber-700' : 'bg-blue-600'}">
                                    ${idx + 1}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-900">${u.displayname}</h4>
                                    <span class="text-xs text-slate-500">ID: @${u.username}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="font-extrabold text-blue-600 text-base">${u.stats.score || 0} pts</span>
                                <span class="block text-xs text-slate-500">${u.stats.gamesPlayed || 0} sessions</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-trophy"></i>
                                </div>
                                <div>
                                    <h2 class="text-2xl font-extrabold text-slate-900">Pupil Leaderboard</h2>
                                    <p class="text-xs text-slate-500">Year 3 KSSR pupil rankings by score</p>
                                </div>
                            </div>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">
                                Home
                            </button>
                        </div>

                        <div class="space-y-3 mb-6">
                            ${listHTML.length > 0 ? listHTML : '<p class="text-center text-slate-500 py-6 text-sm">There are no pupil records yet.</p>'}
                        </div>
                    </div>
                `;
            }

            renderGuide(container) {
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                            <h2 class="text-2xl font-extrabold text-slate-900">Game Guide</h2>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">Home</button>
                        </div>
                        <div class="space-y-4 text-sm text-slate-600 leading-relaxed">
                            <p><strong>Math Kids Bernama Edu Kidz</strong> helps Year 3 pupils practise mathematics in line with the Malaysian Primary School Standard Curriculum (KSSR).</p>
                            <ul class="list-disc pl-5 space-y-2">
                                <li>All eight topics have <strong>20 varied questions</strong> at each difficulty level (Easy, Medium and Hard).</li>
                                <li>Each quiz contains <strong>20 questions</strong> to help pupils practise and check their understanding.</li>
                                <li>The question bank contains 480 questions.</li>
                                <li>Each correct answer is worth 5 marks. Solutions include step-by-step explanations.</li>
                            </ul>
                        </div>
                    </div>
                `;
            }
        }

        let app;
        window.onload = function() {
            app = new MathKidApp();
        };
    </script>
</body>
</html>
