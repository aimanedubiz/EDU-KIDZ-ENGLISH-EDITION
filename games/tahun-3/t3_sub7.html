        const questionTypeLabels = { "Objektif": "Multiple Choice", "Isi Tempat Kosong": "Fill in the Blank", "Subjektif Ringkas": "Short Answer" };
        const cognitiveLabels = { Mengingat: "Remembering", Memahami: "Understanding", Mengaplikasi: "Applying" };

        class AppManager {
            constructor() {
                this.currentUser = null;
                this.currentView = 'login'; // login, register, menu, category, difficulty, timer, game, results, progress, leaderboard, instructions
                this.selectedCategory = null;
                this.selectedDifficulty = null;
                this.selectedTimerSeconds = 60; // default 1 min, or null for no limit
                this.currentQuestions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.incorrectCount = 0;
                this.timerInterval = null;
                this.timeLeft = 0;
                this.isAnswered = false;
                
                this.loadUsers();
            }

            loadUsers() {
                const stored = localStorage.getItem('math_kids_users');
                this.users = stored ? JSON.parse(stored) : {};
            }

            saveUsers() {
                localStorage.setItem('math_kids_users', JSON.stringify(this.users));
            }

            register(username, fullName, password) {
                if (!username || !fullName || !password) {
                    return { success: false, message: "Complete all fields." };
                }
                if (this.users[username]) {
                    return { success: false, message: "That username is already taken. Choose another." };
                }
                this.users[username] = {
                    username,
                    fullName,
                    password,
                    history: [],
                    progress: {
                        "Kenali Prisma dan Bukan Prisma": 0,
                        "Kenal Poligon Sekata": 0,
                        "Paksi Simetri": 0,
                        "Penyelesaian Masalah": 0
                    },
                    totalScore: 0,
                    highestScore: 0
                };
                this.saveUsers();
                return { success: true, message: "Account created. Please log in." };
            }

            login(username, password) {
                if (!username || !password) {
                    return { success: false, message: "Enter your username and password." };
                }
                const user = this.users[username];
                if (!user || user.password !== password) {
                    return { success: false, message: "Invalid username or password." };
                }
                this.currentUser = username;
                return { success: true };
            }

            logout() {
                this.currentUser = null;
                this.navigate('login');
            }

            getLeaderboard() {
                let list = [];
                for (let uname in this.users) {
                    let u = this.users[uname];
                    list.push({
                        username: u.username,
                        fullName: u.fullName,
                        totalScore: u.totalScore || 0,
                        highestScore: u.highestScore || 0
                    });
                }
                list.sort((a, b) => b.totalScore - a.totalScore);
                return list;
            }

            navigate(view) {
                this.currentView = view;
                if (view !== 'game') {
                    this.stopTimer();
                }
                renderApp();
            }

            startQuiz(category, difficulty, timerSec) {
                this.selectedCategory = category;
                this.selectedDifficulty = difficulty;
                this.selectedTimerSeconds = timerSec;

                // Filter questions
                let pool = questionDatabase.filter(q => q.kategori === category && q.tahap === difficulty);
                // Shuffle and pick 20 unique
                pool.sort(() => Math.random() - 0.5);
                this.currentQuestions = pool.slice(0, 20);
                this.currentIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.incorrectCount = 0;
                this.isAnswered = false;

                this.navigate('game');
                this.initGameTimer();
            }

            initGameTimer() {
                this.stopTimer();
                if (this.selectedTimerSeconds === null) return;
                this.timeLeft = this.selectedTimerSeconds;
                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    updateTimerDisplay();
                    if (this.timeLeft <= 0) {
                        this.stopTimer();
                        this.finishQuiz();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            submitAnswer(userAnswer) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                this.stopTimer();

                const q = this.currentQuestions[this.currentIndex];
                const isCorrect = String(userAnswer).trim().toLowerCase() === String(q.jawapan).trim().toLowerCase();

                if (isCorrect) {
                    this.score += 5;
                    this.correctCount++;
                } else {
                    this.incorrectCount++;
                }

                showFeedbackModal(isCorrect, q);
            }

            nextQuestion() {
                this.currentIndex++;
                if (this.currentIndex >= this.currentQuestions.length) {
                    this.finishQuiz();
                } else {
                    this.isAnswered = false;
                    renderApp();
                    if (this.selectedTimerSeconds !== null) {
                        this.initGameTimer();
                    }
                }
            }

            finishQuiz() {
                this.stopTimer();
                // Save progress to user profile
                if (this.currentUser && this.users[this.currentUser]) {
                    let u = this.users[this.currentUser];
                    u.totalScore += this.score;
                    if (this.score > u.highestScore) {
                        u.highestScore = this.score;
                    }
                    // Update category progress percentage (simplified estimation based on score)
                    let cat = this.selectedCategory;
                    let maxCatScore = 20 * 5; // 100
                    let currentProgress = u.progress[cat] || 0;
                    let sessionPct = Math.round((this.score / maxCatScore) * 100);
                    if (sessionPct > currentProgress) {
                        u.progress[cat] = sessionPct;
                    }

                    u.history.push({
                        date: new Date().toLocaleDateString('en-GB'),
                        category: cat,
                        difficulty: this.selectedDifficulty,
                        score: this.score,
                        correct: this.correctCount,
                        incorrect: this.incorrectCount
                    });
                    this.saveUsers();
                }
                this.navigate('results');
            }
        }

        const appState = new AppManager();

        // 3. RENDER ENGINE & UI COMPONENTS
        // ==========================================
        function renderApp() {
            const viewport = document.getElementById('main-viewport');
            const userInfo = document.getElementById('header-user-info');

            if (appState.currentUser) {
                userInfo.classList.remove('hidden');
                document.getElementById('header-username').textContent = appState.users[appState.currentUser].fullName;
            } else {
                userInfo.classList.add('hidden');
            }

            switch (appState.currentView) {
                case 'login':
                    viewport.innerHTML = renderLoginView();
                    break;
                case 'register':
                    viewport.innerHTML = renderRegisterView();
                    break;
                case 'menu':

                    break;
                case 'category':

                    break;
                case 'difficulty':
                    viewport.innerHTML = renderDifficultyView();
                    break;
                case 'timer':
                    viewport.innerHTML = renderTimerSelectionView();
                    break;
                case 'game':
                    viewport.innerHTML = renderGameView();
                    break;
                case 'results':
                    viewport.innerHTML = renderResultsView();
                    break;
                case 'progress':
                    viewport.innerHTML = renderProgressView();
                    break;
                case 'leaderboard':
                    viewport.innerHTML = renderLeaderboardView();
                    break;
                case 'instructions':
                    viewport.innerHTML = renderInstructionsView();
                    break;
                default:
                    viewport.innerHTML = renderLoginView();
            }
        }

        function renderDiagramSvg(type) {
            const polygonSides = {
                SVG_SEGI_TIGA: 3, SVG_SEGI_TIGA_SAMA: 3,
                SVG_SEGI_EMPAT_SAMA: 4, SVG_PERIMETER_SQUARE: 4, SVG_SQUARE_FIELD: 4,
                SVG_PENTAGON: 5, SVG_PENTAGON_PERIMETER: 5, SVG_PENTAGON_SIDE: 5,
                SVG_HEKSAGON: 6, SVG_HEXAGON_PERIMETER: 6, SVG_HEXAGON_SIDE: 6, SVG_HEXAGON_TABLE: 6,
                SVG_REGULAR_POLYGON: 6,
                SVG_SQUARE_SYMMETRY: 4, SVG_EQUILATERAL_SYMMETRY: 3,
                SVG_PENTAGON_SYMMETRY: 5, SVG_HEXAGON_SYMMETRY: 6, SVG_HEXAGON_CARD_CALC: 6,
                SVG_HEXAGON_LIGHTS: 6, SVG_SQUARE_SIDE_CALC: 4, SVG_TWO_SIDES_SQUARE: 4
            };
            const sides = polygonSides[type];
            let diagram = "";
            if (sides) {
                const points = Array.from({ length: sides }, (_, i) => {
                    const angle = i * 2 * Math.PI / sides - (sides === 4 ? Math.PI / 4 : Math.PI / 2);
                    return `${(50 + 39 * Math.cos(angle)).toFixed(2)},${(50 + 39 * Math.sin(angle)).toFixed(2)}`;
                });
                diagram = `<polygon points="${points.join(" ")}" fill="#e0f2fe"/>`;
            } else {
                const rectangle = '<rect x="12" y="26" width="76" height="48" fill="#e0f2fe"/>';
                const square = '<rect x="22" y="22" width="56" height="56" fill="#e0f2fe"/>';
                const dashed = (x1, y1, x2, y2) =>
                    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#be185d" stroke-dasharray="5 3"/>`;
                const horizontal = dashed(9, 50, 91, 50);
                const shapes = {
                    SVG_SEGI_EMPAT_TEPAT: rectangle,
                    SVG_RECTANGLE_SYMMETRY: rectangle,
                    SVG_RECTANGLE_DIAGONAL_FAIL: rectangle + dashed(12, 26, 88, 74),
                    SVG_RECTANGLE_HORIZ_AXIS: rectangle + horizontal,
                    SVG_RECTANGLE_FOLD: rectangle + horizontal,
                    SVG_NOTICE_BOARD: rectangle,
                    SVG_HALL_RUN: rectangle,
                    SVG_CUT_HEXAGON: '<polygon points="10,50 30,15.36 70,15.36 90,50 70,84.64 30,84.64" fill="#e0f2fe"/>' + horizontal,
                    SVG_TILES_LINE: '<rect x="10" y="40" width="80" height="20" fill="#e0f2fe"/><path d="M30 40v20 M50 40v20 M70 40v20" fill="none"/>',
                    SVG_CUT_CAKE: square + '<path d="M50 22v56 M22 50h56" fill="none"/>',
                    SVG_CARD_FOLD: square + dashed(22, 22, 78, 78),
                    SVG_SQUARE_DIAGONAL: square + dashed(22, 22, 78, 78) + dashed(22, 78, 78, 22),
                    SVG_SQUARE_DIAGONAL_FOLD: square + dashed(22, 22, 78, 78),
                    SVG_DASHED_AXIS: square + dashed(50, 15, 50, 85),
                    SVG_BULATAN: '<circle cx="50" cy="50" r="38" fill="#e0f2fe"/>',
                    SVG_CIRCLE_SYMMETRY: '<circle cx="50" cy="50" r="38" fill="#e0f2fe"/>',
                    SVG_SEMI_CIRCLE: '<path d="M12 65 A38 38 0 0 1 88 65 Z" fill="#e0f2fe"/>',
                    SVG_ISOSCELES_SYMMETRY: '<polygon points="50,13 19,80 81,80" fill="#e0f2fe"/>',
                    SVG_ISOSCELES_PROPERTY: '<polygon points="50,13 19,80 81,80" fill="#e0f2fe"/>',
                    SVG_NON_SYMMETRIC_TRIANGLE: '<polygon points="26,18 13,80 85,80" fill="#e0f2fe"/>',
                    SVG_PARALLELOGRAM_NOSYM: '<polygon points="27,27 88,27 73,73 12,73" fill="#e0f2fe"/>',
                    SVG_KITE_SYMMETRY: '<polygon points="50,10 78,38 50,90 22,38" fill="#e0f2fe"/>',
                    SVG_LETTER_A_SYMMETRY: '<path d="M24 83 50 17 76 83 M34 57h32" stroke-width="6"/>',
                    SVG_LETTER_H_SYMMETRY: '<path d="M26 17v66 M74 17v66 M26 50h48" stroke-width="6"/>',
                    SVG_LETTER_M_SYMMETRY: '<path d="M24 83V17l26 36 26-36v66" stroke-width="6"/>',
                    SVG_LETTER_C_SYMMETRY: '<path d="M77 29A31 31 0 1 0 77 71" stroke-width="6"/>',
                    SVG_LETTER_O_SYMMETRY: '<ellipse cx="50" cy="50" rx="25" ry="34" stroke-width="6"/>'
                };
                diagram = shapes[type] || "";
            }
            if (diagram) {
                return `<svg class="w-36 h-36 text-cyan-600 drop-shadow-md" viewBox="0 0 100 100" stroke="currentColor" stroke-width="3" aria-hidden="true">${diagram}</svg>`;
            }
            const solids = {
                SVG_PRISMA_SEGI_TIGA: '<path d="M15 66 36 29 60 66Z M36 29 56 15 81 51 60 66 M56 15 35 51 81 51 M15 66 35 51" fill="#e0f2fe" stroke-linejoin="round"/>',
                SVG_CUBOID: '<path d="M15 41 63 41 63 76 15 76Z M15 41 34 25 82 25 63 41 M82 25 82 60 63 76" fill="#e0f2fe" stroke-linejoin="round"/>',
                SVG_KUBUS: '<path d="M22 37 64 37 64 79 22 79Z M22 37 40 19 82 19 64 37 M82 19 82 61 64 79" fill="#e0f2fe" stroke-linejoin="round"/>',
                SVG_SPHERE: '<circle cx="50" cy="50" r="35" fill="#e0f2fe"/><ellipse cx="50" cy="50" rx="35" ry="12" stroke-dasharray="4 3"/>',
                SVG_SILINDER: '<path d="M20 28v44c0 15 60 15 60 0V28" fill="#e0f2fe"/><ellipse cx="50" cy="28" rx="30" ry="11" fill="#f0f9ff"/>',
                SVG_KON: '<path d="M20 72 50 15 80 72c0 15-60 15-60 0Z" fill="#e0f2fe"/><ellipse cx="50" cy="72" rx="30" ry="10" stroke-dasharray="4 3"/>',
                SVG_PYRAMID: '<path d="M20 65 50 15 83 57 58 81Z M50 15 58 81" fill="#e0f2fe" stroke-linejoin="round"/>'
            };
            if (solids[type]) {
                return `<svg class="w-36 h-36 text-cyan-600 drop-shadow-md" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">${solids[type]}</svg>`;
            }
            return "";
        }

                        <div>
                            <span class="text-xs font-bold text-cyan-700">CURRENT PUPIL</span>
                            <h3 class="text-lg font-extrabold text-slate-800">${user ? user.fullName : 'Pupil'}</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-cyan-700">HIGHEST SCORE</span>
                            <h3 class="text-lg font-extrabold text-cyan-600">${user ? user.highestScore : 0} marks</h3>
                        </div>
                    </div>

                    <div class="space-y-4">
                        ${Object.keys(prog).map(cat => `
                            <div class="space-y-1">
                                <div class="flex justify-between text-sm font-bold text-slate-700">
                                    <span>${categoryLabels[cat] || cat}</span>
                                    <span>${prog[cat]}%</span>
                                </div>
                                <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                                    <div class="bg-gradient-to-r from-cyan-500 to-blue-600 h-full rounded-full transition-all duration-500" style="width: ${prog[cat]}%"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-100">
                        <h4 class="text-sm font-extrabold text-slate-800">Recent Games</h4>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${user && user.history.length > 0 ? user.history.slice(-5).reverse().map(h => `
                                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold text-slate-800 block">${categoryLabels[h.category] || h.category} (${difficultyLabels[h.difficulty] || h.difficulty})</span>
                                        <span class="text-slate-400">${h.date}</span>
                                    </div>
                                    <span class="font-extrabold text-cyan-600">${h.score} marks</span>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400 text-center py-4">There are no games to show yet.</p>'}
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function renderLeaderboardView() {
            const lb = appState.getLeaderboard();

            return `
            <div class="max-w-3xl w-full bg-white p-6 sm:p-8 rounded-3xl card-shadow border border-cyan-100 space-y-6">
                <div class="flex items-center justify-between border-b border-cyan-50 pb-4">
                    <button onclick="appState.navigate('menu')" class="px-4 py-2 bg-slate-50 text-slate-600 rounded-xl font-bold hover:bg-slate-100 text-sm">⬅ Back</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">🏆 LEADERBOARD</h2>
                    <div></div>
                </div>

                <div class="space-y-3">
                    ${lb.length > 0 ? lb.map((p, idx) => `
                        <div class="p-4 rounded-2xl border ${idx === 0 ? 'bg-amber-50/80 border-amber-300' : idx === 1 ? 'bg-slate-100 border-slate-300' : idx === 2 ? 'bg-orange-50 border-orange-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <span class="w-8 h-8 rounded-full ${idx === 0 ? 'bg-amber-500 text-white' : idx === 1 ? 'bg-slate-400 text-white' : idx === 2 ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'} flex items-center justify-center font-extrabold text-sm">${idx + 1}</span>
                                <div>
                                    <h4 class="font-extrabold text-slate-800 text-sm">${p.fullName}</h4>
                                    <span class="text-xs text-slate-400">@${p.username}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="font-extrabold text-cyan-600 text-base">${p.totalScore} marks</span>
                                <span class="block text-[10px] text-slate-400">Highest Score: ${p.highestScore}</span>
                            </div>
                        </div>
                    `).join('') : '<p class="text-center text-xs text-slate-400 py-8">There are no leaderboard entries yet.</p>'}
                </div>
            </div>
            `;
        }

        function renderInstructionsView() {
            return `
            <div class="max-w-3xl w-full bg-white p-6 sm:p-8 rounded-3xl card-shadow border border-cyan-100 space-y-6">
                <div class="flex items-center justify-between border-b border-cyan-50 pb-4">
                    <button onclick="appState.navigate('menu')" class="px-4 py-2 bg-slate-50 text-slate-600 rounded-xl font-bold hover:bg-slate-100 text-sm">⬅ Back</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">📖 HOW TO PLAY</h2>
                    <div></div>
                </div>

                <div class="space-y-4 text-sm text-slate-600 leading-relaxed">
                    <div class="p-4 bg-cyan-50 rounded-2xl border border-cyan-100 space-y-2">
                        <h3 class="font-extrabold text-cyan-800">1. Register and Log In</h3>
                        <p class="text-xs text-slate-600">Create an account with a username and password to save your progress.</p>
                    </div>

                    <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100 space-y-2">
                        <h3 class="font-extrabold text-blue-800">2. Choose a Topic and Difficulty</h3>
                        <p class="text-xs text-slate-600">Choose one of the four topics and a difficulty level.</p>
                    </div>

                    <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100 space-y-2">
                        <h3 class="font-extrabold text-emerald-800">3. Scoring and Feedback</h3>
                        <p class="text-xs text-slate-600">Each correct answer earns <strong>5 marks</strong>. The correct answer and an explanation appear after you answer.</p>
                    </div>

                    <div class="p-4 bg-amber-50 rounded-2xl border border-amber-100 space-y-2">
                        <h3 class="font-extrabold text-amber-800">4. Progress and Leaderboard</h3>
                        <p class="text-xs text-slate-600">View your progress and see how your score compares on the leaderboard.</p>
                    </div>
                </div>
            </div>
            `;
        }

        // ==========================================
        // 4. FEEDBACK MODAL & CONTROLLER HELPERS
        // ==========================================
        function showFeedbackModal(isCorrect, q) {
            const modalBg = document.createElement('div');
            modalBg.id = 'feedback-modal';
            modalBg.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            
            modalBg.innerHTML = `
            <div class="max-w-md w-full bg-white p-8 rounded-3xl card-shadow border ${isCorrect ? 'border-emerald-200' : 'border-rose-200'} text-center space-y-5 animate-bounce-slow">
                <div class="w-20 h-20 mx-auto rounded-3xl ${isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex items-center justify-center text-4xl shadow-md">
                    ${isCorrect ? '🎉' : '❌'}
                </div>
                <div class="space-y-1">
                    <h3 class="text-2xl font-extrabold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                        ${isCorrect ? 'CORRECT! +5 MARKS' : 'INCORRECT'}
                    </h3>
                    ${!isCorrect ? `<p class="text-xs font-bold text-slate-700 bg-slate-100 p-2 rounded-xl">Correct answer: ${q.jawapan}</p>` : ''}
                </div>
                <p class="text-xs text-slate-500 bg-cyan-50/50 p-4 rounded-2xl border border-cyan-100 leading-relaxed font-medium">
                    💡 <strong>Explanation:</strong> ${q.penerangan}
                </p>
                <button onclick="closeFeedbackModal()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold rounded-xl shadow-lg transition">
                    NEXT QUESTION ➔
                </button>
            </div>
            `;
            document.body.appendChild(modalBg);
        }

        function closeFeedbackModal() {
            const modal = document.getElementById('feedback-modal');
            if (modal) modal.remove();
            appState.nextQuestion();
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('time-left-val');
            if (timerEl) {
                timerEl.textContent = appState.timeLeft + 's';
            }
        }

        // Action handlers
        function handleLoginSubmit() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const res = appState.login(u, p);
            if (res.success) {
                appState.navigate('menu');
            } else {
                showCustomAlert(res.message);
            }
        }

        function handleRegisterSubmit() {
            const u = document.getElementById('reg-user').value.trim();
            const n = document.getElementById('reg-name').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            const res = appState.register(u, n, p);
            if (res.success) {
                showCustomAlert(res.message);
                appState.navigate('login');
            } else {
                showCustomAlert(res.message);
            }
        }

        function selectCategory(cat) {
            appState.selectedCategory = cat;
            appState.navigate('difficulty');
        }

        function selectDifficulty(diff) {
            appState.selectedDifficulty = diff;
            appState.navigate('timer');
        }

        function startQuizFinal(sec) {
            appState.startQuiz(appState.selectedCategory, appState.selectedDifficulty, sec);
        }

        function submitAnswerVal(val) {
            appState.submitAnswer(val);
        }

        function submitSubjective() {
            const inp = document.getElementById('subjective-input');
            if (inp) {
                appState.submitAnswer(inp.value.trim());
            }
        }

        function showCustomAlert(msg) {
            const alertBox = document.createElement('div');
            alertBox.className = 'fixed top-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl z-50 text-xs font-bold border border-slate-700 animate-bounce-slow';
            alertBox.textContent = msg;
            document.body.appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 3000);
        }

        function escapeHtml(str) {
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Initialize default app on window load
        window.onload = function() {
            // Seed a default demo user if none exists
            if (Object.keys(appState.users).length === 0) {
                appState.register("aiman123", "Aiman Hakim", "123456");
            }
            appState.navigate('login');
        };
    </script>

</body>
</html>
