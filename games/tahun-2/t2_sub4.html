    <script>
        const categories = [
            { id: 1, title: "Telling the Time", icon: "⏰", desc: "Read an analogue clock using the hour and minute hands." },
            { id: 2, title: "Recording the Time", icon: "🕐", desc: "Match analogue and digital times." },
            { id: 3, title: "Units of Time", icon: "🔄", desc: "Relate hours, minutes, days, weeks and months." },
            { id: 4, title: "Completing Number Sentences", icon: "🧩", desc: "Complete calculations with hours and minutes." },
            { id: 5, title: "Word Problems", icon: "🧠", desc: "Solve everyday problems involving duration and start and finish times." }
        ];

        const levels = [
            { id: 'mudah', title: '🟢 Easy', desc: 'Recall and understand the basics of time' },
            { id: 'sederhana', title: '🟡 Medium', desc: 'Read times in five-minute intervals' },
            { id: 'sukar', title: '🔴 Hard', desc: 'Calculate durations and solve time problems' }
        ];

        const gameModes = [
            { id: 'objektif', title: '🎯 Multiple Choice', desc: 'Choose the correct answer from four options' },
            { id: 'padanan', title: '🔗 Matching', desc: 'Match the clock to the correct time' },
            { id: 'dragdrop', title: '🖱️ Drag and Drop', desc: 'Move the answer into the empty box' },
            { id: 'isikosong', title: '✏️ Fill in the Blank', desc: 'Enter or choose a short answer' },
            { id: 'campuran', title: '🎮 Mixed Modes', desc: 'Play a mix of question formats' }
        ];

        const timeLimits = [
            { id: 30, title: '⏱️ 30 Seconds', secs: 30 },
            { id: 60, title: '⏱️ 1 Minute', secs: 60 },
            { id: 0, title: '♾️ No Time Limit', secs: 0 }
        ];

        function generateQuestionBank() {
            const bank = {};
            const names = ['Ali', 'Siti', 'Ahmad', 'Mei Ling', 'Rani', 'John', 'Fatimah', 'Zul'];
            
            categories.forEach(cat => {
                bank[cat.id] = {};
                levels.forEach(lvl => {
                    bank[cat.id][lvl.id] = [];
                    for (let i = 1; i <= 20; i++) {
                        let q = generateSingleQuestion(cat.id, lvl.id, i, names);
                        bank[cat.id][lvl.id].push(q);
                    }
                });
            });
            return bank;
        }

        function generateSingleQuestion(catId, lvlId, index, names) {
            const name = names[index % names.length];
            let qObj = {
                id: `Q-${catId}-${lvlId}-${index}`,
                category: catId,
                level: lvlId,
                score: 5,
                explanation: "Use the relationship between these units of time."
            };

            if (catId === 1) { // Telling the Time
                if (lvlId === 'mudah') {
                    const hours = (index % 12) + 1;
                    qObj.question = `What time does this analogue clock show?`;
                    qObj.clockTime = { hour: hours, minute: 0 };
                    const correctStr = `${hours}:00`;
                    qObj.answer = correctStr;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([
                        correctStr,
                        `${hours % 12 + 1}:${String(qObj.clockTime.minute).padStart(2, '0')}`,
                        `${hours}:${String((qObj.clockTime.minute + 15) % 60).padStart(2, '0')}`,
                        `${hours}:${String((qObj.clockTime.minute + 30) % 60).padStart(2, '0')}`
                    ]);
                    qObj.explanation = `The hour hand points to ${hours} and the minute hand points to 12. It is ${hours} o’clock.`;
                } else if (lvlId === 'sederhana') {
                    const hours = (index % 12) + 1;
                    const mins = (index % 4) * 15; // 0, 15, 30, 45
                    qObj.question = `The minute hand points to ${(mins===0?12:mins/5)}. Look at the hour hand too. What time is it?`;
                    qObj.clockTime = { hour: hours, minute: mins };
                    const correctStr = `${hours}:${mins < 10 ? '0'+mins : mins}`;
                    qObj.answer = correctStr;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([
                        correctStr,
                        `${hours % 12 + 1}:${String(qObj.clockTime.minute).padStart(2, '0')}`,
                        `${hours}:${String((qObj.clockTime.minute + 15) % 60).padStart(2, '0')}`,
                        `${hours}:${String((qObj.clockTime.minute + 30) % 60).padStart(2, '0')}`
                    ]);
                    qObj.explanation = `Count in fives around the clock. A quarter of an hour is 15 minutes and half an hour is 30 minutes.`;
                } else { // sukar
                    const hours = (index % 12) + 1;
                    const mins = ((index * 5) % 12) * 5;
                    qObj.question = `Look at the hour and minute hands. What time does the clock show?`;
                    qObj.clockTime = { hour: hours, minute: mins };
                    const correctStr = `${hours}:${mins < 10 ? '0'+mins : mins}`;
                    qObj.answer = correctStr;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([
                        correctStr,
                        `${hours % 12 + 1}:${String(qObj.clockTime.minute).padStart(2, '0')}`,
                        `${hours}:${String((qObj.clockTime.minute + 15) % 60).padStart(2, '0')}`,
                        `${hours}:${String((qObj.clockTime.minute + 30) % 60).padStart(2, '0')}`
                    ]);
                    qObj.explanation = `Read the hour first. Count in fives from 12 to read the minutes. The time is ${correctStr}.`;
                }
            } else if (catId === 2) { // Recording the Time
                if (lvlId === 'mudah') {
                    const h = (index % 12) + 1;
                    qObj.question = `Match the analogue clock to the correct digital time.`;
                    qObj.clockTime = { hour: h, minute: 0 };
                    qObj.answer = `${h}:00`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`${h}:00`, `${h}:30`, `${(h%12)+1}:00`, `${(h+2)%12+1}:15`]);
                    qObj.explanation = `The minute hand points to 12, so the time is exactly on the hour.`;
                } else if (lvlId === 'sederhana') {
                    const h = (index % 12) + 1;
                    qObj.question = `${name} sees that it is half past ${h} in the morning. How should this time be written?`;
                    qObj.clockTime = { hour: h, minute: 30 };
                    qObj.answer = `${h}:30 a.m.`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`${h}:30 a.m.`, `${h}:15 a.m.`, `${(h%12)+1}:30 a.m.`, `${h}:00 a.m.`]);
                    qObj.explanation = `Half an hour is 30 minutes. Write the time as ${h}:30 a.m.`;
                } else {
                    const h = (index % 11) + 1;
                    qObj.question = `This clock shows a time after noon. What is the correct digital time?`;
                    qObj.clockTime = { hour: h, minute: 30 };
                    qObj.answer = `${h}:30 p.m.`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`${h}:30 p.m.`, `${h}:00 p.m.`, `${(h%12)+1}:30 p.m.`, `${h}:15 p.m.`]);
                    qObj.explanation = `The minute hand points to 6, so the time is half past the hour. Use p.m. for times after noon.`;
                }
            } else if (catId === 3) { // Units of Time
                if (lvlId === 'mudah') {
                    const val = index % 3;
                    if (val === 0) {
                        qObj.question = `How many minutes are in 1 hour?`;
                        qObj.answer = `60 minutes`;
                        qObj.options = shuffleArray([`60 minutes`, `30 minutes`, `24 minutes`, `12 minutes`]);
                    } else if (val === 1) {
                        qObj.question = `How many hours are in 1 day?`;
                        qObj.answer = `24 hours`;
                        qObj.options = shuffleArray([`24 hours`, `12 hours`, `60 hours`, `7 hours`]);
                    } else {
                        qObj.question = `How many days are in 1 week?`;
                        qObj.answer = `7 days`;
                        qObj.options = shuffleArray([`7 days`, `30 days`, `12 days`, `24 days`]);
                    }
                    qObj.type = 'objektif';
                } else if (lvlId === 'sederhana') {
                    const val = index % 3;
                    if (val === 0) {
                        qObj.question = `How many minutes are in half an hour?`;
                        qObj.answer = `30 minutes`;
                        qObj.options = shuffleArray([`30 minutes`, `15 minutes`, `45 minutes`, `60 minutes`]);
                    } else if (val === 1) {
                        qObj.question = `How many minutes are in a quarter of an hour?`;
                        qObj.answer = `15 minutes`;
                        qObj.options = shuffleArray([`15 minutes`, `30 minutes`, `10 minutes`, `20 minutes`]);
                    } else {
                        qObj.question = `How many months are in 1 year?`;
                        qObj.answer = `12 months`;
                        qObj.options = shuffleArray([`12 months`, `7 months`, `24 months`, `365 months`]);
                    }
                    qObj.type = 'objektif';
                } else {
                    qObj.question = `How many minutes are in 2 hours?`;
                    qObj.answer = `120 minutes`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`120 minutes`, `60 minutes`, `90 minutes`, `180 minutes`]);
                    qObj.explanation = `1 hour is 60 minutes, so 2 hours is 60 + 60 = 120 minutes.`;
                }
            } else if (catId === 4) { // KATEGORI 4: LENGKAPKAN AYAT MATEMATIK (REFINED: COMPLETELY UNIQUE, TEXT-ONLY, NO DUPLICATES)
                const uniqueQuestions = {
                    mudah: [
                        { q: "60 minutes = ____ hour(s).", ans: "1", opts: ["1", "2", "60", "12"], exp: "There are 60 minutes in 1 hour." },
                        { q: "30 minutes = ____ hour(s).", ans: "1/2", opts: ["1/2", "1/4", "1", "2"], exp: "30 minutes is half an hour." },
                        { q: "15 minutes = ____ hour(s).", ans: "1/4", opts: ["1/4", "1/2", "1", "3"], exp: "15 minutes is a quarter of an hour." },
                        { q: "7 days = ____ week(s).", ans: "1", opts: ["1", "7", "24", "30"], exp: "There are 7 days in 1 week." },
                        { q: "24 hours = ____ day(s).", ans: "1", opts: ["1", "24", "7", "12"], exp: "There are 24 hours in 1 day." },
                        { q: "12 months = ____ year(s).", ans: "1", opts: ["1", "12", "365", "24"], exp: "There are 12 months in 1 year." },
                        { q: "1 hour + 1 hour = ____ hour(s).", ans: "2", opts: ["2", "1", "3", "60"], exp: "1 + 1 = 2 hours." },
                        { q: "4 hours − 1 hour = ____ hour(s).", ans: "3", opts: ["3", "4", "2", "5"], exp: "4 − 1 = 3 hours." },
                        { q: "From 8:00 a.m. to 9:00 a.m. is ____ hour(s).", ans: "1", opts: ["1", "2", "60", "30"], exp: "From 8:00 a.m. to 9:00 a.m. is 1 hour." },
                        { q: "From 2:00 p.m. to 2:30 p.m. is ____ minutes.", ans: "30", opts: ["30", "15", "60", "45"], exp: "From 2:00 p.m. to 2:30 p.m. is 30 minutes." },
                        { q: "A school opens from Monday through Friday. It opens for ____ days each week.", ans: "5", opts: ["5", "7", "2", "6"], exp: "Counting Monday, Tuesday, Wednesday, Thursday and Friday gives 5 days." },
                        { q: "Saturday and Sunday make up a weekend of ____ days.", ans: "2", opts: ["2", "5", "7", "1"], exp: "Saturday and Sunday are 2 days altogether." },
                        { q: "2 hours = ____ minutes.", ans: "120", opts: ["120", "60", "90", "180"], exp: "2 × 60 = 120 minutes." },
                        { q: "Half an hour = ____ minutes.", ans: "30", opts: ["30", "15", "60", "45"], exp: "Half of 60 is 30 minutes." },
                        { q: "A quarter of an hour = ____ minutes.", ans: "15", opts: ["15", "30", "60", "10"], exp: "60 ÷ 4 = 15 minutes." },
                        { q: "14 days = ____ weeks.", ans: "2", opts: ["2", "1", "7", "14"], exp: "14 ÷ 7 = 2 weeks." },
                        { q: "1 day = ____ hours.", ans: "24", opts: ["24", "12", "60", "7"], exp: "There are 24 hours in one full day." },
                        { q: "2 years = ____ months.", ans: "24", opts: ["24", "12", "36", "18"], exp: "2 × 12 = 24 months." },
                        { q: "1 week = ____ days.", ans: "7", opts: ["7", "30", "12", "24"], exp: "There are 7 days in a week." },
                        { q: "1 minute = ____ seconds.", ans: "60", opts: ["60", "24", "12", "100"], exp: "There are 60 seconds in 1 minute." }
                    ],
                    sederhana: [
                        { q: "3 hours + 2 hours = ____ hours.", ans: "5", opts: ["5", "3", "6", "1"], exp: "3 + 2 = 5 hours." },
                        { q: "6 hours − 3 hours = ____ hours.", ans: "3", opts: ["3", "2", "4", "6"], exp: "6 − 3 = 3 hours." },
                        { q: "3 hours = ____ minutes.", ans: "180", opts: ["180", "120", "150", "90"], exp: "3 × 60 = 180 minutes." },
                        { q: "3 weeks = ____ days.", ans: "21", opts: ["21", "14", "28", "7"], exp: "3 × 7 = 21 days." },
                        { q: "20 minutes + 40 minutes = ____ hour(s).", ans: "1", opts: ["1", "60", "2", "30"], exp: "20 + 40 = 60 minutes, or 1 hour." },
                        { q: "60 minutes − 15 minutes = ____ minutes.", ans: "45", opts: ["45", "30", "50", "15"], exp: "60 − 15 = 45 minutes." },
                        { q: "At 4:30, ____ minutes have passed since 4 o’clock.", ans: "30", opts: ["30", "15", "45", "60"], exp: "4:30 is 30 minutes past 4 o’clock." },
                        { q: "From 1:00 p.m. to 5:00 p.m. is ____ hours.", ans: "4", opts: ["4", "5", "3", "6"], exp: "5 − 1 = 4 hours." },
                        { q: "36 months = ____ years.", ans: "3", opts: ["3", "2", "4", "12"], exp: "36 ÷ 12 = 3 years." },
                        { q: "120 minutes = ____ hours.", ans: "2", opts: ["2", "1", "3", "4"], exp: "120 ÷ 60 = 2 hours." },
                        { q: "5 days + 2 days = ____ week(s).", ans: "1", opts: ["1", "7", "2", "5"], exp: "5 + 2 = 7 days, or 1 week." },
                        { q: "Ten hours have passed since the start of the day. There are ____ hours left in the day.", ans: "14", opts: ["14", "12", "10", "24"], exp: "24 − 10 = 14 hours." },
                        { q: "3 quarters of an hour = ____ minutes.", ans: "45", opts: ["45", "30", "15", "60"], exp: "3 × 15 = 45 minutes." },
                        { q: "180 minutes = ____ hours.", ans: "3", opts: ["3", "2", "4", "1"], exp: "180 ÷ 60 = 3 hours." },
                        { q: "Two hours after 3:00 p.m. is ____ p.m.", ans: "5:00", opts: ["5:00", "4:00", "6:00", "3:00"], exp: "3:00 p.m. plus 2 hours is 5:00 p.m." },
                        { q: "Three hours before 10:00 a.m. is ____ a.m.", ans: "7:00", opts: ["7:00", "8:00", "6:00", "9:00"], exp: "Taking away 3 hours from 10:00 a.m. gives 7:00 a.m." },
                        { q: "4 weeks = ____ days.", ans: "28", opts: ["28", "21", "14", "30"], exp: "4 × 7 = 28 days." },
                        { q: "30 minutes + 30 minutes = ____ hour(s).", ans: "1", opts: ["1", "2", "60", "0"], exp: "30 + 30 = 60 minutes, or 1 hour." },
                        { q: "4 hours = ____ minutes.", ans: "240", opts: ["240", "180", "120", "300"], exp: "4 × 60 = 240 minutes." },
                        { q: "Three days after Monday is ____.", ans: "Thursday", opts: ["Thursday", "Wednesday", "Friday", "Tuesday"], exp: "Count Tuesday, Wednesday and Thursday." }
                    ],
                    sukar: [
                        { q: "Write 90 minutes in hours and minutes.", ans: "1 hour 30 minutes", opts: ["1 hour 30 minutes", "1 hour 15 minutes", "2 hours 30 minutes", "1 hour 45 minutes"], exp: "90 minutes = 60 minutes + 30 minutes, or 1 hour 30 minutes." },
                        { q: "Write 75 minutes in hours and minutes.", ans: "1 hour 15 minutes", opts: ["1 hour 15 minutes", "1 hour 30 minutes", "1 hour 10 minutes", "2 hours 15 minutes"], exp: "75 minutes = 60 minutes + 15 minutes, or 1 hour 15 minutes." },
                        { q: "Write 105 minutes in hours and minutes.", ans: "1 hour 45 minutes", opts: ["1 hour 45 minutes", "1 hour 30 minutes", "2 hours 15 minutes", "1 hour 15 minutes"], exp: "105 minutes = 60 minutes + 45 minutes, or 1 hour 45 minutes." },
                        { q: "1 hour 20 minutes + 40 minutes = ____ hours.", ans: "2 hours", opts: ["2 hours", "1 hour 30 minutes", "3 hours", "1 hour 45 minutes"], exp: "20 + 40 = 60 minutes. Add this hour to the first hour to get 2 hours." },
                        { q: "2 hours 30 minutes − 30 minutes = ____ hours.", ans: "2 hours", opts: ["2 hours", "1 hour 30 minutes", "2 hours 30 minutes", "1 hour"], exp: "Take away the 30 minutes to leave 2 hours." },
                        { q: "Add 1 hour 15 minutes and 1 hour 15 minutes.", ans: "2 hours 30 minutes", opts: ["2 hours 30 minutes", "2 hours", "3 hours", "1 hour 45 minutes"], exp: "The hours add to 2 and the minutes add to 30." },
                        { q: "Write 150 minutes in hours and minutes.", ans: "2 hours 30 minutes", opts: ["2 hours 30 minutes", "2 hours 15 minutes", "1 hour 30 minutes", "3 hours"], exp: "150 minutes = 120 minutes + 30 minutes, or 2 hours 30 minutes." },
                        { q: "Write 210 minutes in hours and minutes.", ans: "3 hours 30 minutes", opts: ["3 hours 30 minutes", "3 hours", "2 hours 30 minutes", "4 hours"], exp: "210 minutes = 180 minutes + 30 minutes, or 3 hours 30 minutes." },
                        { q: "21 days = ____ weeks.", ans: "3 weeks", opts: ["3 weeks", "2 weeks", "4 weeks", "5 weeks"], exp: "21 ÷ 7 = 3 weeks." },
                        { q: "28 days = ____ weeks.", ans: "4 weeks", opts: ["4 weeks", "3 weeks", "5 weeks", "2 weeks"], exp: "28 ÷ 7 = 4 weeks." },
                        { q: "How many hours are in 2 days?", ans: "48 hours", opts: ["48 hours", "24 hours", "36 hours", "60 hours"], exp: "24 × 2 = 48 hours." },
                        { q: "How many days pass from the start of 1 May to the start of 8 May?", ans: "7 days", opts: ["7 days", "8 days", "6 days", "5 days"], exp: "8 − 1 = 7 days." },
                        { q: "3 years 6 months = ____ months.", ans: "42 months", opts: ["42 months", "36 months", "40 months", "48 months"], exp: "3 × 12 + 6 = 42 months." },
                        { q: "2 years 3 months = ____ months.", ans: "27 months", opts: ["27 months", "24 months", "25 months", "30 months"], exp: "2 × 12 + 3 = 27 months." },
                        { q: "What is the difference between 2 hours and 90 minutes?", ans: "30 minutes", opts: ["30 minutes", "60 minutes", "15 minutes", "45 minutes"], exp: "120 − 90 = 30 minutes." },
                        { q: "An activity runs from 2:00 p.m. to 4:30 p.m. How long does it last?", ans: "2 hours 30 minutes", opts: ["2 hours 30 minutes", "2 hours", "3 hours", "1 hour 30 minutes"], exp: "Two hours to 4:00 p.m. and 30 more minutes gives 2 hours 30 minutes." },
                        { q: "1 hour + half an hour = ____ minutes.", ans: "90 minutes", opts: ["90 minutes", "60 minutes", "75 minutes", "120 minutes"], exp: "60 + 30 = 90 minutes." },
                        { q: "2 hours − half an hour = ____ minutes.", ans: "90 minutes", opts: ["90 minutes", "120 minutes", "60 minutes", "100 minutes"], exp: "120 − 30 = 90 minutes." },
                        { q: "1 week 3 days = ____ days.", ans: "10 days", opts: ["10 days", "7 days", "14 days", "12 days"], exp: "7 + 3 = 10 days." },
                        { q: "Write 50 hours in days and hours.", ans: "2 days 2 hours", opts: ["2 days 2 hours", "2 days", "1 day 24 hours", "3 days"], exp: "48 hours makes 2 days, with 2 hours left." }
                    ]
                };

                const subQList = uniqueQuestions[lvlId];
                const selectedData = subQList[(index - 1) % subQList.length];

                qObj.question = selectedData.q;
                qObj.answer = selectedData.ans;
                qObj.type = 'objektif';
                qObj.options = shuffleArray(selectedData.opts);
                qObj.explanation = selectedData.exp;
            } else if (catId === 5) { // KATEGORI 5: PENYELESAIAN MASALAH (REFINED: TEXT-ONLY, UNIQUE, NO DUPLICATES ACROSS LEVELS)

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderAnalogClockSVG(hour, minute) {
            const hourDeg = (hour % 12) * 30 + (minute / 60) * 30;
            const minDeg = minute * 6;

            return `
                <div class="analog-clock-container my-4">
                    <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                        <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#3b82f6" stroke-width="8" />
                        <circle cx="100" cy="100" r="88" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
                        
                        ${[...Array(12)].map((_, i) => {
                            const angle = (i + 1) * 30 * (Math.PI / 180);
                            const x1 = 100 + 75 * Math.sin(angle);
                            const y1 = 100 - 75 * Math.cos(angle);
                            const x2 = 100 + 84 * Math.sin(angle);
                            const y2 = 100 - 84 * Math.cos(angle);
                            const tx = 100 + 62 * Math.sin(angle);
                            const ty = 100 - 62 * Math.cos(angle);
                            const num = i + 1;
                            return `
                                <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#334155" stroke-width="3" stroke-linecap="round" />
                                <text x="${tx}" y="${ty + 5}" font-family="Fredoka" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">${num}</text>
                            `;
                        }).join('')}

                        ${[...Array(60)].map((_, i) => {
                            if (i % 5 === 0) return '';
                            const angle = i * 6 * (Math.PI / 180);
                            const x1 = 100 + 80 * Math.sin(angle);
                            const y1 = 100 - 80 * Math.sin(angle);
                            const x2 = 100 + 84 * Math.sin(angle);
                            const y2 = 100 - 84 * Math.sin(angle);
                            return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#cbd5e1" stroke-width="1.5" />`;
                        }).join('')}

                        <line x1="100" y1="100" x2="${100 + 45 * Math.sin(hourDeg * Math.PI / 180)}" y2="${100 - 45 * Math.cos(hourDeg * Math.PI / 180)}" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
                        <line x1="100" y1="100" x2="${100 + 65 * Math.sin(minDeg * Math.PI / 180)}" y2="${100 - 65 * Math.cos(minDeg * Math.PI / 180)}" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
                        <circle cx="100" cy="100" r="6" fill="#3b82f6" />
                    </svg>
                </div>
            `;
        }

        function escapeQuotes(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function initGameTimer() {
            if (appState.selectedTimeLimit <= 0) return;
            appState.timeLeft = appState.selectedTimeLimit;
            if (appState.timer) clearInterval(appState.timer);

            appState.timer = setInterval(() => {
                appState.timeLeft--;
                const badge = document.getElementById('timer-badge');
                if (badge) badge.innerText = `⏱️ ${appState.timeLeft}s`;

                if (appState.timeLeft <= 0) {
                    clearInterval(appState.timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            const q = appState.gameQuestions[appState.currentQuestionIndex];
            appState.incorrectCount++;
            showModal("⏰ Time’s up!", `The time limit has passed.\nThe correct answer is: ${q.answer}\n\n${q.explanation}`, false, nextQuestion);
        }

        function submitAnswer(selectedOpt) {
            if (appState.timer) clearInterval(appState.timer);
            const q = appState.gameQuestions[appState.currentQuestionIndex];
            
            const isCorrect = String(selectedOpt).trim().toLowerCase() === String(q.answer).trim().toLowerCase();

            if (isCorrect) {
                appState.score += 5;
                appState.correctCount++;
                showModal("🎉 Well done! Correct!", `Your answer is correct.\n\n${q.explanation}`, true, nextQuestion);
            } else {
                appState.incorrectCount++;
                showModal("❌ Try Again", `The correct answer is: ${q.answer}\n\n${q.explanation}`, false, nextQuestion);
            }
        }

        function nextQuestion() {
            appState.currentQuestionIndex++;
            if (appState.currentQuestionIndex >= appState.gameQuestions.length || appState.currentQuestionIndex >= 20) {
                finishGame();
            } else {
                render();
            }
        }

        function finishGame() {
            if (appState.timer) clearInterval(appState.timer);
            
            if (appState.currentUser) {
                let users = getUsers();
                if (users[appState.currentUser]) {
                    let u = users[appState.currentUser];
                    u.totalScore += appState.score;
                    u.totalGames += 1;
                    u.totalQuestions += (appState.correctCount + appState.incorrectCount);
                    u.correctAnswers += appState.correctCount;
                    u.incorrectAnswers += appState.incorrectCount;

                    if (!u.categoryProgress) u.categoryProgress = {};
                    let catId = appState.selectedCategory;
                    if (!u.categoryProgress[catId]) u.categoryProgress[catId] = { answered: 0, correct: 0 };
                    u.categoryProgress[catId].answered += (appState.correctCount + appState.incorrectCount);
                    u.categoryProgress[catId].correct += appState.correctCount;

                    users[appState.currentUser] = u;
                    saveUsers(users);
                }
            }

            appState.navigateTo('result');
        }

            const users = getUsers();

            })).sort((a, b) => b.totalScore - a.totalScore);

            return `
                <div class="max-w-2xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-white">
                    <div class="text-center mb-6">
                        <div class="text-4xl mb-2">🏆</div>
                        <h3 class="kid-font text-3xl font-bold text-slate-800">Player Leaderboard</h3>
                        <p class="text-xs text-slate-500">Top Scores from Math Kids Players</p>
                    </div>

                    <div class="space-y-3 mb-6 max-h-96 overflow-y-auto pr-1">
                        ${sortedUsers.length === 0 ? `
                            <p class="text-center text-slate-400 text-sm py-8">No registered players yet. Create an account to play!</p>
                        ` : sortedUsers.map((u, index) => {
                            let badge = `#${index + 1}`;
                            let badgeBg = 'bg-slate-100 text-slate-600';
                            if (index === 0) { badge = '🥇 1'; badgeBg = 'bg-amber-100 text-amber-700 border border-amber-300'; }
                            else if (index === 1) { badge = '🥈 2'; badgeBg = 'bg-slate-200 text-slate-700 border border-slate-300'; }
                            else if (index === 2) { badge = '🥉 3'; badgeBg = 'bg-orange-100 text-orange-700 border border-orange-300'; }

                            const acc = u.totalQuestions > 0 ? Math.round((u.correctAnswers / u.totalQuestions) * 100) : 0;

                            return `
                                <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-200 shadow-sm">
                                    <div class="flex items-center space-x-3">
                                        <span class="w-10 h-10 rounded-xl ${badgeBg} flex items-center justify-center font-bold text-sm">${badge}</span>
                                        <div>
                                            <h4 class="kid-font font-bold text-base text-slate-800">${u.name}</h4>
                                            <p class="text-xs text-slate-500">${u.totalGames} games • Accuracy: ${acc}%</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="kid-font font-bold text-lg text-blue-600">${u.totalScore}</span>
                                        <span class="text-xs text-slate-400 block">points</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="text-center">
                        <button onclick="appState.navigateTo('home')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2.5 rounded-2xl text-xs font-bold transition">
                            ⬅️ Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function handleRegister(e) {
            e.preventDefault();
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            
            let users = getUsers();
            if (users[user]) {
                showModal("⚠️ Registration Error", "That username is taken. Choose another or log in.", false);
                return;
            }

            users[user] = {
                password: pass,
                totalScore: 0,
                totalGames: 0,
                totalQuestions: 0,
                correctAnswers: 0,
                incorrectAnswers: 0,
                categoryProgress: {}
            };
            saveUsers(users);

            appState.currentUser = user;
            showModal("🎉 Account Created!", `Welcome, ${user}! Your account is ready.`, true, () => {
                closeModal();
                appState.navigateTo('dashboard');
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            let users = getUsers();
            if (!users[user] || users[user].password !== pass) {
                showModal("❌ Login Failed", "Incorrect username or password. Please try again.", false);
                return;
            }

            appState.currentUser = user;
            showModal("🚀 Logged In", `Welcome back, ${user}!`, true, () => {
                closeModal();
                appState.navigateTo('dashboard');
            });
        }

        function logoutUser() {
            appState.currentUser = null;
            showModal("🚪 Log Out", "You have logged out.", true, () => {
                closeModal();
                appState.navigateTo('home');
            });
        }

        function checkAuthAndProceed(targetView) {
            if (!appState.currentUser) {
                showModal("👤 Login Required", "Log in or create an account to save your scores and progress.", false, () => {
                    closeModal();
                    appState.navigateTo('login');
                });
            } else {
                appState.navigateTo(targetView);
            }
        }

        let modalCallback = null;
        function showModal(title, message, isSuccess = true, callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = isSuccess ? '🎉' : '⚠️';
            modalCallback = callback;

            const box = document.getElementById('modal-box');
            const container = document.getElementById('modal-container');
            container.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const box = document.getElementById('modal-box');
            const container = document.getElementById('modal-container');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                container.classList.add('hidden');
                if (modalCallback) {
                    let cb = modalCallback;
                    modalCallback = null;
                    cb();
                }
            }, 200);
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
