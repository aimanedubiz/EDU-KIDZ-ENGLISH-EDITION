        // Sound generator using Web Audio API (No external URLs needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!gameState.audioEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'win') {
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                        o.start();
                        o.stop(audioCtx.currentTime + 0.2);
                    }, idx * 100);
                });
            }
        }

                            <div onclick="selectDifficulty('${d.id}')" class="border-2 ${d.color} p-4 rounded-2xl shadow cursor-pointer transition text-left hover:scale-[1.01] flex items-center justify-between">
                                <div>
                                    <h3 class="font-bold text-lg">${d.title}</h3>
                                    <p class="text-xs opacity-90">${d.desc}</p>
                                </div>
                                <span class="bg-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">PLAY ▶</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTimerMenu() {
            const times = [
                { val: 30, title: '⏱️ 30 SECONDS', desc: 'Quick challenge' },
                { val: 60, title: '⏱️ 1 MINUTE', desc: 'Standard time limit' },
                { val: 0, title: '♾️ NO TIME LIMIT', desc: 'Take as much time as you need' }
            ];

            return `
                <div class="game-card p-6 sm:p-8 w-full max-w-xl mx-auto mt-4 text-center">
                    <button onclick="playSound('click'); switchScreen('difficulty')" class="float-left bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm mb-4">
                        ⬅️ Tahap
                    </button>
                    <div class="clear-both"></div>
                    <h2 class="text-2xl font-bold text-blue-600 mb-2">CHOOSE A TIME LIMIT</h2>
                    <p class="text-sm text-gray-600 mb-6">Choose a time limit for this session.</p>

                    <div class="space-y-4">
                        ${times.map(t => `
                            <div onclick="startGameSession(${t.val})" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white p-5 rounded-2xl shadow-lg cursor-pointer transition transform hover:scale-[1.02] flex items-center justify-between">
                                <div>
                                    <h3 class="font-bold text-xl">${t.title}</h3>
                                    <p class="text-xs text-white/90">${t.desc}</p>
                                </div>
                                <span class="bg-white/20 px-4 py-2 rounded-xl text-sm font-bold">START GAME 🚀</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderGamePlayScreen() {
            const q = gameState.questions[gameState.currentQuestionIndex];
            const progressPercent = ((gameState.currentQuestionIndex) / gameState.questions.length) * 100;

            return `
                <div class="game-card p-5 sm:p-8 w-full max-w-2xl mx-auto mt-2">
                    <!-- Top Game HUD -->
                    <div class="flex justify-between items-center mb-4 text-sm font-bold">
                        <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-xl">Question: ${gameState.currentQuestionIndex + 1}/${gameState.questions.length}</span>
                        <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-xl">⭐ Score: ${gameState.score}/${gameState.questions.length * 5}</span>
                        <span class="bg-red-100 text-red-700 px-3 py-1 rounded-xl" id="timerDisplay">⏱️ ${gameState.timeLeft === 0 ? '♾️' : gameState.timeLeft + 's'}</span>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-200 h-3 rounded-full mb-6 overflow-hidden">
                        <div class="bg-gradient-to-r from-blue-500 to-green-500 h-3 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                    </div>

                    <!-- Streak Display -->
                    ${gameState.streak >= 3 ? `<div class="text-center mb-3"><span class="bg-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full animate-bounce">🔥 Streak: ${gameState.streak} in a row!</span></div>` : ''}

                    <!-- Question Box & Illustration -->
                    <div class="bg-blue-50/70 p-5 rounded-2xl mb-6 text-center border border-blue-100">
                        ${renderShapeIllustration(q.shape)}
                        <h3 class="text-lg sm:text-xl font-bold text-gray-800 mt-4">${q.q}</h3>
                    </div>

                    <!-- Options / Answer Area -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="optionsContainer">
                        ${q.options.map((opt, idx) => `
                            <button onclick="checkAnswer(${idx})" class="option-btn bg-white hover:bg-blue-50 border-2 border-indigo-100 hover:border-blue-400 p-4 rounded-2xl shadow font-semibold text-gray-700 text-base transition transform active:scale-95 text-left flex items-center justify-between">
                                <span>${String.fromCharCode(65 + idx)}. ${opt}</span>
                                <span class="w-7 h-7 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">${String.fromCharCode(65 + idx)}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Feedback Modal Overlay (Hidden by default) -->
                    <div id="feedbackModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                        <div class="bg-white p-6 rounded-3xl max-w-md w-full text-center shadow-2xl animate-bounce-short" id="feedbackContent">
                            <!-- Dynamic Feedback content -->
                        </div>
                    </div>
                </div>
            `;
        }

        function renderResultScreen() {
            const user = gameState.currentUser;
            const accuracy = Math.round((gameState.correctCount / gameState.questions.length) * 100);
            
            // Check & award badges
            if (!user.badges) user.badges = [];
            if (accuracy >= 80 && !user.badges.includes('Shape Champion')) user.badges.push('Shape Champion');
            if (gameState.selectedTopic === 1 && !user.badges.includes('3D Master')) user.badges.push('3D Master');
            if (gameState.selectedTopic === 4 && !user.badges.includes('2D Detective')) user.badges.push('2D Detective');
            if (gameState.selectedTopic === 3 && !user.badges.includes('Net Builder')) user.badges.push('Net Builder');
            if (gameState.selectedTopic === 5 && !user.badges.includes('Shape Problem Solver')) user.badges.push('Shape Problem Solver');

            if (gameState.score > (user.highScore || 0)) {
                user.highScore = gameState.score;
            }
            user.totalPlayed = (user.totalPlayed || 0) + 1;
            user.totalCorrect = (user.totalCorrect || 0) + gameState.correctCount;
            user.totalWrong = (user.totalWrong || 0) + gameState.wrongCount;
            saveUsers();

            return `
                <div class="game-card p-6 sm:p-8 w-full max-w-lg mx-auto text-center mt-4">
                    <div class="text-5xl mb-2">🏆</div>
                    <h2 class="text-2xl font-extrabold text-indigo-600 mb-1">GAME COMPLETE!</h2>
                    <p class="text-sm text-gray-600 mb-6">Great work, ${user.name}!</p>

                    <div class="bg-blue-50 p-5 rounded-2xl mb-6 space-y-3 text-left border border-blue-100">
                        <div class="flex justify-between font-bold">
                            <span>⭐ Final Score:</span>
                            <span class="text-indigo-600 text-lg">${gameState.score} / ${gameState.questions.length * 5}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span>✅ Correct Answers:</span>
                            <span class="text-green-600 font-bold">${gameState.correctCount} / ${gameState.questions.length}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span>❌ Incorrect Answers:</span>
                            <span class="text-red-600 font-bold">${gameState.wrongCount} / ${gameState.questions.length}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span>🎯 Accuracy:</span>
                            <span class="text-blue-600 font-bold">${accuracy}%</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <button onclick="playSound('click'); switchScreen('timer')" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow hover:opacity-95 transition">
                            🔄 PLAY AGAIN
                        </button>
                        <button onclick="playSound('click'); switchScreen('menu')" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow hover:opacity-95 transition">
                            🏠 HOME
                        </button>
                        <button onclick="playSound('click'); switchScreen('progress')" class="bg-gradient-to-r from-purple-500 to-violet-600 text-white font-bold py-3 px-4 rounded-xl shadow hover:opacity-95 transition col-span-2">
                            📊 VIEW PROGRESS AND BADGES
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLeaderboardScreen() {
            const sortedUsers = [...gameState.users].sort((a, b) => (b.highScore || 0) - (a.highScore || 0));

            return `
                <div class="game-card p-6 sm:p-8 w-full max-w-xl mx-auto mt-4">
                    <button onclick="playSound('click'); switchScreen('menu')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm mb-4">
                        ⬅️ Menu Utama
                    </button>
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-amber-600">🏆 PLAYER LEADERBOARD</h2>
                        <p class="text-xs text-gray-600 mt-1">Top player scores</p>
                    </div>

                    <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
                        ${sortedUsers.length === 0 ? '<p class="text-center text-gray-500 py-4">No player scores yet.</p>' : ''}
                        ${sortedUsers.map((u, idx) => `
                            <div class="flex items-center justify-between p-4 rounded-2xl ${idx === 0 ? 'bg-yellow-100 border-2 border-yellow-400' : idx === 1 ? 'bg-gray-100 border-2 border-gray-300' : idx === 2 ? 'bg-amber-50 border-2 border-amber-300' : 'bg-white border'} shadow-sm">
                                <div class="flex items-center space-x-3">
                                    <span class="font-extrabold text-lg w-8 h-8 rounded-full bg-white flex items-center justify-center shadow">
                                        ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}
                                    </span>
                                    <div>
                                        <h4 class="font-bold text-gray-800">${u.name}</h4>
                                        <p class="text-xs text-gray-500">@${u.username}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="font-extrabold text-indigo-600 text-lg">⭐ ${u.highScore || 0}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProgressScreen() {
            const user = gameState.currentUser;
            const totalQ = (user.totalCorrect || 0) + (user.totalWrong || 0);
            const acc = totalQ > 0 ? Math.round(((user.totalCorrect || 0) / totalQ) * 100) : 0;
            const badges = user.badges || [];

            return `
                <div class="game-card p-6 sm:p-8 w-full max-w-xl mx-auto mt-4">
                    <button onclick="playSound('click'); switchScreen('menu')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm mb-4">
                        ⬅️ Menu Utama
                    </button>
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-purple-600">📊 PROGRESS AND BADGES</h2>
                        <p class="text-xs text-gray-600 mt-1">Learning progress for ${user.name}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-50 p-4 rounded-2xl text-center border border-blue-100">
                            <p class="text-xs text-gray-500">Games Played</p>
                            <p class="text-2xl font-bold text-blue-600 mt-1">${user.totalPlayed || 0}</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-2xl text-center border border-green-100">
                            <p class="text-xs text-gray-500">Average Accuracy</p>
                            <p class="text-2xl font-bold text-green-600 mt-1">${acc}%</p>
                        </div>
                    </div>

                    <div class="bg-indigo-50 p-5 rounded-2xl mb-4 border border-indigo-100">
                        <h3 class="font-bold text-indigo-700 mb-3 text-sm">🏅 Achievement Badges</h3>
                        <div class="flex flex-wrap gap-2">
                            ${badges.length === 0 ? '<span class="text-xs text-gray-500">Complete missions to earn badges.</span>' : ''}
                            ${badges.map(b => `
                                <span class="bg-white text-indigo-800 font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm flex items-center space-x-1">
                                    <span>🏅</span><span>${b}</span>
                                </span>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAccountScreen() {
            const user = gameState.currentUser;
            return `
                <div class="game-card p-6 sm:p-8 w-full max-w-md mx-auto mt-4 text-center">
                    <button onclick="playSound('click'); switchScreen('menu')" class="float-left bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl font-bold text-sm mb-4">
                        ⬅️ Menu Utama
                    </button>
                    <div class="clear-both"></div>
                    <div class="w-20 h-20 bg-blue-500 text-white rounded-full flex items-center justify-center text-4xl mx-auto shadow mb-3">
                        👦
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">${user.name}</h2>
                    <p class="text-sm text-blue-600 mb-6">@${user.username}</p>

                    <div class="bg-gray-50 p-4 rounded-2xl text-left space-y-2 mb-6 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Highest Score:</span>
                            <span class="font-bold text-indigo-600">⭐ ${user.highScore || 0}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Games Played:</span>
                            <span class="font-bold text-gray-800">${user.totalPlayed || 0}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Correct Answers:</span>
                            <span class="font-bold text-green-600">${user.totalCorrect || 0}</span>
                        </div>
                    </div>

                    <button onclick="handleLogout()" class="w-full bg-red-100 hover:bg-red-200 text-red-600 font-bold py-3 rounded-xl transition">
                        🚪 Log Out
                    </button>
                </div>
            `;
        }

        // ==========================================
        // GAME CONTROLLER ACTIONS
        // ==========================================
        function switchScreen(screen) {
            gameState.currentScreen = screen;
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            const found = gameState.users.find(u => u.username === username && u.password === pass);
            if (found) {
                gameState.currentUser = found;
                playSound('win');
                switchScreen('menu');
            } else {
                alert('Incorrect username or password. Try again or create an account.');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const pass = document.getElementById('regPassword').value.trim();

            if (gameState.users.some(u => u.username === username)) {
                alert('That username is taken. Please choose another.');
                return;
            }

            const newUser = {
                name,
                username,
                password: pass,
                highScore: 0,
                totalPlayed: 0,
                totalCorrect: 0,
                totalWrong: 0,
                badges: ['Shape Explorer']
            };

            gameState.users.push(newUser);
            saveUsers();
            gameState.currentUser = newUser;
            playSound('win');
            switchScreen('menu');
        }

        function handleLogout() {
            gameState.currentUser = null;
            switchScreen('login');
        }

        function selectTopic(topicId) {
            gameState.selectedTopic = topicId;
            switchScreen('gamemode');
        }

        function selectGameMode(modeId) {
            gameState.selectedGameMode = modeId;
            switchScreen('difficulty');
        }

        function selectDifficulty(diffId) {
            gameState.selectedDifficulty = diffId;
            switchScreen('timer');
        }

        function toggleAudio() {
            gameState.audioEnabled = !gameState.audioEnabled;
            const btn = document.getElementById('audioToggleBtn');
            if (btn) {
                btn.innerText = gameState.audioEnabled ? '🔊 ON' : '🔇 OFF';
                btn.className = gameState.audioEnabled ? 'bg-green-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs' : 'bg-gray-400 text-white px-3 py-1.5 rounded-xl font-bold text-xs';
            }
        }

        function startGameSession(timeLimit) {
            gameState.selectedTimeOption = timeLimit;
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.streak = 0;
            gameState.timeLeft = timeLimit;

            // Generate 20 unique random questions from bank
            const bank = questionBank[gameState.selectedTopic][gameState.selectedDifficulty];
            // Shuffle and pick 20
            const shuffled = [...bank].sort(() => 0.5 - Math.random());
            gameState.questions = shuffled.slice(0, 20);

            switchScreen('play');
            startTimer();
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            if (gameState.selectedTimeOption === 0) return; // Infinity

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                const timerEl = document.getElementById('timerDisplay');
                if (timerEl) timerEl.innerText = `⏱️ ${gameState.timeLeft}s`;

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            playSound('wrong');
            gameState.wrongCount++;
            gameState.streak = 0;
            const q = gameState.questions[gameState.currentQuestionIndex];
            showFeedbackModal(false, `Masa habis! The correct answer is: ${q.options[q.answer]}. ${q.explanation}`);
        }

        function checkAnswer(selectedIdx) {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            const q = gameState.questions[gameState.currentQuestionIndex];
            const isCorrect = (selectedIdx === q.answer);

            const modal = document.getElementById('feedbackModal');
            const content = document.getElementById('feedbackContent');

            if (isCorrect) {
                playSound('correct');
                gameState.correctCount++;
                gameState.score += 5; // 5 marks per question -> max 100
                gameState.streak++;
                if (gameState.streak % 3 === 0) playSound('win');

                content.innerHTML = `
                    <div class="text-5xl mb-2">🎉🎆⭐</div>
                    <h3 class="text-2xl font-bold text-green-600 mb-1">WELL DONE! CORRECT ANSWER!</h3>
                    <p class="text-sm text-indigo-600 font-bold mb-3">+5 POINTS</p>
                    <p class="text-xs text-gray-600 mb-4">${q.explanation}</p>
                    <button onclick="nextQuestion()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow">
                        NEXT QUESTION ▶
                    </button>
                `;
            } else {
                playSound('wrong');
                gameState.wrongCount++;
                gameState.streak = 0;

                content.innerHTML = `
                    <div class="text-5xl mb-2">❌</div>
                    <h3 class="text-2xl font-bold text-red-600 mb-1">TRY AGAIN!</h3>
                    <p class="text-sm font-semibold text-gray-700 mb-2">The correct answer is: <span class="text-green-600">${q.options[q.answer]}</span></p>
                    <p class="text-xs text-gray-600 mb-4">${q.explanation}</p>
                    <button onclick="nextQuestion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow">
                        NEXT QUESTION ▶
                    </button>
                `;
            }

            modal.classList.remove('hidden');
        }

        function showFeedbackModal(isCorrect, text) {
            const modal = document.getElementById('feedbackModal');
            const content = document.getElementById('feedbackContent');
            content.innerHTML = `
                <div class="text-5xl mb-2">⏰❌</div>
                <h3 class="text-2xl font-bold text-red-600 mb-1">TIME’S UP!</h3>
                <p class="text-xs text-gray-600 mb-4">${text}</p>
                <button onclick="nextQuestion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow">
                    NEXT QUESTION ▶
                </button>
            `;
            modal.classList.remove('hidden');
        }

        function nextQuestion() {
            const modal = document.getElementById('feedbackModal');
            modal.classList.add('hidden');

            gameState.currentQuestionIndex++;
            if (gameState.currentQuestionIndex < gameState.questions.length) {
                gameState.timeLeft = gameState.selectedTimeOption;
                render();
                if (gameState.selectedTimeOption > 0) startTimer();
            } else {
                playSound('win');
                switchScreen('result');
            }
        }

        // Initialize app on window load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
