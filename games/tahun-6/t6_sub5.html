        // --- CORE NAVIGATION & RENDER FUNCTIONS ---
        window.onload = function() {
            // Check saved users
            const activeUser = localStorage.getItem('edu_kidz_active_user');
            if (activeUser) {
                appState.currentUser = JSON.parse(activeUser);
                appState.currentView = 'menu';
            } else {
                appState.currentView = 'auth';
            }
            renderApp();
        };

        function renderApp() {
            const container = document.getElementById('view-container');
            const headerStatus = document.getElementById('user-status-container');
            
            // Render Header Status if logged in
            if (appState.currentUser) {
                headerStatus.innerHTML = `
                    <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-sm">
                            ${appState.currentUser.username.charAt(0).toUpperCase()}
                        </div>
                        <div class="text-left hidden sm:block">
                            <p class="text-xs font-bold text-slate-800">${appState.currentUser.username}</p>
                            <p class="text-[10px] text-slate-500">Marks: ${appState.currentUser.totalScore || 0}</p>
                        </div>
                    </div>
                    <button onclick="goToMenu()" class="p-2 text-slate-600 hover:text-indigo-600 rounded-xl hover:bg-slate-100 transition" title="Main Menu">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <button onclick="logoutUser()" class="p-2 text-rose-500 hover:text-rose-600 rounded-xl hover:bg-rose-50 transition" title="Log Out">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                `;
            } else {
                headerStatus.innerHTML = `<span class="text-xs font-medium text-slate-500">Register or log in to play.</span>`;
            }

            // Render Views
            switch(appState.currentView) {
                case 'auth':
                    container.innerHTML = renderAuthView();
                    break;
                case 'menu':
                    container.innerHTML = renderMainMenuView();
                    break;
                case 'topic_select':
                    container.innerHTML = renderTopicSelectView();
                    break;
                case 'level_select':
                    container.innerHTML = renderLevelSelectView();
                    break;
                case 'timer_select':
                    container.innerHTML = renderTimerSelectView();
                    break;
                case 'game':
                    container.innerHTML = renderGameView();
                    initGameSession();
                    break;
                case 'result':
                    container.innerHTML = renderResultView();
                    break;
                case 'progress':
                    container.innerHTML = renderProgressView();
                    break;
                case 'leaderboard':
                    container.innerHTML = renderLeaderboardView();
                    break;
                case 'profile':
                    container.innerHTML = renderProfileView();
                    break;

        // --- GAME LOGIC & CONTROLLER FUNCTIONS ---

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                tabReg.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-800 transition";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-800 transition";
            }
        }

        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function handleRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const fullname = document.getElementById('reg-fullname').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const confirm = document.getElementById('reg-confirm').value.trim();

            if (!username || !fullname || !password || !confirm) {
                showModal('Error', 'Complete all registration fields.');
                return;
            }
            if (password !== confirm) {
                showModal('Error', 'The passwords do not match.');
                return;
            }

            // Check existing
            if (appState.users.some(u => u.username === username)) {
                showModal('Error', 'That username is taken. Choose another one.');
                return;
            }

            const newUser = {
                username,
                fullname,
                password,
                totalScore: 0,
                totalAnswered: 0,
                totalCorrect: 0,
                totalWrong: 0,
                completedLevels: [],
                progress: {},
                lastSession: null
            };

            appState.users.push(newUser);
            localStorage.setItem('edu_kidz_users', JSON.stringify(appState.users));
            
            appState.currentUser = newUser;
            localStorage.setItem('edu_kidz_active_user', JSON.stringify(newUser));

            appState.currentView = 'menu';
            renderApp();
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                showModal('Error', 'Enter your username and password.');
                return;
            }

            const user = appState.users.find(u => u.username === username && u.password === password);
            if (!user) {
                showModal('Error', 'Check your username and password.');
                return;
            }

            appState.currentUser = user;
            localStorage.setItem('edu_kidz_active_user', JSON.stringify(user));
            appState.currentView = 'menu';
            renderApp();
        }

        function logoutUser() {
            appState.currentUser = null;
            localStorage.removeItem('edu_kidz_active_user');
            appState.currentView = 'auth';
            renderApp();
        }

        function goToMenu() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            appState.currentView = 'menu';
            renderApp();
        }

        function goToView(view) {
            appState.currentView = view;
            renderApp();
        }

        function selectTopic(topicId) {
            appState.selectedTopic = topicId;
            appState.currentView = 'level_select';
            renderApp();
        }

        function selectLevel(level) {
            appState.selectedLevel = level;
            appState.currentView = 'timer_select';
            renderApp();
        }

        function startGameWithTimer(timerSec) {
            appState.selectedTimer = timerSec;
            appState.currentView = 'game';
            renderApp();
        }

        function initGameSession() {
            // Load questions based on topic and level
            const topicQuestions = QUESTION_BANK[appState.selectedTopic] || [];
            appState.currentQuestions = topicQuestions.filter(q => q.tahap === appState.selectedLevel);
            appState.currentQuestionIndex = 0;
            appState.score = 0;
            appState.correctCount = 0;
            appState.wrongCount = 0;

            loadQuestion();
        }

        function loadQuestion() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);

            if (appState.currentQuestionIndex >= appState.currentQuestions.length) {
                finishGameSession();
                return;
            }

            const q = appState.currentQuestions[appState.currentQuestionIndex];
            
            appState.answered = false;

            // Set HUD
            const topicNames = { 1: "Length, Distance and Space", 2: "Volume of Liquid", 3: "Mass" };
            document.getElementById('hud-topic').innerText = topicNames[appState.selectedTopic];
            document.getElementById('hud-level').innerText = `Difficulty: ${({ Mudah: "Easy", Sederhana: "Medium", Sukar: "Hard" })[appState.selectedLevel]}`;
            document.getElementById('hud-q-num').innerText = appState.currentQuestionIndex + 1;
            document.getElementById('hud-score').innerText = appState.score;

            // Set question details
            document.getElementById('q-mod-badge').innerText = ({ Objektif: "Multiple Choice", Padanan: "Matching", "Isi Tempat Kosong": "Fill in the Blank" })[q.mod_permainan] || q.mod_permainan;
            document.getElementById('q-img-desc').innerText = [q.jenis_gambar, q.deskripsi_gambar].filter(Boolean).join(": ");
            document.getElementById('question-text').innerText = q.soalan;

            // Render options
            const optionsContainer = document.getElementById('answer-options-container');
            optionsContainer.innerHTML = '';
            
            if (q.mod_permainan === 'Objektif' || q.mod_permainan === 'Padanan') {
                q.pilihan_jawapan.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "p-4 text-left bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-500 rounded-2xl font-medium text-slate-700 transition flex items-center justify-between";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>`;
                    btn.onclick = () => checkAnswer(opt);
                    optionsContainer.appendChild(btn);
                });
            } else {
                // Isi Tempat Kosong / Lain-lain
                optionsContainer.innerHTML = `
                    <div class="col-span-2 space-y-3">
                        <input type="text" id="blank-input" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Enter your answer…">
                        <button onclick="checkBlankAnswer()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition text-sm">
                            Submit Answer
                        </button>
                    </div>
                `;
            }

            // Hide feedback
            document.getElementById('feedback-area').classList.add('hidden');

            // Timer
            if (appState.selectedTimer !== Infinity) {
                appState.timeLeft = appState.selectedTimer;
                const timerBox = document.getElementById('hud-timer-box');
                const timerSpan = document.getElementById('hud-timer');
                timerBox.classList.remove('hidden');
                timerSpan.innerText = appState.timeLeft;

                appState.timerInterval = setInterval(() => {
                    appState.timeLeft--;
                    timerSpan.innerText = appState.timeLeft;
                    if (appState.timeLeft <= 0) {
                        clearInterval(appState.timerInterval);
                        handleTimeOut();
                    }
                }, 1000);
            } else {
                document.getElementById('hud-timer-box').classList.add('hidden');
            }
        }

        function checkAnswer(selectedOpt) {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            const isCorrect = selectedOpt.trim().toLowerCase() === q.jawapan_betul.trim().toLowerCase();

            processAnswerResult(isCorrect, q);
        }

        function checkBlankAnswer() {
            const input = document.getElementById('blank-input');
            if (!input) return;
            const val = input.value.trim();
            if (!val) {
                showModal('Error', 'Enter an answer.');
                return;
            }

            if (appState.timerInterval) clearInterval(appState.timerInterval);
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            const isCorrect = val.toLowerCase() === q.jawapan_betul.toLowerCase();

            processAnswerResult(isCorrect, q);
        }

        function handleTimeOut() {
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            processAnswerResult(false, q, true);
        }

        function processAnswerResult(isCorrect, q, isTimeout = false) {
            if (appState.answered) return;
            appState.answered = true;
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackMsg = document.getElementById('feedback-message');
            feedbackArea.classList.remove('hidden');

            if (isCorrect) {
                appState.score += 5;
                appState.correctCount++;
                document.getElementById('hud-score').innerText = appState.score;
                feedbackMsg.innerHTML = `<span class="text-emerald-600 flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> 🎉 CORRECT! +5 MARKS</span><p class="text-xs text-slate-500 mt-1">${q.penerangan_jawapan}</p>`;
                
                // Trigger confetti fireworks
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                appState.wrongCount++;
                const reason = isTimeout ? 'Time’s up!' : 'Incorrect answer.';
                feedbackMsg.innerHTML = `<span class="text-rose-600 flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> ❌ ${reason} Correct answer: <strong class="text-slate-800">${q.jawapan_betul}</strong></span><p class="text-xs text-slate-500 mt-1">${q.penerangan_jawapan}</p>`;
            }

            // Disable options
            const optionsContainer = document.getElementById('answer-options-container');
            Array.from(optionsContainer.children).forEach(el => el.style.pointerEvents = 'none');
        }

        function nextQuestion() {
            appState.currentQuestionIndex++;
            loadQuestion();
        }

        function finishGameSession() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);

            const user = appState.currentUser;
            user.totalScore = (user.totalScore || 0) + appState.score;
            user.totalAnswered = (user.totalAnswered || 0) + 20;
            user.totalCorrect = (user.totalCorrect || 0) + appState.correctCount;
            user.totalWrong = (user.totalWrong || 0) + appState.wrongCount;

            const levelKey = `${appState.selectedTopic}_${appState.selectedLevel}`;
            if (!user.progress) user.progress = {};
            if (appState.score > (user.progress[levelKey] || 0)) {
                user.progress[levelKey] = appState.score;
            }

            if (!user.completedLevels) user.completedLevels = [];
            if (appState.score >= 80 && !user.completedLevels.includes(levelKey)) {
                user.completedLevels.push(levelKey);
            }

            user.lastSession = {
                score: appState.score,
                correct: appState.correctCount,
                wrong: appState.wrongCount,
                accuracy: Math.round((appState.correctCount / 20) * 100)
            };

            // Update users array in storage
            const idx = appState.users.findIndex(u => u.username === user.username);
            if (idx !== -1) {
                appState.users[idx] = user;
            }
            localStorage.setItem('edu_kidz_users', JSON.stringify(appState.users));
            localStorage.setItem('edu_kidz_active_user', JSON.stringify(user));

            appState.currentView = 'result';
            renderApp();
        }

        function toggleOrientationNotice() {
            showModal('Screen Orientation', 'You can play in landscape or portrait on a computer, tablet or phone.');
        }
    </script>
</body>
</html>
