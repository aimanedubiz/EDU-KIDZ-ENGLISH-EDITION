        function handleRegister() {
            const fullname = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!fullname || !username || !password) {
                showModal("Answer Required", "Complete all registration fields.", "⚠️");
                return;
            }

            let users = getUsers();
            if (users.some(u => u.username === username)) {
                showModal("Error", "That username is taken. Choose another one.", "❌");
                return;
            }

            const newUser = {
                fullname,
                username,
                password,
                history: [],
                highScore: 0
            };

            users.push(newUser);
            saveUsers(users);
            showModal("Success", "Account created. You can now log in.", "🎉");
            switchAuthTab('login');
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                showModal("Answer Required", "Enter your username and password.", "⚠️");
                return;
            }

            let users = getUsers();
            const user = users.find(u => u.username === username && u.password === password);

            if (!user) {
                showModal("Error", "Check your username and password.", "❌");
                return;
            }

            currentUser = user;
            document.getElementById('display-username').innerText = `👤 ${currentUser.fullname}`;
            document.getElementById('user-header-info').classList.remove('hidden');
            renderMainMenu();
        }

                        <button onclick="startGameWithTimer(0)" class="w-full bg-violet-800 hover:bg-violet-700 p-4 rounded-2xl border border-violet-500/40 font-bold text-white shadow-lg transition flex items-center justify-between">
                            <span>♾️ NO TIME LIMIT</span>
                            <span class="text-xs bg-violet-950 px-2.5 py-1 rounded-lg">Untimed Practice</span>
                        </button>
                    </div>

                    <button onclick="renderLevelScreen()" class="text-xs text-indigo-300 hover:text-white underline font-medium">← Back</button>
                </div>
            `;
        }

        // --- STREAMING_CHUNK:Game Engine & Question Selector ---
        function startGameWithTimer(seconds) {
            gameConfig.timerType = seconds;
            
            // Filter questions based on category and level
            let filtered = questionBank.filter(q => q.kategori === gameConfig.category && q.tahap === gameConfig.level);
            
            // Randomize and pick 20 unique questions
            currentQuestions = shuffleArray(filtered).slice(0, 20);
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            wrongAnswersCount = 0;

            renderQuestionScreen();
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderQuestionScreen() {
            if (timerInterval) clearInterval(timerInterval);

            if (currentQuestionIndex >= currentQuestions.length) {
                renderEndGameScreen();
                return;
            }

            answeredCurrent = false;
            const q = currentQuestions[currentQuestionIndex];
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="w-full max-w-2xl mx-auto space-y-4 animate-pop">
                    <!-- Top Info bar -->
                    <div class="flex flex-wrap justify-between items-center bg-slate-800/80 px-4 py-2.5 rounded-xl border border-indigo-500/30 text-xs">
                        <span class="font-bold text-indigo-300">${categoryLabels[q.kategori]} • ${levelLabels[q.tahap]}</span>
                        <span class="font-bold text-white">Question ${currentQuestionIndex + 1}/20</span>
                        <span id="timer-display" class="font-bold text-amber-400">⏱️ ${gameConfig.timerType === 0 ? 'No Time Limit' : gameConfig.timerType + 's'}</span>
                        <span class="font-bold text-emerald-400">Score: ${score}</span>
                    </div>

                    <!-- Diagram Hint box -->
                    <div class="bg-indigo-950/60 border border-indigo-500/20 p-3 rounded-xl flex items-center space-x-3 text-xs text-indigo-200">
                        <span class="text-2xl">🗺️</span>
                        <div>
                            <span class="font-bold text-indigo-300">Question Context:</span>
                            <p class="mt-0.5">${q.gambarajah}</p>
                        </div>
                    </div>

                    <!-- Question Text -->
                    <div class="bg-slate-800 p-5 rounded-2xl border border-indigo-500/30 space-y-4 shadow-lg">
                        <h3 class="text-sm sm:text-base font-bold text-white leading-relaxed">
                            ${q.soalan}
                        </h3>

                        <div id="answer-input-container" class="space-y-2 pt-2">
                            <!-- Injected Answer Form based on question type -->
                        </div>
                    </div>

                    <button onclick="submitAnswer()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 rounded-xl shadow-lg transition">SUBMIT ANSWER</button>
                </div>
            `;

            renderAnswerInput(q);

            if (gameConfig.timerType > 0) {
                timeLeft = gameConfig.timerType;
                const timerEl = document.getElementById('timer-display');
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = `⏱️ ${timeLeft}s`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleTimeOut(q);
                    }
                }, 1000);
            }
        }

        function renderAnswerInput(q) {
            const container = document.getElementById('answer-input-container');
            if (q.jenis === "Objektif") {
                let html = '<div class="grid grid-cols-1 gap-2">';
                q.pilihan.forEach((opt, idx) => {
                    html += `
                        <label class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900/80 border border-indigo-500/20 hover:border-indigo-400 cursor-pointer transition">
                            <input type="radio" name="obj-answer" value="${opt}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                            <span class="text-xs sm:text-sm text-slate-200 font-medium">${opt}</span>
                        </label>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } else {
                // Isi Tempat Kosong / Lain-lain
                container.innerHTML = `
                    <div>
                        <label class="text-xs text-indigo-300 font-medium">Enter your answer below:</label>
                        <input type="text" id="fib-answer" class="w-full mt-2 bg-slate-900 border border-indigo-500/40 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-400" placeholder="Your answer…">
                    </div>
                `;
            }
        }

        function handleTimeOut(q) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            wrongAnswersCount++;
            showFeedbackModal(false, q, "Time’s up!");
        }

        function submitAnswer() {
            if (answeredCurrent) return;
            if (timerInterval) clearInterval(timerInterval);
            const q = currentQuestions[currentQuestionIndex];
            let userAns = "";

            if (q.jenis === "Objektif") {
                const selected = document.querySelector('input[name="obj-answer"]:checked');
                if (!selected) {
                    showModal("Answer Required", "Select an answer first.", "⚠️");
                    if (gameConfig.timerType > 0 && timeLeft > 0) resumeTimer();
                    return;
                }
                userAns = selected.value;
            } else {
                const inputEl = document.getElementById('fib-answer');
                userAns = inputEl.value.trim();
                if (!userAns) {
                    showModal("Answer Required", "Enter an answer first.", "⚠️");
                    if (gameConfig.timerType > 0 && timeLeft > 0) resumeTimer();
                    return;
                }
            }

            answeredCurrent = true;
            const normalize = value => value.toLowerCase()
                .replace(/hours?|hrs?/g, 'h').replace(/minutes?|mins/g, 'min')
                .replace(/seconds?|secs/g, 's').replace(/decades?/g, 'dec')
                .replace(/years?|yrs?/g, 'y').replace(/months?/g, 'mo')
                .replace(/millennia|millennium/g, 'mil')
                .replace(/\band\b|\s+/g, '');
            const compactAnswer = normalize(q.jawapan);
            const typedAnswer = normalize(userAns);
            const isCorrect = q.jenis === "Objektif" ? userAns === q.jawapan :
                typedAnswer === compactAnswer || typedAnswer === compactAnswer.replace(/0(?:s|mo)$/, '');

            if (isCorrect) {
                score += q.markah;
                correctAnswersCount++;
                showFeedbackModal(true, q, "CORRECT! 🎉");
            } else {
                wrongAnswersCount++;
                showFeedbackModal(false, q, "INCORRECT ANSWER");
            }
        }

        function resumeTimer() {
            if (gameConfig.timerType > 0) {
                const timerEl = document.getElementById('timer-display');
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = `⏱️ ${timeLeft}s`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleTimeOut(currentQuestions[currentQuestionIndex]);
                    }
                }, 1000);
            }
        }

        function showFeedbackModal(isCorrect, q, titleText) {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="w-full max-w-md mx-auto text-center space-y-6 animate-pop bg-slate-800/90 p-6 rounded-3xl border ${isCorrect ? 'border-emerald-500/50' : 'border-rose-500/50'} shadow-2xl">
                    <div class="text-5xl">${isCorrect ? '🎉' : '💡'}</div>
                    <h3 class="text-xl font-extrabold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${titleText}</h3>
                    
                    ${!isCorrect ? `
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-indigo-500/20 text-left space-y-1">
                            <p class="text-xs text-indigo-300 font-bold">Correct answer:</p>
                            <p class="text-sm font-extrabold text-white">${q.jawapan}</p>
                        </div>
                    ` : ''}

                    <div class="bg-indigo-950/60 p-4 rounded-2xl border border-indigo-500/20 text-left space-y-1">
                        <p class="text-xs text-indigo-300 font-bold">Worked explanation:</p>
                        <p class="text-xs text-slate-200 leading-relaxed">${q.penerangan}</p>
                    </div>

                    <button onclick="nextQuestion()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 rounded-xl shadow-lg transition">NEXT →</button>
                </div>
            `;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestionScreen();
        }

        // --- STREAMING_CHUNK:End Game & Score Recording ---
        function renderEndGameScreen() {
            if (timerInterval) clearInterval(timerInterval);

            // Record progress into user profile
            const maxScore = currentQuestions.length * 5;
            const percentage = Math.round((score / maxScore) * 100);

            const sessionRecord = {
                date: new Date().toLocaleDateString(),
                category: gameConfig.category,
                level: gameConfig.level,
                total: currentQuestions.length,
                correct: correctAnswersCount,
                wrong: wrongAnswersCount,
                score: score,
                maxScore: maxScore,
                percentage: percentage
            };

            currentUser.history.push(sessionRecord);
            if (score > currentUser.highScore) {
                currentUser.highScore = score;
            }

            // Update user in localStorage
            let users = getUsers();
            let idx = users.findIndex(u => u.username === currentUser.username);
            if (idx !== -1) {
                users[idx] = currentUser;
                saveUsers(users);
            }

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="w-full max-w-md mx-auto text-center space-y-6 animate-pop bg-slate-800 p-6 rounded-3xl border border-indigo-500/30 shadow-2xl">
                    <span class="text-5xl">🏆</span>
                    <div>
                        <h2 class="text-2xl font-extrabold text-white">GAME COMPLETE!</h2>
                        <p class="text-indigo-300 text-xs mt-1">Well done for completing the session.</p>
                    </div>

                    <div class="bg-slate-900/80 p-4 rounded-2xl border border-indigo-500/20 text-left space-y-2 text-xs">
                        <div class="flex justify-between"><span class="text-slate-400">Name:</span><span class="font-bold text-white">${currentUser.fullname}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Topic:</span><span class="font-bold text-indigo-300">${categoryLabels[gameConfig.category]}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Difficulty:</span><span class="font-bold text-amber-300">${levelLabels[gameConfig.level]}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Questions:</span><span class="font-bold text-white">${currentQuestions.length}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Correct Answers:</span><span class="font-bold text-emerald-400">${correctAnswersCount}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Incorrect Answers:</span><span class="font-bold text-rose-400">${wrongAnswersCount}</span></div>
                        <div class="flex justify-between border-t border-indigo-500/20 pt-2"><span class="text-slate-300 font-bold">Marks Earned:</span><span class="font-extrabold text-amber-400 text-sm">${score} / ${maxScore} (${percentage}%)</span></div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="startGameWithTimer(gameConfig.timerType)" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">🔄 Play Again</button>
                        <button onclick="renderMainMenu()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">🏠 Main Menu</button>
                        <button onclick="renderProgressScreen()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">📊 My Progress</button>
                        <button onclick="renderLeaderboard()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">🏆 Leaderboard</button>
                    </div>
                </div>
            `;
        }

        // --- STREAMING_CHUNK:Progress & Leaderboard Screens ---
        function renderProgressScreen() {
            const main = document.getElementById('main-content');
            let historyHtml = '';

            if (!currentUser.history || currentUser.history.length === 0) {
                historyHtml = `<p class="text-xs text-slate-400 text-center py-4">No games played yet.</p>`;
            } else {
                currentUser.history.slice().reverse().forEach(h => {
                    historyHtml += `
                        <div class="bg-slate-900/80 p-3 rounded-xl border border-indigo-500/20 text-xs flex justify-between items-center">
                            <div>
                                <p class="font-bold text-indigo-300">${categoryLabels[h.category] || h.category} (${levelLabels[h.level] || h.level})</p>
                                <p class="text-[10px] text-slate-400">Date: ${h.date} • Correct: ${h.correct}/${h.total}</p>
                            </div>
                            <span class="font-extrabold text-amber-400 text-sm">${h.score} marks</span>
                        </div>
                    `;
                });
            }

            main.innerHTML = `
                <div class="w-full max-w-md mx-auto space-y-4 animate-pop">
                    <div class="text-center">
                        <span class="text-3xl">📊</span>
                        <h2 class="text-xl font-extrabold text-white">MY PROGRESS</h2>
                        <p class="text-indigo-300 text-xs">${currentUser.fullname} • Skor Tertinggi: ${currentUser.highScore}m</p>
                    </div>

                    <div class="bg-slate-800 p-4 rounded-2xl border border-indigo-500/30 space-y-3 max-h-72 overflow-y-auto">
                        ${historyHtml}
                    </div>

                    <button onclick="renderMainMenu()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">← Back to the Main Menu</button>
                </div>
            `;
        }

        function renderLeaderboard() {
            let users = getUsers();
            // Sort users by high score descending
            users.sort((a, b) => b.highScore - a.highScore);

            let lbHtml = '';
            if (users.length === 0) {
                lbHtml = `<p class="text-xs text-slate-400 text-center py-4">No leaderboard scores yet.</p>`;
            } else {
                users.forEach((u, idx) => {
                    let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                    lbHtml += `
                        <div class="bg-slate-900/80 p-3 rounded-xl border border-amber-500/20 text-xs flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <span class="font-extrabold text-amber-400 text-sm w-6">${medal}</span>
                                <span class="font-bold text-white">${u.fullname} (${u.username})</span>
                            </div>
                            <span class="font-extrabold text-amber-300 text-sm">${u.highScore} Marks</span>
                        </div>
                    `;
                });
            }

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="w-full max-w-md mx-auto space-y-4 animate-pop">
                    <div class="text-center">
                        <span class="text-3xl">🏆</span>
                        <h2 class="text-xl font-extrabold text-white">LEADERBOARD</h2>
                        <p class="text-amber-300 text-xs">Year 6 Player Rankings</p>
                    </div>

                    <div class="bg-slate-800 p-4 rounded-2xl border border-amber-500/30 space-y-3 max-h-72 overflow-y-auto">
                        ${lbHtml}
                    </div>

                    <button onclick="renderMainMenu()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">← Back to the Main Menu</button>
                </div>
            `;
        }
    </script>
</body>
</html>
