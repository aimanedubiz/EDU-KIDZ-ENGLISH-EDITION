<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH KIDS – EDU KIDZ YEAR 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            color: #1f2937;
            min-height: 100vh;
            user-select: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .game-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .game-btn:active {
            transform: translateY(1px);
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s infinite ease-in-out;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-2 sm:p-6">

    <div id="app" class="w-full max-w-5xl mx-auto flex flex-col min-h-[92vh]">
        
        <!-- Header / Banner -->
        <header class="w-full text-center py-4 px-6 mb-4 glass-panel rounded-2xl flex flex-col sm:flex-row items-center justify-between">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg animate-float">
                    📐
                </div>
                <div class="text-left">
                    <h1 class="text-xl sm:text-2xl font-bold text-indigo-900 tracking-wide">MATH KIDS <span class="text-amber-500 font-extrabold">EDU KIDZ</span></h1>
                    <p class="text-xs text-indigo-600 font-semibold tracking-wider">YEAR 6 KSSR / DSKP</p>
                </div>
            </div>
            <div class="hidden md:block">
                <p class="text-sm italic font-medium text-indigo-700 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-200">
                    "Belajar Matematik, Main dan Jadi Juara!"
                </p>
            </div>
            <div id="user-header-info" class="hidden flex items-center space-x-3 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-200">
                <span id="header-avatar" class="text-2xl">👦</span>
                <div class="text-left">
                    <p id="header-name" class="text-xs font-bold text-indigo-900">Player</p>
                    <p class="text-[10px] text-indigo-600 font-semibold">Score: <span id="header-score">0</span></p>
                </div>
                <button onclick="app.logout()" class="ml-2 text-xs bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-lg font-medium transition">Log Out</button>
            </div>
        </header>

        <!-- Dynamic Main Screen Container -->
        <main id="main-content" class="flex-grow flex flex-col items-center justify-center">
            <!-- Injected dynamically by JavaScript -->
        </main>

        <!-- Footer -->
        <footer class="w-full text-center py-3 mt-4 text-xs text-indigo-200 font-medium">
            MATH KIDS – EDU KIDZ YEAR 6 &copy; 2026 | KSSR & DSKP Year 6 Mathematics
        </footer>
    </div>

    <!-- Message Modal for Notifications -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 rounded-2xl text-center transform transition-all shadow-2xl border-2 border-indigo-200">
            <div id="modal-icon" class="text-4xl mb-3">🎉</div>
            <h3 id="modal-title" class="text-xl font-bold text-indigo-900 mb-2">Message</h3>
            <p id="modal-message" class="text-gray-600 text-sm mb-6 leading-relaxed">Your message will appear here.</p>
            <div id="modal-actions" class="flex justify-center space-x-3">
                <button onclick="app.closeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA BANK GENERATOR & APP CONTROLLER ---
        
        class MathKidsApp {
            constructor() {
                this.currentUser = null;
                this.currentScreen = 'login'; // login, register, menu, topics, difficulties, timer_select, quiz, results, leaderboard, progress, profile, settings
                this.selectedTopic = null;
                this.selectedDifficulty = null;
                this.selectedTimerMode = null; // 30, 60, 0 (infinite)
                
                // Quiz Session State
                this.activeQuestions = [];
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.timeRemaining = 0;
                this.isAnswered = false;
                
                // Load database from localStorage
                this.loadDatabase();
                this.initQuestionBank();
            }

            loadDatabase() {
                const storedUsers = localStorage.getItem('math_kids_users');
                this.users = storedUsers ? JSON.parse(storedUsers) : {};
                
                const activeSession = localStorage.getItem('math_kids_active_user');
                if (activeSession && this.users[activeSession]) {
                    this.currentUser = activeSession;
                    this.currentScreen = 'menu';
                }
            }

            saveDatabase() {
                localStorage.setItem('math_kids_users', JSON.stringify(this.users));
                if (this.currentUser) {
                    localStorage.setItem('math_kids_active_user', this.currentUser);
                } else {
                    localStorage.removeItem('math_kids_active_user');
                }
            }

            // --- QUESTION BANK GENERATOR (240 UNIQUE QUESTIONS) ---
            initQuestionBank() {
                if (this.questionBank && this.questionBank.length === 240) return;
                
                this.questionBank = [];
                
                // TOPIC 1: JARAK DI ANTARA DUA KOORDINAT (60 Questions: 20 Mudah, 20 Sederhana, 20 Susah)
                // --- TOPIC 1 MUDAH (20) ---
                for (let i = 1; i <= 20; i++) {
                    const x1 = (i % 4);
                    const y1 = 2;
                    const x2 = x1 + (i % 5) + 1;
                    const y2 = 2;
                    const dist = x2 - x1;
                    this.questionBank.push({
                        id: `K1-M-${String(i).padStart(3, '0')}`,
                        topic: 'Distance Between Two Coordinates',
                        difficulty: 'Mudah',
                        cognitive: i % 2 === 0 ? 'Mengingat' : 'Memahami',
                        type: 'Objektif',
                        marks: 5,
                        question: `Points A and B are at (${x1}, ${y1}) and (${x2}, ${y2}) on a grid. What is the horizontal distance in kilometres if one grid unit represents 1 km?`,
                        options: [`${dist + 3} km`, `${dist + 2} km`, `${dist} km`, `${dist + 1} km`],
                        correct: `${dist} km`,
                        explanation: `Subtract the x-coordinates: ${x2} − ${x1} = ${dist} units. One unit represents 1 km, so the distance is ${dist} km.`,
                        diagram: { type: 'coordinate', points: [{name:'A', x:x1, y:y1}, {name:'B', x:x2, y:y2}], scale: '1 unit = 1 km' }
                    });
                }

                // --- TOPIC 1 SEDERHANA (20) ---
                for (let i = 1; i <= 20; i++) {
                    const x1 = Math.floor((i - 1) / 6) + 1, y1 = 1;
                    const x2 = x1, y2 = 1 + (i % 6) + 2;
                    const dist = y2 - y1;
                    const scaleVal = (i % 2 === 0) ? 2 : 5;
                    const totalDist = dist * scaleVal;
                    this.questionBank.push({
                        id: `K1-S-${String(i).padStart(3, '0')}`,
                        topic: 'Distance Between Two Coordinates',
                        difficulty: 'Sederhana',
                        cognitive: 'Memahami',
                        type: 'Objektif',
                        marks: 5,
                        question: `A school is at (${x1}, ${y1}) and Ali’s home is at (${x2}, ${y2}) on a map. One grid unit represents ${scaleVal} km. What is the actual vertical distance from the school to Ali’s home?`,
                        options: [`${totalDist + scaleVal} km`, `${totalDist} km`, `${totalDist - scaleVal} km`, `${totalDist + (scaleVal*2)} km`],
                        correct: `${totalDist} km`,
                        explanation: `Subtract the y-coordinates: ${y2} − ${y1} = ${dist} units. The actual distance is ${dist} × ${scaleVal} = ${totalDist} km.`,
                        diagram: { type: 'coordinate', points: [{name:'School', x:x1, y:y1}, {name:'Home', x:x2, y:y2}], scale: `1 unit = ${scaleVal} km` }
                    });
                }

                // --- TOPIC 1 SUSAH (20) ---
                for (let i = 1; i <= 20; i++) {
                    const xA = 2, yA = 2;
                    const xB = 2 + (i % 4) + 2; // mengufuk
                    const yB = yA;
                    const xC = xB;
                    const yC = yB + (i % 3) + 3; // mencancang
                    const distAB = xB - xA;
                    const distBC = yC - yB;
                    const totalDistGrid = distAB + distBC;
                    const scale = i <= 12 ? 2 : 3;
                    const totalKm = totalDistGrid * scale;
                    this.questionDialog = '';
                    this.questionBank.push({
                        id: `K1-H-${String(i).padStart(3, '0')}`,
                        topic: 'Distance Between Two Coordinates',
                        difficulty: 'Susah',
                        cognitive: 'Mengaplikasi',
                        type: 'Objektif',
                        marks: 5,
                        question: `Amir travels from Station A (${xA}, ${yA}) to Station B (${xB}, ${yB}), then to Station C (${xC}, ${yC}). One grid unit represents ${scale} km. How far does he travel altogether?`,
                        options: [`${totalKm + 4} km`, `${totalKm} km`, `${totalKm - 2} km`, `${totalKm + 2} km`],
                        correct: `${totalKm} km`,
                        explanation: `A to B is ${distAB} units horizontally. B to C is ${distBC} units vertically. The total distance is ${totalDistGrid} × ${scale} = ${totalKm} km.`,
                        diagram: { type: 'coordinate', points: [{name:'A', x:xA, y:yA}, {name:'B', x:xB, y:yB}, {name:'C', x:xC, y:yC}], scale: `1 unit = ${scale} km` }
                    });
                }

                // TOPIC 2: RATIO OF TWO QUANTITIES (60 Questions: 20 Mudah, 20 Sederhana, 20 Susah)
                const t2Objects = [
                    { a: 'storybooks', b: 'reference books' },
                    { a: 'red pens', b: 'blue pens' },
                    { a: 'strawberry-flavoured sweets', b: 'orange-flavoured sweets' },
                    { a: 'male cats', b: 'female cats' },
                    { a: 'boys', b: 'girls' },
                    { a: 'red coloured pencils', b: 'blue coloured pencils' },
                    { a: 'sheets of drawing paper', b: 'sheets of coloured paper' },
                    { a: 'red marbles', b: 'green marbles' },
                    { a: 'local stamps', b: 'foreign stamps' },
                    { a: 'glass bottles', b: 'plastic bottles' },
                    { a: 'red roses', b: 'white roses' },
                    { a: 'yellow shirts', b: 'blue shirts' }
                ];
                
                // --- TOPIC 2 MUDAH (20 Unique Ratios & Quantities) ---
                const t2EasyPairs = [
                    {aVal: 4, bVal: 8}, {aVal: 6, bVal: 9}, {aVal: 10, bVal: 15}, {aVal: 12, bVal: 18},
                    {aVal: 5, bVal: 10}, {aVal: 8, bVal: 12}, {aVal: 14, bVal: 21}, {aVal: 16, bVal: 20},
                    {aVal: 9, bVal: 12}, {aVal: 15, bVal: 25}, {aVal: 18, bVal: 24}, {aVal: 20, bVal: 30},
                    {aVal: 7, bVal: 14}, {aVal: 11, bVal: 22}, {aVal: 13, bVal: 26}, {aVal: 22, bVal: 33},
                    {aVal: 24, bVal: 36}, {aVal: 25, bVal: 35}, {aVal: 27, bVal: 36}, {aVal: 30, bVal: 45}
                ];

                for (let i = 1; i <= 20; i++) {
                    const pair = t2EasyPairs[i - 1];
                    const objPair = t2Objects[(i - 1) % t2Objects.length];
                    const a = pair.aVal;
                    const b = pair.bVal;
                    const gcd = (x, y) => y === 0 ? x : gcd(y, x % y);
                    const g = gcd(a, b);
                    const simpA = a / g;
                    const simpB = b / g;
                    this.questionBank.push({
                        id: `K2-M-${String(i).padStart(3, '0')}`,
                        topic: 'Ratio of Two Quantities',
                        difficulty: 'Mudah',
                        cognitive: 'Mengingat',
                        type: 'Objektif',
                        marks: 5,
                        question: `A collection contains ${a} ${objPair.a} and ${b} ${objPair.b}. What is the ratio of the number of ${objPair.a} to the number of ${objPair.b} in its simplest form?`,
                        options: [`${simpB} : ${simpA}`, `${simpA + 1} : ${simpB}`, `${simpA} : ${simpB}`, `${simpA} : ${simpB + 1}`],
                        correct: `${simpA} : ${simpB}`,
                        explanation: `Divide both quantities by their highest common factor, ${g}: ${a} ÷ ${g} = ${simpA} and ${b} ÷ ${g} = ${simpB}. The simplest form is ${simpA} : ${simpB}.`,
                        diagram: { type: 'ratio_objects', items: [{name: objPair.a, count: a, color: '#ef4444'}, {name: objPair.b, count: b, color: '#3b82f6'}] }
                    });
                }

                // --- TOPIC 2 SEDERHANA (20 Unique Ratio Comparisons to Total) ---
                const t2MedPairs = [
                    {ba: 2, bb: 3}, {ba: 3, bb: 5}, {ba: 4, bb: 7}, {ba: 1, bb: 4},
                    {ba: 2, bb: 5}, {ba: 3, bb: 4}, {ba: 5, bb: 6}, {ba: 1, bb: 3},
                    {ba: 3, bb: 8}, {ba: 2, bb: 7}, {ba: 4, bb: 5}, {ba: 5, bb: 8},
                    {ba: 3, bb: 7}, {ba: 2, bb: 9}, {ba: 4, bb: 9}, {ba: 1, bb: 5},
                    {ba: 3, bb: 10}, {ba: 7, bb: 10}, {ba: 5, bb: 9}, {ba: 2, bb: 3}
                ];

                for (let i = 1; i <= 20; i++) {
                    const bp = t2MedPairs[i - 1];
                    const objPair = t2Objects[(i + 3) % t2Objects.length];
                    const mult = (i % 4) + 2;
                    const a = bp.ba * mult;
                    const b = bp.bb * mult;
                    this.questionBank.push({
                        id: `K2-S-${String(i).padStart(3, '0')}`,
                        topic: 'Ratio of Two Quantities',
                        difficulty: 'Sederhana',
                        cognitive: 'Memahami',
                        type: 'Objektif',
                        marks: 5,
                        question: `A box contains ${a} ${objPair.a} and ${b} ${objPair.b}. Give the ratio of the number of ${objPair.b} to the total number of items in its simplest form.`,
                        options: [`${bp.bb} : ${bp.ba + bp.bb}`, `${bp.ba} : ${bp.bb}`, `${bp.bb} : ${bp.ba}`, `${bp.ba} : ${bp.ba + bp.bb}`],
                        correct: `${bp.bb} : ${bp.ba + bp.bb}`,
                        explanation: `The total is ${a} + ${b} = ${a + b}. The ratio ${b} : ${a + b} simplifies to ${bp.bb} : ${bp.ba + bp.bb}.`,
                        diagram: { type: 'ratio_objects', items: [{name: objPair.a, count: a, color: '#6366f1'}, {name: objPair.b, count: b, color: '#ec4899'}] }
                    });
                }

                // --- TOPIC 2 SUSAH (20 Unique Advanced Proportional Share Ratios) ---
                const t2HardPairs = [
                    {rx: 1, ry: 3, mult: 5}, {rx: 2, ry: 3, mult: 4}, {rx: 3, ry: 4, mult: 3}, {rx: 1, ry: 4, mult: 6},
                    {rx: 2, ry: 5, mult: 4}, {rx: 3, ry: 5, mult: 3}, {rx: 4, ry: 5, mult: 2}, {rx: 1, ry: 2, mult: 8},
                    {rx: 3, ry: 7, mult: 3}, {rx: 2, ry: 7, mult: 4}, {rx: 5, ry: 7, mult: 2}, {rx: 3, ry: 8, mult: 4},
                    {rx: 1, ry: 5, mult: 7}, {rx: 4, ry: 7, mult: 3}, {rx: 2, ry: 9, mult: 5}, {rx: 3, ry: 10, mult: 4},
                    {rx: 5, ry: 6, mult: 3}, {rx: 1, ry: 6, mult: 8}, {rx: 3, ry: 5, mult: 5}, {rx: 2, ry: 3, mult: 6}
                ];

                for (let i = 1; i <= 20; i++) {
                    const hp = t2HardPairs[i - 1];
                    const objPair = t2Objects[(i + 7) % t2Objects.length];
                    const x = hp.rx, y = hp.ry, factor = hp.mult;
                    const totalItems = (x + y) * factor;
                    const countX = x * factor;
                    const countY = y * factor;
                    this.questionBank.push({
                        id: `K2-H-${String(i).padStart(3, '0')}`,
                        topic: 'Ratio of Two Quantities',
                        difficulty: 'Susah',
                        cognitive: 'Mengaplikasi',
                        type: 'Objektif',
                        marks: 5,
                        question: `A container has ${totalItems} items altogether. The ratio of ${objPair.a} to ${objPair.b} is ${x} : ${y}. How many ${objPair.b} are there?`,
                        options: [`${countY + factor} items`, `${countY + (factor * 2)} items`, `${countY} items`, `${Math.max(0, countY - factor)} items`],
                        correct: `${countY} items`,
                        explanation: `There are ${x} + ${y} = ${x + y} parts. One part is ${totalItems} ÷ ${x + y} = ${factor} items. The number of ${objPair.b} is ${y} × ${factor} = ${countY}.`,
                        diagram: { type: 'ratio_objects', items: [{name: objPair.a, count: countX, color: '#f59e0b'}, {name: objPair.b, count: null, color: '#f97316'}] }
                    });
                }

                // TOPIC 3: MENENTUKAN KUANTITI YANG BERKADARAN (60 Questions: 20 Mudah, 20 Sederhana, 20 Susah)
                // --- TOPIC 3 MUDAH (20 Unique Proportion & Ratio Value Questions) ---
                const t3EasyItems = [
                    { item: 'pencil cases', unit: 'kotak', a: 2, valA: 16, targetA: 5 },
                    { item: 'exercise books', unit: 'buah', a: 3, valA: 12, targetA: 7 },
                    { item: 'ice lollies', unit: 'batang', a: 4, valA: 8, targetA: 10 },
                    { item: 'sheets of A4 paper', unit: 'helai', a: 5, valA: 25, targetA: 8 },
                    { item: 'oranges', unit: 'biji', a: 2, valA: 10, targetA: 9 },
                    { item: 'cards', unit: 'keping', a: 3, valA: 15, targetA: 6 },
                    { item: 'marbles', unit: 'biji', a: 4, valA: 20, targetA: 11 },
                    { item: 'packets of biscuits', unit: 'paket', a: 2, valA: 14, targetA: 8 },
                    { item: 'apples', unit: 'biji', a: 5, valA: 30, targetA: 4 },
                    { item: 'coloured pencils', unit: 'batang', a: 3, valA: 18, targetA: 9 },
                    { item: 'cartons of milk', unit: 'kotak', a: 4, valA: 24, targetA: 5 },
                    { item: 'storybooks', unit: 'buah', a: 2, valA: 18, targetA: 6 },
                    { item: 'doughnuts', unit: 'biji', a: 5, valA: 35, targetA: 3 },
                    { item: 'pens', unit: 'batang', a: 3, valA: 21, targetA: 8 },
                    { item: 'stamps', unit: 'keping', a: 4, valA: 32, targetA: 5 },
                    { item: 'pairs of socks', unit: 'pasang', a: 2, valA: 12, targetA: 7 },
                    { item: 'mangoes', unit: 'biji', a: 3, valA: 24, targetA: 5 },
                    { item: 'boxes of coloured pencils', unit: 'kotak', a: 5, valA: 40, targetA: 4 },
                    { item: 'notebooks', unit: 'buah', a: 4, valA: 36, targetA: 3 },
                    { item: 'table tennis balls', unit: 'biji', a: 2, valA: 22, targetA: 7 }
                ];

                for (let i = 1; i <= 20; i++) {
                    const info = t3EasyItems[i - 1];
                    const unitVal = info.valA / info.a;
                    const targetVal = unitVal * info.targetA;
                    this.questionBank.push({
                        id: `K3-M-${String(i).padStart(3, '0')}`,
                        topic: 'Determining Proportional Quantities',
                        difficulty: 'Mudah',
                        cognitive: 'Mengingat',
                        type: 'Objektif',
                        marks: 5,
                        question: `${info.a} ${info.item} cost RM${info.valA}. How much do ${info.targetA} cost at the same price per item?`,
                        options: [`RM${targetVal - 2}`, `RM${targetVal + 4}`, `RM${targetVal}`, `RM${targetVal + 3}`],
                        correct: `RM${targetVal}`,
                        explanation: `One item costs RM${info.valA} ÷ ${info.a} = RM${unitVal}. The total cost is ${info.targetA} × RM${unitVal} = RM${targetVal}.`,
                        diagram: { type: 'proportion', text: `${info.a} ${info.item} = RM${info.valA} | ${info.targetA} ${info.item} = ?` }
                    });
                }

                // --- TOPIC 3 SEDERHANA (20 Unique Proportional Ingredient/Mass Questions) ---
                const t3MedItems = [
                    { food: 'flour', baseQty: 400, baseUnit: 'g', baseItems: 2, targetItems: 5 },
                    { food: 'sugar', baseQty: 300, baseUnit: 'g', baseItems: 3, targetItems: 7 },
                    { food: 'butter', baseQty: 250, baseUnit: 'g', baseItems: 2, targetItems: 6 },
                    { food: 'cocoa powder', baseQty: 150, baseUnit: 'g', baseItems: 3, targetItems: 8 },
                    { food: 'evaporated milk', baseQty: 500, baseUnit: 'ml', baseItems: 4, targetItems: 6 },
                    { food: 'orange juice', baseQty: 600, baseUnit: 'ml', baseItems: 3, targetItems: 5 },
                    { food: 'rice', baseQty: 1200, baseUnit: 'g', baseItems: 4, targetItems: 10 },
                    { food: 'meat', baseQty: 800, baseUnit: 'g', baseItems: 2, targetItems: 5 },
                    { food: 'chicken', baseQty: 1500, baseUnit: 'g', baseItems: 3, targetItems: 4 },
                    { food: 'cooking oil', baseQty: 400, baseUnit: 'ml', baseItems: 2, targetItems: 7 },
                    { food: 'tomato sauce', baseQty: 350, baseUnit: 'ml', baseItems: 5, targetItems: 10 },
                    { food: 'peanuts', baseQty: 600, baseUnit: 'g', baseItems: 3, targetItems: 4 },
                    { food: 'cornflour', baseQty: 200, baseUnit: 'g', baseItems: 4, targetItems: 9 },
                    { food: 'coconut water', baseQty: 900, baseUnit: 'ml', baseItems: 3, targetItems: 7 },
                    { food: 'grated coconut', baseQty: 450, baseUnit: 'g', baseItems: 3, targetItems: 5 },
                    { food: 'honey', baseQty: 240, baseUnit: 'ml', baseItems: 2, targetItems: 5 },
                    { food: 'grated cheese', baseQty: 300, baseUnit: 'g', baseItems: 4, targetItems: 6 },
                    { food: 'whipped cream', baseQty: 500, baseUnit: 'ml', baseItems: 2, targetItems: 3 },
                    { food: 'tamarind paste', baseQty: 180, baseUnit: 'g', baseItems: 3, targetItems: 8 },
                    { food: 'curry powder', baseQty: 250, baseUnit: 'g', baseItems: 5, targetItems: 7 }
                ];

                for (let i = 1; i <= 20; i++) {
                    const item = t3MedItems[i - 1];
                    const perUnit = item.baseQty / item.baseItems;
                    const finalAns = perUnit * item.targetItems;
                    this.questionBank.push({
                        id: `K3-S-${String(i).padStart(3, '0')}`,
                        topic: 'Determining Proportional Quantities',
                        difficulty: 'Sederhana',
                        cognitive: 'Memahami',
                        type: 'Objektif',

            render() {
                const mainContent = document.getElementById('main-content');
                const headerInfo = document.getElementById('user-header-info');
                
                if (this.currentUser) {
                    headerInfo.classList.remove('hidden');
                    document.getElementById('header-avatar').innerText = this.users[this.currentUser].avatar;
                    document.getElementById('header-name').innerText = this.users[this.currentUser].name;
                    document.getElementById('header-score').innerText = this.users[this.currentUser].totalScore || 0;
                } else {
                    headerInfo.classList.add('hidden');
                }

                mainContent.innerHTML = '';

                switch(this.currentScreen) {
                    case 'login':
                        mainContent.innerHTML = this.renderLoginScreen();
                        break;
                    case 'register':
                        mainContent.innerHTML = this.renderRegisterScreen();
                        break;
                    case 'menu':
                        mainContent.innerHTML = this.renderMainMenu();
                        break;
                    case 'topics':
                        mainContent.innerHTML = this.renderTopicSelection();
                        break;
                    case 'difficulty':
                        mainContent.innerHTML = this.renderDifficultySelection();
                        break;
                    case 'timer':
                        mainContent.innerHTML = this.renderTimerSelection();
                        break;
                    case 'quiz':
                        mainContent.innerHTML = this.renderQuizScreen();
                        this.startQuestionTimer();
                        this.renderCanvasDiagram();
                        break;
                    case 'results':
                        mainContent.innerHTML = this.renderResultScreen();
                        break;
                    case 'leaderboard':
                        mainContent.innerHTML = this.renderLeaderboardScreen();
                        break;
                    case 'progress':
                        mainContent.innerHTML = this.renderProgressScreen();
                        break;
                    case 'profile':
                        mainContent.innerHTML = this.renderProfileScreen();
                        break;
                    case 'settings':
                        mainContent.innerHTML = this.renderSettingsScreen();
                        break;
                    default:
                        mainContent.innerHTML = this.renderMainMenu();
                }
            }

                        </div>

                        <div class="text-left">
                            <button onclick="app.switchScreen('menu')" class="w-full px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs game-btn text-center">
                                &larr; Back to Main Menu
                            </button>
                        </div>
                    </div>
                `;
            }

            // --- CONTROLLER ACTIONS & LOGIC ---

            switchScreen(screen) {
                this.currentScreen = screen;
                this.render();
            }

            selectAvatar(avatar) {
                this.selectedAvatarSymbol = avatar;
                document.querySelectorAll('.avatar-opt').forEach(btn => {
                    btn.classList.remove('border-indigo-600', 'bg-indigo-50');
                    btn.classList.add('border-transparent', 'bg-white');
                });
                event.currentTarget.classList.remove('border-transparent', 'bg-white');
                event.currentTarget.classList.add('border-indigo-600', 'bg-indigo-50');
            }

            handleRegister() {
                const nameInput = document.getElementById('reg-username');
                const name = nameInput ? nameInput.value.trim() : '';
                const avatar = this.selectedAvatarSymbol || '👦';

                if (!name) {
                    this.showModal('⚠️ Registration Error', 'Enter a player name to register.');
                    return;
                }

                if (this.users[name]) {
                    this.showModal('⚠️ Account Already Exists', 'This name is already registered. Choose another name or log in.');
                    return;
                }

                this.users[name] = {
                    name: name,
                    avatar: avatar,
                    totalScore: 0,
                    gamesPlayed: 0,
                    totalAnswered: 0,
                    totalCorrect: 0
                };
                this.currentUser = name;
                this.saveDatabase();
                this.switchScreen('menu');
            }

            handleLogin() {
                const nameInput = document.getElementById('login-username');
                const name = nameInput ? nameInput.value.trim() : '';

                if (!name) {
                    this.showModal('⚠️ Login Error', 'Enter your player name.');
                    return;
                }

                if (!this.users[name]) {
                    this.showModal('⚠️ Account Unavailable', 'We could not find this account. Create an account to play.');
                    return;
                }

                this.currentUser = name;
                this.saveDatabase();
                this.switchScreen('menu');
            }

            logout() {
                this.currentUser = null;
                this.saveDatabase();
                this.switchScreen('login');
            }

            selectTopic(topicId) {
                const topicMap = {
                    1: 'Distance Between Two Coordinates',
                    2: 'Ratio of Two Quantities',
                    3: 'Determining Proportional Quantities',
                    4: 'Problem Solving'
                };
                this.selectedTopic = topicMap[topicId];
                this.switchScreen('difficulty');
            }

            selectDifficulty(diff) {
                this.selectedDifficulty = diff;
                this.switchScreen('timer');
            }

            startQuizSession(timerMode) {
                this.selectedTimerMode = timerMode;
                
                // Filter 20 questions based on selected topic and difficulty
                const filtered = this.questionBank.filter(q => q.topic === this.selectedTopic && q.difficulty === this.selectedDifficulty);
                // Shuffle and pick 20
                this.activeQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 20);
                
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.startTime = Date.now();
                
                this.switchScreen('quiz');
            }

            startQuestionTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                
                if (this.selectedTimerMode === 0) {
                    document.getElementById('timer-display').innerText = '♾️ No Time Limit';
                    return;
                }

                this.timeRemaining = this.selectedTimerMode;
                document.getElementById('timer-display').innerText = `00:${String(this.timeRemaining).padStart(2, '0')}`;

                this.timerInterval = setInterval(() => {
                    this.timeRemaining--;
                    const display = document.getElementById('timer-display');
                    if (display) {
                        display.innerText = `00:${String(Math.max(0, this.timeRemaining)).padStart(2, '0')}`;
                    }

                    if (this.timeRemaining <= 0) {
                        clearInterval(this.timerInterval);
                        if (!this.isAnswered) {
                            this.handleTimeout();
                        }
                    }
                }, 1000);
            }

            handleTimeout() {
                this.isAnswered = true;
                this.wrongCount++;
                const q = this.activeQuestions[this.currentQuestionIndex];
                
                const feedbackBox = document.getElementById('feedback-box');
                feedbackBox.className = 'p-4 rounded-2xl mb-4 font-medium text-sm bg-amber-100 text-amber-900 border border-amber-300';
                feedbackBox.innerHTML = `⏱️ <strong>Time’s up!</strong> The correct answer is: <strong>${q.correct}</strong>.<br><small>${q.explanation}</small>`;
                feedbackBox.classList.remove('hidden');

                document.getElementById('next-btn').classList.remove('hidden');
                
                // Disable option buttons
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            }

            submitAnswer(selectedOption) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                if (this.timerInterval) clearInterval(this.timerInterval);

                const q = this.activeQuestions[this.currentQuestionIndex];
                const isCorrect = (selectedOption === q.correct);

                const feedbackBox = document.getElementById('feedback-box');
                
                if (isCorrect) {
                    this.score += 5;
                    this.correctCount++;
                    feedbackBox.className = 'p-4 rounded-2xl mb-4 font-medium text-sm bg-emerald-100 text-emerald-900 border border-emerald-300';
                    feedbackBox.innerHTML = `🎉 <strong>CORRECT! +5 MARKS</strong><br><small>${q.explanation}</small>`;
                } else {
                    this.wrongCount++;
                    feedbackBox.className = 'p-4 rounded-2xl mb-4 font-medium text-sm bg-rose-100 text-rose-900 border border-rose-300';
                    feedbackBox.innerHTML = `❌ <strong>INCORRECT</strong><br>The correct answer is: <strong>${q.correct}</strong>.<br><small>${q.explanation}</small>`;
                }

                feedbackBox.classList.remove('hidden');
                document.getElementById('curr-score').innerText = this.score;
                document.getElementById('next-btn').classList.remove('hidden');

                // Highlight correct / incorrect buttons
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.disabled = true;
                    if (btn.value === q.correct) {
                        btn.classList.remove('bg-white', 'border-indigo-200');
                        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                    } else if (btn.value === selectedOption && !isCorrect) {
                        btn.classList.remove('bg-white', 'border-indigo-200');
                        btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                    }
                });
            }

            nextQuestion() {
                this.isAnswered = false;
                this.currentQuestionIndex++;

                if (this.currentQuestionIndex >= this.activeQuestions.length) {
                    this.finishQuizSession();
                } else {
                    this.render();
                }
            }

            finishQuizSession() {
                // Update User profile stats
                const u = this.users[this.currentUser];
                u.totalScore = (u.totalScore || 0) + this.score;
                u.gamesPlayed = (u.gamesPlayed || 0) + 1;
                u.totalAnswered = (u.totalAnswered || 0) + this.activeQuestions.length;
                u.totalCorrect = (u.totalCorrect || 0) + this.correctCount;
                this.saveDatabase();

                this.switchScreen('results');
            }

            restartQuiz() {
                this.startQuizSession(this.selectedTimerMode);
            }

            confirmHome() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.showConfirmModal('⚠️ Back to Main Menu?', 'Leave this quiz? Your score for this session will be lost.', () => {
                    this.switchScreen('menu');
                });
            }

            showConfirmModal(title, message, onConfirmCallback) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                const actions = document.getElementById('modal-actions');
                actions.innerHTML = `
                    <button onclick="app.closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2.5 px-5 rounded-xl transition">Cancel</button>
                    <button id="modal-confirm-btn" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg transition">Yes, Go Back</button>
                `;
                document.getElementById('modal-confirm-btn').onclick = () => {
                    this.closeModal();
                    if (onConfirmCallback) onConfirmCallback();
                };
                document.getElementById('modal-container').classList.remove('hidden');
            }

            renderCanvasDiagram() {
                const canvas = document.getElementById('quiz-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const q = this.activeQuestions[this.currentQuestionIndex];

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (q.diagram && q.diagram.type === 'coordinate') {
                    // Draw Coordinate Grid Sukuan Pertama
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 1;
                    for (let x = 65; x < canvas.width - 20; x += 35) {
                        ctx.beginPath(); ctx.moveTo(x, 10); ctx.lineTo(x, canvas.height - 30); ctx.stroke();
                    }
                    for (let y = canvas.height - 46; y >= 10; y -= 16) {
                        ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(canvas.width - 20, y); ctx.stroke();
                    }

                    // Axes
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(30, canvas.height - 30); ctx.lineTo(canvas.width - 20, canvas.height - 30); ctx.stroke(); // X axis
                    ctx.beginPath(); ctx.moveTo(30, canvas.height - 30); ctx.lineTo(30, 10); ctx.stroke(); // Y axis

                    // Labels
                    ctx.fillStyle = '#1e293b';
                    ctx.font = '10px Fredoka';
                    ctx.fillText('0', 18, canvas.height - 18);
                    ctx.fillText('x', canvas.width - 15, canvas.height - 18);
                    ctx.fillText('y', 18, 15);

                    // Plot points
                    q.diagram.points.forEach((p, idx) => {
                        const px = 30 + (p.x * 35);
                        const py = (canvas.height - 30) - (p.y * 16);
                        ctx.fillStyle = idx === 0 ? '#4f46e5' : (idx === 1 ? '#ef4444' : '#10b981');
                        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#1e293b';
                        ctx.font = 'bold 12px Fredoka';
                        ctx.fillText(`${p.name}(${p.x},${p.y})`, px + 8, py - 4);
                    });

                    if (q.diagram.scale) {
                        ctx.fillStyle = '#6366f1';
                        ctx.font = '11px Fredoka';
                        ctx.fillText(`Scale: ${q.diagram.scale}`, 40, 20);
                    }
                } else if (q.diagram && q.diagram.type === 'ratio_objects') {
                    // Draw Ratio Objects visual illustration
                    let startX = 40;
                    let startY = 40;
                    q.diagram.items.forEach((item, groupIdx) => {
                        ctx.fillStyle = '#1e293b';
                        ctx.font = 'bold 12px Fredoka';
                        ctx.fillText(`${item.name} (${item.count ?? '?'}):`, startX, startY);
                        
                        startY += 20;
                        for (let c = 0; c < Math.min(item.count, 12); c++) {
                            ctx.fillStyle = item.color;
                            ctx.beginPath();
                            ctx.arc(startX + (c * 22), startY, 8, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        if (item.count > 12) {
                            ctx.fillStyle = '#1e293b';
                            ctx.font = '10px Fredoka';
                            ctx.fillText(`... (+${item.count - 12} more)`, startX + (12 * 22), startY + 4);
                        }
                        startY += 40;
                    });
                } else {
                    // Proportion / default banner
                    ctx.fillStyle = '#4f46e5';
                    ctx.font = 'bold 14px Fredoka';
                    ctx.fillText(q.diagram ? q.diagram.text : 'Year 6 KSSR Mathematics', 40, 90);
                }
            }

            showModal(title, message) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                document.getElementById('modal-container').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        }

        // Initialize application instance on window load
        let app;
        window.onload = function() {
            app = new MathKidsApp();
            app.render();
        };
    </script>
</body>
