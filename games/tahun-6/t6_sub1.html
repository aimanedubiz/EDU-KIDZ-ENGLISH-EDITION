    <script>
        const TOPICS_LIST = [
            { id: 1, title: 'EXPLORING NUMBERS', icon: "🔢", desc: 'Read and partition numbers up to 10,000,000.', subtopics: ['Numbers in Millions', 'Writing Numerals', 'Writing Numbers in Words', 'Exploring Numbers', 'Expanded Form', 'Place Value', 'Digit Value'] },
            { id: 2, title: 'NUMBER PATTERNS', icon: "📈", desc: 'Find missing terms in a number pattern.', subtopics: ['Identify a Pattern', 'Complete a Pattern', 'Find the Next Term', 'Find a Missing Term', 'Ascending and Descending Patterns'] },
            { id: 3, title: 'FRACTIONS AND DECIMALS OF A MILLION', icon: "📊", desc: 'Express fractions and decimals of a million as whole numbers.', subtopics: ['Fractions of a Million', 'Decimals of a Million', 'Equivalent Forms', 'Writing Fractions and Decimals', 'Compare Values'] },
            { id: 4, title: 'NUMBER CONVERSIONS', icon: "🔄", desc: 'Convert between numerals, words and expanded form.', subtopics: ['Numerals to Words', 'Words to Numerals', 'Expanded Form to Numerals', 'Fractions of a Million', 'Decimals of a Million'] },
            { id: 5, title: 'BASIC OPERATIONS', icon: "➕", desc: 'Add, subtract, multiply and divide whole numbers.', subtopics: ['Addition', 'Subtraction', 'Multiplication', 'Division', 'Written and Mental Methods'] },
            { id: 6, title: 'COMBINED OPERATIONS', icon: "🧮", desc: 'Use the order of operations.', subtopics: ['Addition and Subtraction', 'Multiplication and Division', 'Addition and Multiplication', 'Multiple Operations'] },
            { id: 7, title: 'OPERATIONS WITH UNKNOWNS', icon: "❓", desc: 'Find unknown values in number sentences.', subtopics: ['Unknowns in Addition', 'Unknowns in Subtraction', 'Unknowns in Multiplication', 'Unknowns in Division', 'Unknowns in Combined Operations'] },
            { id: 8, title: 'PRIME AND COMPOSITE NUMBERS', icon: "⭐", desc: 'Identify prime numbers, composite numbers and factors.', subtopics: ['Prime Numbers', 'Composite Numbers', 'Comparing Prime and Composite Numbers', 'Factors'] },
            { id: 9, title: 'PROBLEM SOLVING', icon: "💡", desc: 'Solve everyday problems involving pupils, distances, goods and money.', subtopics: ['Pupil Numbers', 'Travel Distances', 'Production and Distribution', 'School Spending'] }
        ];

        function numberInWords(n) {
            const small = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
            const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
            if (n < 20) return small[n];
            if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? '-' + small[n % 10] : '');
            const [scale, label] = n >= 1000000 ? [1000000, 'million'] : n >= 1000 ? [1000, 'thousand'] : [100, 'hundred'];
            const rest = n % scale;
            return numberInWords(Math.floor(n / scale)) + ' ' + label + (rest ? (rest < 100 ? ' and ' : ' ') + numberInWords(rest) : '');
        }

        function generateCompleteQuestionBank() {
            const bank = {};
            const levels = ['Senang', 'Sederhana', 'Susah'];
            const cognitiveLevels = {
                'Senang': ['Remembering', 'Understanding'],
                'Sederhana': ['Remembering', 'Understanding', 'Applying'],
                'Susah': ['Understanding', 'Applying']
            };
            const gameTypes = ['Objektif', 'Padanan', 'Drag & Drop', 'Isi Tempat Kosong'];

            TOPICS_LIST.forEach((topic, tIdx) => {
                bank[topic.id] = {};
                levels.forEach(level => {
                    bank[topic.id][level] = [];
                    for (let q = 1; q <= 20; q++) {
                        const cogArr = cognitiveLevels[level];
                        const cog = cogArr[(q + tIdx) % cogArr.length];
                        const gType = gameTypes[(q + tIdx) % gameTypes.length];
                        
                        let qData = createDynamicQuestion(topic.id, level, q, cog, gType);
                        bank[topic.id][level].push(qData);
                    }
                });
            });
            return bank;
        }

        function createDynamicQuestion(topicId, level, qNum, cog, gType) {
            const id = `T${topicId}_${level.toUpperCase()}_Q${qNum}`;
            let subtopic = TOPICS_LIST[topicId - 1].subtopics[(qNum - 1) % TOPICS_LIST[topicId - 1].subtopics.length];
            
            // Helper function to strictly format numbers with exact comma positions (groups of 3 digits from right)
            const formatKpmNumber = (num) => {
                if (num === null || num === undefined) return '';
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            };

            let seed1 = (qNum * 17 + topicId * 31) % 900 + 100;
            let seed2 = (qNum * 23 + topicId * 13) % 800 + 150;
            
            let qText = "";
            let options = [];
            let answer = "";
            let diagram = "kad_nombor_juta";
            let explanation = "";

            switch(topicId) {
                case 1: // KENALI NOMBOR
                    if (qNum % 3 === 0) {
                        let jutaDigit = (qNum % 5) + 2; // 2 hingga 6
                        let ratusRibuDigit = (seed1 % 8) + 1; // 1 hingga 8
                        let bakiNombor = (seed2 * 100 + 120).toString().padStart(5, '0');
                        
                        // Pembinaan nombor 7 digit yang tepat
                        let rawFullNum = parseInt(`${jutaDigit}${ratusRibuDigit}${bakiNombor}`);
                        let formattedFull = formatKpmNumber(rawFullNum);
                        
                        // Buat garisan bawah khusus pada digit ratus ribu
                        let displayNumStr = formattedFull.replace(
                            /(?<=^\d,)\d/, 
                            `<u class="underline text-blue-600 font-extrabold decoration-2 decoration-blue-500">${ratusRibuDigit}</u>`
                        );
                        
                        let rawRatusRibu = ratusRibuDigit * 100000;
                        
                        qText = `What is the value of the underlined digit in ${displayNumStr}?`;
                        options = [
                            formatKpmNumber(rawRatusRibu), 
                            formatKpmNumber(rawRatusRibu / 10), 
                            formatKpmNumber(rawRatusRibu * 10), 
                            formatKpmNumber(ratusRibuDigit * 1000)
                        ];
                        answer = formatKpmNumber(rawRatusRibu);
                        diagram = "carta_nilai_tempat";
                        explanation = `The underlined digit is in the hundred thousands place. Its value is ${formatKpmNumber(rawRatusRibu)}.`;
                    } else if (qNum % 3 === 1) {
                        qText = `Write “three million two hundred thousand and forty-nine” in numerals.`;
                        options = ["3,200,049", "3,200,490", "3,020,049", "3,249,000"];
                        answer = "3,200,049";
                        diagram = "kad_nombor_juta";
                        explanation = `Add 3,000,000, 200,000 and 49 to get 3,200,049.`;
                    } else {
                        const number = 5000000 + seed1 * 1000 + 682;
                        const placeValues = [...String(number)].map((digit, i) => Number(digit) * 10 ** (6 - i)).filter(Boolean);
                        const expanded = values => values.map(formatKpmNumber).join(' + ');
                        answer = expanded(placeValues);
                        qText = `Which expression shows ${formatKpmNumber(number)} in expanded form?`;
                        options = [
                            answer,
                            expanded(placeValues.slice(0, -1)),
                            expanded([...placeValues.slice(0, -1), 20]),
                            expanded([500000, ...placeValues.slice(1)])
                        ];
                        diagram = "carta_cerakinkan_nombor";
                        explanation = `Write the number as the sum of its digit values.`;
                    }
                    break;
                case 2: // POLA NOMBOR
                    let startNum = 1205000 + qNum * 10000;
                    let step = 25000 + qNum * 1000;
                    qText = `Find the missing number in this ascending pattern: ${formatKpmNumber(startNum)}, ${formatKpmNumber(startNum + step)}, [ ? ], ${formatKpmNumber(startNum + step * 3)}.`;
                    let wrong1 = formatKpmNumber(startNum + step * 2 + 5000);
                    let wrong2 = formatKpmNumber(startNum + step * 2 - 2000);
                    let wrong3 = formatKpmNumber(startNum + step * 2 + 10000);
                    let correctAns = formatKpmNumber(startNum + step * 2);
                    options = [correctAns, wrong1, wrong2, wrong3].sort();
                    answer = correctAns;
                    diagram = "carta_pola";
                    explanation = `Add ${formatKpmNumber(step)} to get each successive term.`;
                    break;
                case 3: // PECAHAN JUTA & PERPULUHAN JUTA
                    if (qNum % 2 === 0) {
                        let fracNumer = (qNum % 3) + 1;
                        let val = 1000000 + (fracNumer / 4) * 1000000;
                        qText = `Write 1 ${fracNumer}/4 million as a whole number.`;
                        options = [formatKpmNumber(val), formatKpmNumber(val + 100000), formatKpmNumber(val - 50000), formatKpmNumber(val + 250000)];
                        answer = formatKpmNumber(val);
                        diagram = "grid_pecahan";
                        explanation = `Multiply ${fracNumer}/4 by 1,000,000, then add 1,000,000 to get ${formatKpmNumber(val)}.`;
                    } else {
                        let decPart = (qNum * 15) % 90 + 10;
                        let pVal = 3000000 + decPart * 10000;
                        qText = `Write 3.${decPart} million as a whole number.`;
                        options = [formatKpmNumber(pVal), formatKpmNumber(pVal + 10000), formatKpmNumber(pVal - 20000), formatKpmNumber(pVal + 200000)];
                        answer = formatKpmNumber(pVal);
                        diagram = "grid_perpuluhan";
                        explanation = `Multiply 3.${decPart} by 1,000,000.`;
                    }
                    break;
                case 4: // PENUKARAN NOMBOR
                    const conversionType = qNum % 5;
                    if (conversionType === 0) {
                        let numVal = 2000000 + seed1 * 100;
                        qText = `Write ${formatKpmNumber(numVal)} in words.`;
                        options = [
                            numberInWords(numVal),
                            numberInWords(2000000 + seed1 * 1000),
                            numberInWords(numVal + 10000),
                            numberInWords(2000000 + seed1)
                        ];
                        answer = numberInWords(numVal);
                        diagram = "kad_nombor_juta";
                        explanation = `The number is written as “${numberInWords(numVal)}”.`;
                    } else if (conversionType === 1) {
                        let targetNum = 4000000 + seed2 * 1000;
                        qText = `Write “${numberInWords(targetNum)}” in numerals.`;
                        options = [
                            formatKpmNumber(targetNum),
                            formatKpmNumber(targetNum + 100000),
                            formatKpmNumber(targetNum - 50000),
                            formatKpmNumber(4000000 + seed2 * 100)
                        ].sort();
                        answer = formatKpmNumber(targetNum);
                        diagram = "kad_nombor_juta";
                        explanation = `The numeral is ${formatKpmNumber(targetNum)}.`;
                    } else if (conversionType === 2) {
                        let cNum = 5000000 + seed1 * 1000 + 400 + 80 + 3;
                        qText = `Write this expanded form as a single number: 5,000,000 + ${formatKpmNumber(seed1*1000)} + 400 + 80 + 3.`;
                        options = [
                            formatKpmNumber(cNum),
                            formatKpmNumber(cNum + 1000),
                            formatKpmNumber(5000000 + seed1*100 + 483),
                            formatKpmNumber(cNum - 400)
                        ].sort();
                        answer = formatKpmNumber(cNum);
                        diagram = "carta_cerakinkan_nombor";
                        explanation = `Add the values to get ${formatKpmNumber(cNum)}.`;
                    } else if (conversionType === 3) {
                        let numer = (qNum % 2 === 0) ? 1 : 3;
                        let denom = 4;
                        let fracResult = (numer / denom) * 1000000;
                        qText = `Write ${numer}/${denom} million as a whole number.`;
                        options = [
                            formatKpmNumber(fracResult),
                            formatKpmNumber(fracResult + 250000),
                            formatKpmNumber(fracResult - 125000),
                            formatKpmNumber(fracResult + 100000)
                        ].sort();
                        answer = formatKpmNumber(fracResult);
                        diagram = "grid_pecahan";
                        explanation = `${numer}/${denom} × 1,000,000 = ${formatKpmNumber(fracResult)}.`;
                    } else {
                        let decVal = (qNum * 25) % 900 + 100;
                        let decResult = decVal * 1000;
                        qText = `Write 0.${decVal} million as a whole number.`;
                        options = [
                            formatKpmNumber(decResult),
                            formatKpmNumber(decResult + 100000),
                            formatKpmNumber(decResult / 10),
                            formatKpmNumber(decResult + 50000)
                        ].sort();
                        answer = formatKpmNumber(decResult);
                        diagram = "grid_perpuluhan";
                        explanation = `Multiply 0.${decVal} by 1,000,000 to get ${formatKpmNumber(decResult)}.`;
                    }
                    break;
                case 5: // OPERASI ASAS
                    const opType = qNum % 4;
                    if (opType === 0) {
                        let numA = 1245000 + qNum * 12345;
                        let numB = 356000 + qNum * 5432;
                        let res = numA + numB;
                        qText = `Calculate ${formatKpmNumber(numA)} + ${formatKpmNumber(numB)}.`;
                        options = [
                            formatKpmNumber(res),
                            formatKpmNumber(res + 1000),
                            formatKpmNumber(res - 2500),
                            formatKpmNumber(res + 10000)
                        ].sort(() => Math.random() - 0.5);
                        answer = formatKpmNumber(res);
                        diagram = "kad_operasi";
                        explanation = `Line up the digits by place value and add. The sum is ${formatKpmNumber(res)}.`;
                    } else if (opType === 1) {
                        let numA = 5890400 + qNum * 15200;
                        let numB = 2134000 + qNum * 3100;
                        let res = numA - numB;
                        qText = `Calculate ${formatKpmNumber(numA)} − ${formatKpmNumber(numB)}.`;
                        options = [
                            formatKpmNumber(res),
                            formatKpmNumber(res + 5000),
                            formatKpmNumber(res - 1000),
                            formatKpmNumber(res + 20000)
                        ].sort(() => Math.random() - 0.5);
                        answer = formatKpmNumber(res);
                        diagram = "kad_operasi";
                        explanation = `Exchange from the next place value if needed. The difference is ${formatKpmNumber(res)}.`;
                    } else if (opType === 2) {
                        let numA = 145000 + qNum * 1200;
                        let numB = 12 + (qNum % 8);
                        let res = numA * numB;
                        qText = `Calculate ${formatKpmNumber(numA)} × ${numB}.`;
                        options = [
                            formatKpmNumber(res),
                            formatKpmNumber(res + numA),
                            formatKpmNumber(res - numA),
                            formatKpmNumber(res + 50000)
                        ].sort(() => Math.random() - 0.5);
                        answer = formatKpmNumber(res);
                        diagram = "kad_operasi";
                        explanation = `Use written multiplication to get ${formatKpmNumber(res)}.`;
                    } else {
                        let divisor = 15 + (qNum % 10);
                        let quotient = 234000 + qNum * 1100;
                        let dividend = quotient * divisor;
                        qText = `Calculate ${formatKpmNumber(dividend)} ÷ ${divisor}.`;
                        options = [
                            formatKpmNumber(quotient),
                            formatKpmNumber(quotient + 1000),
                            formatKpmNumber(quotient - 500),
                            formatKpmNumber(quotient + 5000)
                        ].sort(() => Math.random() - 0.5);
                        answer = formatKpmNumber(quotient);
                        diagram = "kad_operasi";
                        explanation = `Use long division to get ${formatKpmNumber(quotient)}.`;
                    }
                    break;
                case 6: // OPERASI BERGABUNG
                    qText = `Use the order of operations to work out 4,500,000 + ${formatKpmNumber(seed1 * 1000)} × 2.`;
                    let resOp = 4500000 + seed1 * 2000;
                    options = [formatKpmNumber(resOp), formatKpmNumber(4500000 + seed1 * 1000), formatKpmNumber(4550000 + seed1 * 2000), formatKpmNumber(4400000 + seed1 * 2000)].sort();
                    answer = formatKpmNumber(resOp);
                    diagram = "kad_operasi";
                    explanation = `Multiply before adding. The result is ${formatKpmNumber(resOp)}.`;
                    break;
                case 7: // OPERASI MELIBATKAN ANU
                    const varsList = ['x', 'y', 'z', 'p', 'q', 'm'];
                    const chosenVar = varsList[(qNum + topicId) % varsList.length];
                    
                    if (level === 'Senang') {
                        let baseVal = 1000000 + (qNum * 125400);
                        let targetVal = baseVal + 2500000 + (qNum * 50000);
                        
                        if (qNum % 2 === 0) {
                            qText = `Find ${chosenVar}: ${chosenVar} + ${formatKpmNumber(baseVal)} = ${formatKpmNumber(targetVal)}.`;
                            let correctVal = targetVal - baseVal;
                            answer = formatKpmNumber(correctVal);
                            options = [
                                formatKpmNumber(correctVal),
                                formatKpmNumber(correctVal + 150000),
                                formatKpmNumber(targetVal + 300000),
                                formatKpmNumber(baseVal - 50000)
                            ].sort();
                            explanation = `Subtract ${formatKpmNumber(baseVal)} from ${formatKpmNumber(targetVal)} to get ${formatKpmNumber(correctVal)}.`;
                        } else {
                            qText = `Find ${chosenVar}: ${formatKpmNumber(targetVal)} − ${chosenVar} = ${formatKpmNumber(baseVal)}.`;
                            let correctVal = targetVal - baseVal;
                            answer = formatKpmNumber(correctVal);
                            options = [
                                formatKpmNumber(correctVal),
                                formatKpmNumber(correctVal + 200000),
                                formatKpmNumber(targetVal),
                                formatKpmNumber(correctVal - 100000)
                            ].sort();
                            explanation = `Subtract ${formatKpmNumber(baseVal)} from ${formatKpmNumber(targetVal)} to get ${formatKpmNumber(correctVal)}.`;
                        }
                    } else if (level === 'Sederhana') {
                        if (qNum % 2 === 0) {
                            let multiplier = 2 + (qNum % 6);
                            let singleVal = 800000 + (qNum * 75000);
                            let productVal = multiplier * singleVal;
                            qText = `Find ${chosenVar}: ${multiplier} × ${chosenVar} = ${formatKpmNumber(productVal)}.`;
                            answer = formatKpmNumber(singleVal);
                            options = [
                                formatKpmNumber(singleVal),
                                formatKpmNumber(singleVal + 100000),
                                formatKpmNumber(singleVal * 2),
                                formatKpmNumber(singleVal - 50000)
                            ].sort();
                            explanation = `Divide ${formatKpmNumber(productVal)} by ${multiplier} to get ${formatKpmNumber(singleVal)}.`;
                        } else {
                            let divisorVal = 3 + (qNum % 5);
                            let baseQuotient = 1200000 + (qNum * 95000);
                            let dividendVal = baseQuotient * divisorVal;
                            qText = `Find ${chosenVar}: ${chosenVar} ÷ ${divisorVal} = ${formatKpmNumber(baseQuotient)}.`;
                            answer = formatKpmNumber(dividendVal);
                            options = [
                                formatKpmNumber(dividendVal),
                                formatKpmNumber(dividendVal + 400000),
                                formatKpmNumber(dividendVal - 250000),
                                formatKpmNumber(baseQuotient)
                            ].sort();
                            explanation = `Multiply ${formatKpmNumber(baseQuotient)} by ${divisorVal} to get ${formatKpmNumber(dividendVal)}.`;
                        }
                    } else {
                        let multFactor = 2 + (qNum % 3);
                        let addPartVal = 1200000 + (qNum * 50000);
                        let innerVarVal = 1500000 + (qNum * 110000);
                        let totalResultVal = (multFactor * innerVarVal) + addPartVal;
                        
                        qText = `Find ${chosenVar}: (${multFactor} × ${chosenVar}) + ${formatKpmNumber(addPartVal)} = ${formatKpmNumber(totalResultVal)}.`;
                        answer = formatKpmNumber(innerVarVal);
                        options = [
                            formatKpmNumber(innerVarVal),
                            formatKpmNumber(innerVarVal + 200000),
                            formatKpmNumber(innerVarVal - 150000),
                            formatKpmNumber(innerVarVal * 2)
                        ].sort();
                        explanation = `Subtract ${formatKpmNumber(addPartVal)} from ${formatKpmNumber(totalResultVal)}, then divide by ${multFactor}.`;
                    }
                    diagram = "kotak_anu";
                    break;
                case 8: // NOMBOR PERDANA & GUBAHAN
                    const subType8 = qNum % 4;
                    if (subType8 === 0) {
                        // Mengenal pasti nombor perdana (Prime Numbers)
                        const primePools = [
                            { q: "Which of these numbers is prime?", opts: ["17", "15", "21", "27"], ans: "17", exp: "The only factors of 17 are 1 and 17." },
                            { q: "Which prime number is between 30 and 40?", opts: ["31", "33", "35", "39"], ans: "31", exp: "31 is prime. The other choices have more than two factors." },
                            { q: "How many prime numbers are there from 1 to 10?", opts: ["4", "3", "5", "6"], ans: "4", exp: "There are four prime numbers from 1 to 10: 2, 3, 5 and 7." },
                            { q: "What is the only even prime number?", opts: ["2", "4", "0", "6"], ans: "2", exp: "2 is the only even prime number." }
                        ];
                        let pItem = primePools[qNum % primePools.length];
                        qText = pItem.q;
                        options = [...pItem.opts].sort(() => Math.random() - 0.5);
                        answer = pItem.ans;
                        explanation = pItem.exp;
                    } else if (subType8 === 1) {
                        // Mengenal pasti nombor gubahan (Composite Numbers)
                        const compPools = [
                            { q: "Which of these numbers is composite?", opts: ["57", "37", "41", "43"], ans: "57", exp: "57 is composite. Its factors are 1, 3, 19 and 57." },
                            { q: "Which composite number is between 20 and 30?", opts: ["25", "23", "29", "31"], ans: "25", exp: "25 has three factors: 1, 5 and 25." },
                            { q: "Why is 49 a composite number?", opts: ["It has more than two factors: 1, 7 and 49.", "It is odd.", "It is prime.", "It is divisible by 2."], ans: "It has more than two factors: 1, 7 and 49.", exp: "A composite number has more than two factors." },
                            { q: "What is the smallest composite number?", opts: ["4", "2", "3", "1"], ans: "4", exp: "4 is the smallest composite number. Its factors are 1, 2 and 4." }
                        ];
                        let cItem = compPools[qNum % compPools.length];
                        qText = cItem.q;
                        options = [...cItem.opts].sort(() => Math.random() - 0.5);
                        answer = cItem.ans;
                        explanation = cItem.exp;
                    } else if (subType8 === 2) {
                        // Perbandingan & Ciri Nombor Perdana vs Gubahan
                        qText = `Which statement about prime and composite numbers is true?`;
                        options = [
                            "1 is neither prime nor composite.",
                            "All odd numbers are prime.",
                            "2 is composite.",
                            "Prime numbers have more than two factors."
                        ];
                        answer = "1 is neither prime nor composite.";
                        explanation = `One has only one factor. A prime number has exactly two factors and a composite number has more than two.`;
                    } else if (subType8 === 3) {
                        // Mencari senarai faktor bagi suatu nombor
                        let targetNum = 24 + (qNum * 2);
                        if (targetNum > 60) targetNum = 36;
                        
                        let factorsList = [];
                        for(let i=1; i<=targetNum; i++) {
                            if(targetNum % i === 0) factorsList.push(i);
                        }
                        qText = `List all the factors of ${targetNum}.`;
                        let correctStr = factorsList.join(', ');
                        let wrongStr1 = factorsList.filter(f => f !== 2).join(', ');
                        let wrongStr2 = [...factorsList, targetNum + 2].join(', ');
                        let wrongStr3 = factorsList.slice(1).join(', ');
                        
                        options = [correctStr, wrongStr1, wrongStr2, wrongStr3].sort();
                        answer = correctStr;
                        explanation = `The factors divide ${targetNum} with no remainder. They are ${correctStr}.`;
                    } else {
                        // Mengenal pasti faktor sepunya atau bilangan faktor
                        let numF = 30 + (qNum * 4);
                        qText = `How many factors does ${numF} have?`;
                        let fCount = 0;
                        for(let i=1; i<=numF; i++) { if(numF % i === 0) fCount++; }
                        
                        options = [fCount.toString(), (fCount + 2).toString(), (fCount - 1).toString(), (fCount + 4).toString()].sort();
                        answer = fCount.toString();
                        explanation = `There are ${fCount} whole numbers that divide ${numF} exactly.`;
                    }
                    diagram = "carta_faktor";
                    break;
                case 9: // PENYELESAIAN MASALAH
                    const pType = qNum % 4;
                    if (pType === 0) {
                        let baseMurid = 1240 + (qNum * 125);
                        let totalZoneMurid = baseMurid * 8;
                        qText = `Eight districts take part in the Bernama education programme. Each district sends ${formatKpmNumber(baseMurid)} pupils. How many pupils take part altogether?`;
                        options = [
                            formatKpmNumber(totalZoneMurid),
                            formatKpmNumber(totalZoneMurid + 2500),
                            formatKpmNumber(totalZoneMurid - 1200),
                            formatKpmNumber(baseMurid * 7)
                        ].sort();
                        answer = formatKpmNumber(totalZoneMurid);
                        diagram = "situasi_kehidupan_sebenar";
                        explanation = `Multiply the number in each district by eight.`;
                    } else if (pType === 1) {
                        let kmBase = 1250 + (qNum * 450);
                        let kmReturn = kmBase * 2;
                        qText = `A convoy travels ${formatKpmNumber(kmBase)} km from Kuala Lumpur to Perlis. It returns by the same route. How far does it travel altogether?`;
                        options = [
                            formatKpmNumber(kmReturn),
                            formatKpmNumber(kmReturn + 500),
                            formatKpmNumber(kmBase + 1000),
                            formatKpmNumber(kmReturn - 800)
                        ].sort();
                        answer = formatKpmNumber(kmReturn);
                        diagram = "situasi_kehidupan_sebenar";
                        explanation = `Multiply the one-way distance by two.`;
                    } else if (pType === 2) {
                        let prodBox = 2450000 + (qNum * 12000);
                        let soldBox = 1200000 + (qNum * 5000);
                        let remainBox = prodBox - soldBox;
                        qText = `A warehouse prints ${formatKpmNumber(prodBox)} magazines for schools. It distributes ${formatKpmNumber(soldBox)} in the first week. How many remain?`;
                        options = [
                            formatKpmNumber(remainBox),
                            formatKpmNumber(remainBox + 50000),
                            formatKpmNumber(remainBox - 20000),
                            formatKpmNumber(prodBox + soldBox)
                        ].sort();
                        answer = formatKpmNumber(remainBox);
                        diagram = "situasi_kehidupan_sebenar";
                        explanation = `Subtract the number distributed from the number printed.`;
                    } else {
                        let unitPrice = 15 + (qNum % 10);
                        let totalUnits = 45000 + (qNum * 500);
                        let totalCost = unitPrice * totalUnits;
                        qText = `A parent–teacher association buys ${formatKpmNumber(totalUnits)} digital dictionaries for Year 6. Each costs RM${unitPrice}. What is the total cost?`;
                        options = [

                            `RM ${formatKpmNumber(totalCost - 25000)}`,
                            `RM ${formatKpmNumber(totalUnits * (unitPrice + 2))}`
                        ].sort();
                        answer = `RM ${formatKpmNumber(totalCost)}`;
                        diagram = "situasi_kehidupan_sebenar";
                        explanation = `Multiply the number of dictionaries by RM${unitPrice}.`;
                    }
                    break;
            }

            return {
                id: id,
                kategori: TOPICS_LIST[topicId - 1].title,
                subtopik: subtopic,

        function setTimeMode(t) {
            state.selectedTimeMode = t;
            [30, 60, 0].forEach(tm => {
                const btn = document.getElementById(`time-${tm}`);
                if (btn) {
                    if (tm === t) {
                        btn.className = "p-3 rounded-xl border-2 font-bold text-xs transition border-blue-500 bg-blue-50 text-blue-800";
                    } else {
                        btn.className = "p-3 rounded-xl border-2 font-bold text-xs transition border-slate-200 bg-slate-50 text-slate-600";
                    }
                }
            });
        }

        function startGameSession() {
            const gTypeSelect = document.getElementById('setup-game-type');
            state.selectedGameType = gTypeSelect ? gTypeSelect.value : 'Objektif';
            if (!state.selectedDifficulty) state.selectedDifficulty = 'Senang';
            if (!state.selectedTopic) state.selectedTopic = 1;

            const topicPool = QUESTION_BANK[state.selectedTopic][state.selectedDifficulty];
            state.activeQuestions = [...topicPool].sort(() => Math.random() - 0.5).slice(0, 20);
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.correctCount = 0;
            state.wrongCount = 0;
            state.answeredCurrent = false;

            router.navigate('game');
        }

        function renderGameView() {
            const topic = TOPICS_LIST.find(t => t.id === state.selectedTopic) || TOPICS_LIST[0];
            return `
            <div class="flex-1 flex flex-col max-w-4xl mx-auto w-full space-y-4">
                <div class="bg-white p-4 rounded-2xl game-card-shadow border border-slate-100 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center space-x-3">
                        <span class="bg-blue-100 text-blue-700 font-bold text-xs px-3 py-1 rounded-full">${topic.title}</span>
                        <span class="bg-emerald-100 text-emerald-700 font-bold text-xs px-3 py-1 rounded-full">${state.selectedDifficulty || 'Senang'}</span>
                    </div>
                    <div class="flex items-center space-x-4 text-sm font-extrabold text-slate-700">
                        <div>📝 Question: <span id="hud-q-num" class="text-blue-600">1 / 20</span></div>
                        <div>⭐ Marks: <span id="hud-score" class="text-amber-600">0</span></div>
                        <div id="timer-container" class="bg-rose-50 text-rose-700 px-3 py-1 rounded-xl border border-rose-100">⏱ Time: <span id="hud-timer">60</span>s</div>
                    </div>
                </div>

                <div class="bg-white p-6 sm:p-8 rounded-3xl game-card-shadow border border-slate-100 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span id="q-cognitive" class="text-xs font-bold bg-purple-100 text-purple-700 px-3 py-1 rounded-full">Remembering</span>
                            <span id="q-subtopic" class="text-xs font-bold text-slate-400">Subtopic</span>
                        </div>

                        <div id="q-diagram-box" class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 p-4 rounded-2xl mb-6 text-center">
                            <div class="text-3xl mb-1" id="diagram-icon">📊</div>
                            <div id="diagram-title" class="text-xs font-extrabold text-blue-800 tracking-wider uppercase">Question Diagram</div>
                        </div>

                        <h3 id="q-text" class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-relaxed whitespace-pre-line">
                            Loading question…
                        </h3>

                        <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6"></div>
                    </div>

                    <div id="feedback-box" class="hidden p-4 rounded-2xl border mb-4 transition-all">
                        <div id="feedback-title" class="font-extrabold text-base mb-1"></div>
                        <p id="feedback-desc" class="text-sm"></p>
                    </div>

                    <div class="flex justify-end pt-4 border-t border-slate-100">
                        <button id="next-btn" onclick="nextQuestion()" class="hidden px-8 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-lg transition">
                            Next Question →
                        </button>
                    </div>
                </div>
            </div>`;
        }


        function initGameLogic() {
            loadCurrentQuestion();
        }

        function loadCurrentQuestion() {
            if (state.currentQuestionIndex >= state.activeQuestions.length) {
                finishGameSession();
                return;
            }

            state.answeredCurrent = false;
            const q = state.activeQuestions[state.currentQuestionIndex];
            if (!q) return;

            const qNumEl = document.getElementById('hud-q-num');
            const scoreEl = document.getElementById('hud-score');
            const cogEl = document.getElementById('q-cognitive');
            const subEl = document.getElementById('q-subtopic');
            const textEl = document.getElementById('q-text');

            if (qNumEl) qNumEl.innerText = `${state.currentQuestionIndex + 1} / 20`;
            if (scoreEl) scoreEl.innerText = state.score;
            if (cogEl) cogEl.innerText = `Skill: ${q.aras_kognitif}`;
            if (subEl) subEl.innerText = q.subtopik;
            if (textEl) textEl.innerHTML = q.soalan;

            const icons = {
                "carta_nilai_tempat": "🔢",
                "kad_nombor_juta": "🏷️",
                "carta_cerakinkan_nombor": "📑",
                "carta_pola": "📈",
                "grid_pecahan": "🟧",
                "grid_perpuluhan": "🟦",
                "kad_operasi": "➕",
                "kotak_anu": "❓",
                "carta_faktor": "⭐",
                "situasi_kehidupan_sebenar": "🏫"
            };
            const diagIcon = document.getElementById('diagram-icon');
            const diagTitle = document.getElementById('diagram-title');
            if (diagIcon) diagIcon.innerText = icons[q.gambarajah] || "📊";
            if (diagTitle) diagTitle.innerText = 'Question Diagram';

            const container = document.getElementById('options-container');
            if (container) {
                container.innerHTML = "";

                if ((state.selectedGameType === 'Campuran' ? q.jenis : state.selectedGameType) === 'Isi Tempat Kosong') {
                    container.innerHTML = `
                        <div class="sm:col-span-2 space-y-3">
                            <input type="text" id="fill-blank-input" placeholder="Type your answer…" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-slate-800 text-center text-lg focus:outline-none focus:border-blue-600">
                            <button onclick="submitFillBlank()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-lg transition">
                                Check Answer ➔
                            </button>
                        </div>
                    `;
                } else {
                    q.pilihan.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = "p-4 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-2xl font-bold text-slate-800 text-left transition flex items-center justify-between group";
                        btn.innerHTML = `<span>${opt}</span> <span class="w-6 h-6 rounded-full bg-slate-200 group-hover:bg-blue-600 group-hover:text-white flex items-center justify-center text-xs transition">${String.fromCharCode(65 + idx)}</span>`;
                        btn.onclick = () => checkAnswer(opt, q.jawapan, q.penerangan);
                        container.appendChild(btn);
                    });
                }
            }

            const feedbackBox = document.getElementById('feedback-box');
            const nextBtn = document.getElementById('next-btn');
            if (feedbackBox) feedbackBox.classList.add('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');

            const timerContainer = document.getElementById('timer-container');
            const hudTimer = document.getElementById('hud-timer');
            if (state.selectedTimeMode > 0) {
                if (timerContainer) timerContainer.classList.remove('hidden');
                state.timeLeft = state.selectedTimeMode;
                if (hudTimer) hudTimer.innerText = state.timeLeft;
                if (state.timerInterval) clearInterval(state.timerInterval);
                state.timerInterval = setInterval(() => {
                    state.timeLeft--;
                    if (hudTimer) hudTimer.innerText = state.timeLeft;
                    if (state.timeLeft <= 0) {
                        clearInterval(state.timerInterval);
                        if (!state.answeredCurrent) {
                            handleTimeOut(q.jawapan, q.penerangan);
                        }
                    }
                }, 1000);
            } else {
                if (timerContainer) timerContainer.classList.add('hidden');
            }
        }

        function checkAnswer(selected, correct, explanation) {
            if (state.answeredCurrent) return;
            state.answeredCurrent = true;
            if (state.timerInterval) clearInterval(state.timerInterval);

            const normalize = value => String(value).toLowerCase().replace(/,(?=\d{3}(?:\D|$))/g, '').replace(/\s+/g, '');
            const isCorrect = normalize(selected) === normalize(correct);
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');
            const nextBtn = document.getElementById('next-btn');
            const scoreEl = document.getElementById('hud-score');

            if (feedbackBox) feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                state.correctCount++;
                state.score += 5;
                if (feedbackBox) feedbackBox.className = "p-4 rounded-2xl border bg-emerald-50 border-emerald-200 text-emerald-900";
                if (feedbackTitle) feedbackTitle.innerHTML = "🎉 CORRECT! (+5 MARKS)";
                if (feedbackDesc) feedbackDesc.innerHTML = `${explanation}`;
                try {
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                } catch(e) {}
            } else {
                state.wrongCount++;
                if (feedbackBox) feedbackBox.className = "p-4 rounded-2xl border bg-rose-50 border-rose-200 text-rose-900";
                if (feedbackTitle) feedbackTitle.innerHTML = "❌ INCORRECT ANSWER";
                if (feedbackDesc) feedbackDesc.innerHTML = `✅ <strong>Correct Answer:</strong> ${correct}<br><br>${explanation}`;
            }

            if (scoreEl) scoreEl.innerText = state.score;
            if (nextBtn) nextBtn.classList.remove('hidden');
        }

        function submitFillBlank() {
            const input = document.getElementById('fill-blank-input');
            if (!input) return;
            const q = state.activeQuestions[state.currentQuestionIndex];
            if (input.value.trim()) checkAnswer(input.value, q.jawapan, q.penerangan);
        }

        function handleTimeOut(correct, explanation) {
            if (state.answeredCurrent) return;
            state.answeredCurrent = true;
            state.wrongCount++;

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');
            const nextBtn = document.getElementById('next-btn');

            if (feedbackBox) {
                feedbackBox.classList.remove('hidden');
                feedbackBox.className = "p-4 rounded-2xl border bg-amber-50 border-amber-200 text-amber-900";
            }
            if (feedbackTitle) feedbackTitle.innerHTML = "⏱ TIME’S UP!";
            if (feedbackDesc) feedbackDesc.innerHTML = `✅ <strong>Correct Answer:</strong> ${correct}<br><br>${explanation}`;
            if (nextBtn) nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            state.currentQuestionIndex++;
            loadCurrentQuestion();
        }

        function finishGameSession() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            if (state.currentUser) {
                state.currentUser.progress.totalAnswered += 20;
                state.currentUser.progress.totalCorrect += state.correctCount;
                state.currentUser.progress.totalScore += state.score;
                state.currentUser.progress.levelsCompleted += 1;
                saveUsers();
            }
            router.navigate('summary');
        }

        function renderSummaryView() {
            const percentage = Math.round((state.correctCount / 20) * 100);
            return `
            <div class="flex-1 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-lg w-full p-8 game-card-shadow border border-slate-100 text-center">
                    <div class="w-20 h-20 bg-amber-100 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-md mb-4 floating">
                        🎉
                    </div>
                    <h2 class="text-2xl font-extrabold text-slate-900">GAME COMPLETE!</h2>
                    <p class="text-slate-500 text-sm mt-1 mb-6">Well done for completing the game.</p>

                    <div class="bg-slate-50 p-6 rounded-2xl grid grid-cols-2 gap-4 mb-6 text-left border border-slate-100">
                        <div>
                            <div class="text-xs text-slate-500 font-bold uppercase">Marks Earned</div>
                            <div class="text-2xl font-extrabold text-amber-600">${state.score} / 100</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 font-bold uppercase">Achievement</div>
                            <div class="text-2xl font-extrabold text-blue-600">${percentage}%</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 font-bold uppercase">Correct Answers</div>
                            <div class="text-xl font-extrabold text-emerald-600">${state.correctCount} / 20</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 font-bold uppercase">Incorrect Answers</div>
                            <div class="text-xl font-extrabold text-rose-600">${state.wrongCount} / 20</div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="router.navigate('difficulty')" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-lg btn-hover-effect">
                            🔄 Play This Topic Again
                        </button>
                        <button onclick="router.navigate('topics')" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg btn-hover-effect">
                            ➡️ Choose Another Topic
                        </button>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="router.navigate('progress')" class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">
                                📊 Progress
                            </button>
                            <button onclick="router.navigate('leaderboard')" class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">
                                🏆 Leaderboard
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderProgressView() {
            if (!state.currentUser) return '';
            const p = state.currentUser.progress;
            const percentage = Math.round((p.topicsCompleted / 9) * 100);
            return `
            <div class="flex-1 max-w-3xl mx-auto w-full space-y-6">
                <div class="bg-white p-6 rounded-3xl game-card-shadow border border-slate-100 flex items-center justify-between">
                    <div>
                        <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Learning Profile</span>
                        <h2 class="text-2xl font-extrabold text-slate-900 mt-1">Progress Pembelajaran: ${state.currentUser.username}</h2>
                    </div>
                    <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">← Home</button>
                </div>

                <div class="bg-white p-8 rounded-3xl game-card-shadow border border-slate-100 space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-slate-700 text-sm">TOPICS COMPLETED (${p.topicsCompleted}/9)</span>
                            <span class="font-extrabold text-blue-600">${percentage}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-blue-600 to-emerald-500 h-full rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                            <div class="text-xs font-bold text-slate-400 uppercase">QUESTIONS ANSWERED</div>
                            <div class="text-3xl font-extrabold text-slate-900 mt-1">${p.totalAnswered}</div>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                            <div class="text-xs font-bold text-slate-400 uppercase">CORRECT ANSWERS</div>
                            <div class="text-3xl font-extrabold text-emerald-600 mt-1">${p.totalCorrect}</div>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                            <div class="text-xs font-bold text-slate-400 uppercase">TOTAL MARKS</div>
                            <div class="text-3xl font-extrabold text-amber-600 mt-1">${p.totalScore}</div>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                            <div class="text-xs font-bold text-slate-400 uppercase">LEVELS COMPLETED</div>
                            <div class="text-3xl font-extrabold text-blue-600 mt-1">${p.levelsCompleted} / 27</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderLeaderboardView() {
            const sorted = [...state.usersList].sort((a,b) => b.progress.totalScore - a.progress.totalScore);
            return `
            <div class="flex-1 max-w-3xl mx-auto w-full space-y-6">
                <div class="bg-white p-6 rounded-3xl game-card-shadow border border-slate-100 flex items-center justify-between">
                    <div>
                        <span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Scoreboard</span>
                        <h2 class="text-2xl font-extrabold text-slate-900 mt-1">🏆 PUPIL LEADERBOARD</h2>
                    </div>
                    <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">← Home</button>
                </div>

                <div class="bg-white rounded-3xl game-card-shadow border border-slate-100 overflow-hidden">
                    <div class="divide-y divide-slate-100">
                        ${sorted.map((u, idx) => `
                            <div class="p-5 flex items-center justify-between ${state.currentUser && u.username === state.currentUser.username ? 'bg-blue-50/50' : ''}">
                                <div class="flex items-center space-x-4">
                                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-extrabold text-lg ${idx === 0 ? 'bg-amber-400 text-white shadow-md' : idx === 1 ? 'bg-slate-300 text-white' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-100 text-slate-600'}">
                                        ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}
                                    </div>
                                    <div>
                                        <div class="font-extrabold text-slate-900 flex items-center gap-2">
                                            <span>${u.avatar}</span>
                                            <span>${u.username}</span>
                                            ${state.currentUser && u.username === state.currentUser.username ? '<span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full font-bold">You</span>' : ''}
                                        </div>
                                        <div class="text-xs text-slate-500 mt-0.5">Levels completed: ${u.progress.levelsCompleted} | Correct: ${u.progress.totalCorrect}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xl font-extrabold text-amber-600">${u.progress.totalScore}</div>
                                    <div class="text-xs text-slate-400 font-semibold">Marks</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        }

        function renderSettingsView() {
            if (!state.currentUser) return '';
            return `
            <div class="flex-1 max-w-2xl mx-auto w-full space-y-6">
                <div class="bg-white p-6 rounded-3xl game-card-shadow border border-slate-100 flex items-center justify-between">
                    <div>
                        <span class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Settings</span>
                        <h2 class="text-2xl font-extrabold text-slate-900 mt-1">Account Settings</h2>
                    </div>
                    <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">← Home</button>
                </div>

                <div class="bg-white p-8 rounded-3xl game-card-shadow border border-slate-100 space-y-6">
                    <div>
                        <h3 class="font-bold text-slate-800 mb-3">👤 Current Account</h3>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <div class="flex items-center space-x-3">
                                <span class="text-3xl">${state.currentUser.avatar}</span>
                                <div>
                                    <div class="font-extrabold text-slate-900">${state.currentUser.username}</div>
                                    <div class="text-xs text-slate-500">Current Pupil Profile</div>
                                </div>
                            </div>
                            <button onclick="authSystem.logout()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-sm transition">
                                Switch Account
                            </button>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-6">
                        <h3 class="font-bold text-slate-800 mb-3">📱 Display Options</h3>
                        <div class="flex gap-3">
                            <button onclick="toggleOrientationView()" class="flex-1 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl text-sm transition">
                                🔄 Switch Desktop or Tablet Layout
                            </button>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-6">
                        <h3 class="font-bold text-slate-800 mb-3">🗑 Reset Progress</h3>
                        <button onclick="authSystem.resetData()" class="w-full py-3 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-sm transition">
                            Clear This Pupil’s Progress
                        </button>
                    </div>
                </div>
            </div>`;
        }

        const authSystem = {
            loginSelected() {
                const select = document.getElementById('login-user-select');
                if (!select) return;
                const uname = select.value;
                const found = state.usersList.usersList ? state.usersList.find(u => u.username === uname) : state.usersList.find(u => u.username === uname);
                if (found) {
                    state.currentUser = found;
                    router.navigate('home');
                }
            },
            registerNew() {
                const input = document.getElementById('new-username');
                if (!input) return;
                const uname = input.value.trim();
                if (!uname) {
                    showModal("Registration Error", "Enter a valid username.", "⚠️");
                    return;
                }
                if (state.usersList.some(u => u.username.toLowerCase() === uname.toLowerCase())) {
                    showModal("Username Taken", "Choose another username.", "⚠️");
                    return;
                }
                const avatars = ["👦", "👧", "🦊", "🦁", "🐼", "🐯", "🐰"];
                const newU = {
                    username: uname,
                    avatar: avatars[Math.floor(Math.random() * avatars.length)],
                    progress: { topicsCompleted: 0, totalAnswered: 0, totalCorrect: 0, totalScore: 0, levelsCompleted: 0, topicRecords: {} }
                };
                state.usersList.push(newU);
                state.currentUser = newU;
                saveUsers();
                router.navigate('home');
            },
            logout() {
                router.navigate('login');
            },
            resetData() {
                if (state.currentUser) {
                    state.currentUser.progress = { topicsCompleted: 0, totalAnswered: 0, totalCorrect: 0, totalScore: 0, levelsCompleted: 0, topicRecords: {} };
                    saveUsers();
                    router.navigate('home');
                    showModal("Done", "Progress has been reset.", "🔄");
                }
            }
        };

        function toggleOrientationView() {
            const appEl = document.getElementById('app');
            if (appEl) {
                if (appEl.classList.contains('max-w-2xl')) {
                    appEl.classList.remove('max-w-2xl');
                    appEl.classList.add('max-w-7xl');
                    showModal("Desktop Layout", "The game now uses the wide desktop layout.", "💻");
                } else {
                    appEl.classList.remove('max-w-7xl');
                    appEl.classList.add('max-w-2xl');
                    showModal("Tablet Layout", "The game now uses the compact layout.", "📱");
                }
            }
        }

        window.onload = function() {
            initAppStorage();
            if (state.currentUser) {
                router.navigate('home');
            } else {
                router.navigate('login');
            }
        };
    </script>
</body>
</html>
