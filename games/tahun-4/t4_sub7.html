<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH KIDS – EDU KIDZ | Year 4 Mathematics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-game { font-family: 'Fredoka', cursive, sans-serif; }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col select-none">

    <div id="app" class="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 md:p-6 justify-between">
        
        <header id="main-header" class="hidden bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-md mb-4 flex flex-wrap items-center justify-between gap-4 border border-indigo-100">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-blue-500 to-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg font-game text-xl">
                    🎮
                </div>
                <div>
                    <h1 class="font-game font-bold text-base md:text-lg text-indigo-900 leading-tight">MATH KIDS <span class="text-pink-500">EDU KIDZ</span></h1>
                    <p class="text-[11px] text-slate-500 font-medium">Year 4 • KSSR Mathematics</p>
                </div>
            </div>

            <!-- Player Status & Quick Navigation -->
            <div class="flex items-center gap-3 flex-wrap">
                <div id="player-badge" class="hidden bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-xl flex items-center gap-2">
                    <span id="nav-avatar" class="text-lg">👦</span>
                    <div>
                        <p id="nav-username" class="text-xs font-bold text-indigo-900 leading-none">Name</p>
                        <p class="text-[10px] text-indigo-600 font-medium">⭐ <span id="nav-score">0</span> marks</p>
                    </div>
                </div>

                <div class="flex items-center gap-1.5">
                    <button onclick="navigateTo('home')" title="Main Menu" class="p-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-xl transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <button onclick="navigateTo('topics')" title="Topik" class="p-2.5 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-xl transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-book-open"></i>
                    </button>
                    <button onclick="navigateTo('progress')" title="Progress" class="p-2.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-xl transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-chart-bar"></i>
                    </button>
                    <button onclick="navigateTo('leaderboard')" title="Leaderboard" class="p-2.5 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-xl transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-trophy"></i>
                    </button>
                    <button onclick="logoutUser()" title="Log Out" class="p-2.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main id="view-container" class="flex-1 flex flex-col justify-center">
            <!-- Dynamic Views injected via JavaScript -->
        </main>

        <footer class="mt-6 text-center text-xs text-slate-400 font-medium py-2">
            MATH KIDS – EDU KIDZ &copy; 2026 • KSSR Year 4 Mathematics Malaysia (Koordinat, Nisbah & Kadaran)
        </footer>

    </div>

    <!-- Modal Box -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-indigo-100 transform transition-all text-center">
            <div id="modal-icon" class="text-4xl mb-3">🎉</div>
            <h3 id="modal-title" class="font-game font-bold text-2xl text-slate-800 mb-2">Notice</h3>
            <p id="modal-message" class="text-slate-600 text-sm mb-6 leading-relaxed whitespace-pre-line">Message</p>
            <div id="modal-actions" class="flex gap-3 justify-center">
                <button onclick="closeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-game px-6 py-2.5 rounded-xl shadow-lg transition">OK</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let usersList = JSON.parse(localStorage.getItem('mathkids_users') || '[]');
        let currentView = 'welcome';
        let currentGameSession = {
            topicId: null,
            topicName: '',
            difficulty: null,
            timerMode: 30,
            questions: [],
            currentIndex: 0,
            score: 0,
            correctCount: 0,
            wrongCount: 0,
            timerInterval: null,
            timeLeft: 0,
            answersLog: []
        };

        let questionBank = [];

        function initQuestionBank() {
            if (questionBank.length > 0) return;

            // TOPIC 1: Reading Coordinates (60 unique questions)
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 10 ? 'Remembering' : i <= 40 ? 'Understanding' : 'Applying';
                let x = ((i * 3) % 5) + 1;
                let y = ((i * 7) % 5) + 1;
                if (x === y) y = (y % 5) + 1;

                let qText = "";
                let options = [];
                let correctAns = "";
                let explanation = "";
                let labels = ['A', 'B', 'C', 'P', 'Q', 'R', 'S', 'T'];
                let lbl = labels[i % labels.length];

                if (diff === 'Senang') {
                    qText = `Read the grid. What are the coordinates of point ${lbl}?`;
                    let wrong1 = `(${y},${x})`;
                    let wrong2 = `(${x+1 > 5 ? 1 : x+1},${y})`;
                    let wrong3 = `(${x},${y+1 > 5 ? 1 : y+1})`;
                    options = [`(${x},${y})`, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5);
                    correctAns = `(${x},${y})`;
                    explanation = `Read x first and y second. Point ${lbl} is at (${x}, ${y}).`;
                } else if (diff === 'Sederhana') {
                    qText = `The origin O is (0, 0). Read the horizontal and vertical positions of ${lbl}. What are its coordinates?`;
                    let wrong1 = `(${y},${x})`;
                    let wrong2 = `(${x > 1 ? x-1 : x+1},${y})`;
                    let wrong3 = `(${x},${y > 1 ? y-1 : y+1})`;
                    options = [`(${x},${y})`, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5);
                    correctAns = `(${x},${y})`;
                    explanation = `The x-coordinate is ${x} and the y-coordinate is ${y}. Point ${lbl} is at (${x}, ${y}).`;
                } else {
                    let moveX = (i % 2) + 1;
                    let moveY = ((i + 1) % 2) + 1;
                    qText = `Point ${lbl} starts at (${x}, ${y}). It moves ${moveX} units right and ${moveY} units up. What are its new coordinates?`;
                    let nx = x + moveX;
                    let ny = y + moveY;
                    options = [`(${nx},${ny})`, `(${x},${ny})`, `(${nx},${y})`, `(${nx+1},${ny+1})`].sort(() => Math.random() - 0.5);
                    correctAns = `(${nx},${ny})`;
                    explanation = `Add ${moveX} to x and ${moveY} to y. The new coordinates are (${nx}, ${ny}).`;
                }

                questionBank.push({
                    id: `K4-KOOR-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Reading Coordinates',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Multiple Choice',
                    question: qText,
                    visualType: 'grid',
                    visualData: { x: x, y: y, label: lbl },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: explanation
                });
            }

            // TOPIC 2: Plotting Coordinates (60 unique questions)
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 15 ? 'Remembering' : i <= 45 ? 'Understanding' : 'Applying';
                let cx = ((i * 2) % 4) + 1;
                let cy = ((i * 5) % 4) + 1;
                if (cx === cy) cy = (cy % 4) + 1;
                let labels2 = ['P', 'Q', 'R', 'S', 'T', 'K', 'L', 'M'];
                let lbl2 = labels2[i % labels2.length];
                let qText = "";
                let options = [];
                let correctAns = "";

                if (diff === 'Senang') {
                    qText = `Which option places point ${lbl2} at (${cx}, ${cy})?`;
                    options = [`Coordinates (${cx},${cy})`, `Coordinates (${cy},${cx})`, `Coordinates (${cx+1},${cy})`, `Coordinates (${cx},${cy+1})`].sort(() => Math.random() - 0.5);
                    correctAns = `Coordinates (${cx},${cy})`;
                } else if (diff === 'Sederhana') {
                    qText = `Which position on the grid matches the coordinates (${cx}, ${cy}) for point ${lbl2}?`;
                    options = [`Point ${lbl2} at (${cx},${cy})`, `Point ${lbl2} at (${cy},${cx})`, `Point ${lbl2} at (${cx+1},${cy})`, `Point ${lbl2} at (0,${cy})`].sort(() => Math.random() - 0.5);
                    correctAns = `Point ${lbl2} at (${cx},${cy})`;
                } else {
                    qText = `Point ${lbl2} is at (${cx}, ${cy}). What is the sum of its x- and y-coordinates?`;
                    let sumXY = cx + cy;
                    options = [`${sumXY}`, `${cx}`, `${cy}`, `${sumXY + 2}`].sort(() => Math.random() - 0.5);
                    correctAns = `${sumXY}`;
                }

                questionBank.push({
                    id: `K4-TANDA-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Plotting Coordinates',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Multiple Choice',
                    question: qText,
                    visualType: 'grid',
                    visualData: { x: cx, y: cy, label: lbl2 },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: `Read x first (${cx}), then y (${cy}).${diff === "Susah" ? " Their sum is " + (cx + cy) + "." : ""}`
                });
            }

            // TOPIC 3: Nisbah (60 unique questions)
            const itemsList = [
                {a: 'apples', b: 'oranges', iconA: '🍎', iconB: '🍊'},
                {a: 'books', b: 'pencils', iconA: '📚', iconB: '✏️'},
                {a: 'blue balls', b: 'red balls', iconA: '🔵', iconB: '🔴'},
                {a: 'sweets', b: 'biscuits', iconA: '🍬', iconB: '🍪'},
                {a: 'red flowers', b: 'yellow flowers', iconA: '🌸', iconB: '🌻'},
                {a: 'cars', b: 'buses', iconA: '🚗', iconB: '🚌'}
            ];
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 15 ? 'Remembering' : i <= 45 ? 'Understanding' : 'Applying';
                let item = itemsList[i % itemsList.length];
                let numA = [3, 5, 7][i % 3];
                const numB = 2;
                let qText = "";
                let options = [];
                let correctAns = `${numA} : ${numB}`;

                if (diff === 'Senang') {
                    qText = `Using the diagram, find the ratio of ${item.a} to ${item.b}.`;
                    options = [`${numA} : ${numB}`, `${numB} : ${numA}`, `${numA} : ${numA+numB}`, `${numB} : ${numA+numB}`].sort(() => Math.random() - 0.5);
                    correctAns = `${numA} : ${numB}`;
                } else if (diff === 'Sederhana') {
                    let mult = (i % 2) + 2;
                    let tA = numA * mult;
                    let tB = numB * mult;
                    qText = `There are ${tA} ${item.a} and ${tB} ${item.b}. Write the ratio of ${item.a} to ${item.b} in its simplest form.`;
                    options = [`${numA} : ${numB}`, `${numB} : ${numA}`, `${tA} : ${tB}`, `1 : 1`].sort(() => Math.random() - 0.5);
                    correctAns = `${numA} : ${numB}`;
                } else {
                    qText = `The ratio of ${item.a} to ${item.b} is ${numA}:${numB}. If there are ${numA * 2} ${item.a}, how many ${item.b} are there?`;
                    let ansB = numB * 2;
                    options = [`${ansB}`, `${numA * 2}`, `${ansB + 1}`, `${ansB - 1}`].sort(() => Math.random() - 0.5);
                    correctAns = `${ansB}`;
                }

                questionBank.push({
                    id: `K4-NISB-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Ratio',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Multiple Choice',
                    question: qText,
                    visualType: 'ratio',
                    visualData: { countA: numA, countB: numB, iconA: item.iconA, iconB: item.iconB, labelA: item.a, labelB: item.b },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: `Compare ${item.a} with ${item.b}, in that order. The answer is ${correctAns}.`
                });
            }

            // TOPIC 4: KADARAN (REFINED & FULLY UNIQUE 60 QUESTIONS: 20 Senang, 20 Sederhana, 20 Susah)
            const kadaranItems = [
                {name: 'pencils', icon: '✏️', unitName: 'batang'},
                {name: 'exercise books', icon: '📘', unitName: 'buah'},
                {name: 'bottles of mineral water', icon: '🍼', unitName: 'botol'},
                {name: 'packets of biscuits', icon: '🍪', unitName: 'peket'},
                {name: 'red apples', icon: '🍎', unitName: 'biji'},
                {name: 'red pens', icon: '✒️', unitName: 'batang'},
                {name: 'boxes of coloured pencils', icon: '🎨', unitName: 'kotak'},
                {name: 'storybooks', icon: '📚', unitName: 'naskhah'}
            ];

            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 15 ? 'Remembering' : i <= 45 ? 'Understanding' : 'Applying';
                let item = kadaranItems[i % kadaranItems.length];
                
                // Completely unique mathematical parameters to prevent any repetition
                let unitPrice = ((i * 3) % 5) + 2; // price per unit (2 to 6 RM)
                let qText = "";
                let options = [];
                let correctAns = "";
                let explanation = "";

                if (diff === 'Senang') {
                    let givenQty = ((i % 4) + 1); // 1 to 4 units
                    let targetQty = givenQty + ((i % 3) + 1); // 2 to 7 units
                    let targetPrice = unitPrice * targetQty;
                    
                    qText = `The total price for ${givenQty} ${givenQty === 1 ? item.name.replace(/s\b/, "") : item.name} is RM${unitPrice * givenQty}. How much do ${targetQty} cost at the same price per item?`;
                    
                    let w1 = `RM${targetPrice + unitPrice}`;
                    let w2 = `RM${Math.max(1, targetPrice - unitPrice)}`;
                    let w3 = `RM${targetPrice + (unitPrice * 2)}`;
                    options = [`RM${targetPrice}`, w1, w2, w3].sort(() => Math.random() - 0.5);
                    correctAns = `RM${targetPrice}`;
                    explanation = `Divide RM${unitPrice * givenQty} by ${givenQty} to get RM${unitPrice} per item. Multiply by ${targetQty} to get RM${targetPrice}.`;

                } else if (diff === 'Sederhana') {
                    let givenQty = ((i % 3) + 2); // 2, 3, 4 units
                    let givenTotal = unitPrice * givenQty;
                    let targetQty = givenQty + 3; // +3 units
                    let targetTotal = unitPrice * targetQty;

                    qText = `Mum pays RM${givenTotal} for ${givenQty} ${item.name}. Use the unitary method to find the cost of ${targetQty}.`;

                    let w1 = `RM${targetTotal + unitPrice}`;
                    let w2 = `RM${Math.abs(targetTotal - (unitPrice * 2))}`;
                    let w3 = `RM${targetTotal + 3 * unitPrice}`;
                    options = [`RM${targetTotal}`, w1, w2, w3].sort(() => Math.random() - 0.5);
                    correctAns = `RM${targetTotal}`;
                    explanation = `Divide RM${givenTotal} by ${givenQty} to get RM${unitPrice} per item. Multiply by ${targetQty} to get RM${targetTotal}.`;

                } else {
                    // Susah: Two-step proportions or inverse/complex comparisons
                    let baseQty = 4;
                    let basePrice = unitPrice * baseQty;
                    let multiFactor = ((i % 2) + 2); // 2 or 3
                    let complexQty = baseQty * multiFactor;
                    let complexPrice = basePrice * multiFactor;

                    qText = `${baseQty} ${item.name} cost RM${basePrice}. Mr Ali has RM${complexPrice + (unitPrice * multiFactor)}. How many can he buy at most?`;

                    let maxPossibleQty = complexQty + multiFactor;
                    let w1 = `${maxPossibleQty - 2}`;
                    let w2 = `${maxPossibleQty + 2}`;
                    let w3 = `${maxPossibleQty - 1}`;
                    options = [`${maxPossibleQty}`, w1, w2, w3].sort(() => Math.random() - 0.5);
                    correctAns = `${maxPossibleQty}`;
                    explanation = `Divide RM${basePrice} by ${baseQty} to get RM${unitPrice} per item. At this price Mr Ali can afford ${maxPossibleQty} items.`;
                }

                questionBank.push({
                    id: `K4-KADA-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Proportion',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Multiple Choice',
                    question: qText,
                    visualType: 'proportion',
                    visualData: { price: unitPrice, qty: 3, item: item.name, icon: item.icon },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: explanation
                });
            }

            // TOPIC 5: Problem Solving (60 unique questions)
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 10 ? 'Remembering' : i <= 40 ? 'Understanding' : 'Applying';
                let qText = "";
                let options = [];
                let correctAns = "";
                let explanation = "";

                if (diff === 'Senang') {
                    // Unique coordinate and simple everyday word problems
                    let startX = (i % 4) + 1;
                    let moveX = ((i * 2) % 3) + 2;
                    let endX = startX + moveX;
                    qText = `Siti starts at (${startX}, 3) and moves ${moveX} units right. What are her new coordinates?`;
                    correctAns = `(${endX}, 3)`;
                    let w1 = `(${startX}, ${3 + moveX})`;
                    let w2 = `(${endX - 1}, 3)`;
                    let w3 = `(${endX + 1}, 4)`;
                    options = [correctAns, w1, w2, w3].sort(() => Math.random() - 0.5);
                    explanation = `Moving right changes only x. Add ${moveX} to ${startX} to get ${endX}. The new coordinates are (${endX}, 3).`;

                } else if (diff === 'Sederhana') {
                    // Unique ratio word problems
                    let ratioA = (i % 3) + 2; // 2, 3, 4
                    let ratioB = (i % 2) + 5;
                    let multiplier = (i % 3) + 2; // 2, 3, 4
                    let totalA = ratioA * multiplier;
                    let totalB = ratioB * multiplier;

                    qText = `The ratio of red pens to blue pens in a box is ${ratioA}:${ratioB}. There are ${totalA} red pens. How many blue pens are there?`;
                    correctAns = `${totalB} pens`;
                    let w1 = `${totalA} pens`;
                    let w2 = `${totalB + ratioB} pens`;
                    let w3 = `${totalB + 2 * ratioB} pens`;
                    options = [correctAns, w1, w2, w3].sort(() => Math.random() - 0.5);
                    explanation = `Multiply both parts of the ratio by ${multiplier}. There are ${ratioB} × ${multiplier} = ${totalB} blue pens.`;

                } else {
                    // Unique complex unitary method / proportion problem
                    let unitCount = (i % 3) + 3; // 3, 4, 5
                    let unitPrice = ((i * 5) % 4) + 3; // 3, 4, 5, 6 RM per unit
                    let totalCost = unitCount * unitPrice;
                    let targetCount = unitCount + 4; // e.g. +4 units
                    let targetCost = targetCount * unitPrice;

                    qText = `${unitCount} exercise books cost RM${totalCost}. How much does Mr Ahmad pay for ${targetCount} at the same price per book?`;
                    correctAns = `RM${targetCost}`;
                    let w1 = `RM${targetCost + unitPrice}`;
                    let w2 = `RM${Math.max(5, targetCost - (unitPrice * 2))}`;
                    let w3 = `RM${targetCost + 2 * unitPrice}`;
                    options = [correctAns, w1, w2, w3].sort(() => Math.random() - 0.5);
                    explanation = `Divide RM${totalCost} by ${unitCount} to get RM${unitPrice} per book. Multiply by ${targetCount} to get RM${targetCost}.`;
                }

                questionBank.push({
                    id: `K4-PENY-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Problem Solving',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Multiple Choice',
                    question: qText,
                    visualType: 'problem',
                    visualData: { title: 'Everyday Problem Solving' },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: explanation
                });
            }
        }

        window.onload = function() {
            initQuestionBank();
            checkStoredSession();
            renderView();
        };

        function navigateTo(viewName) {
            currentView = viewName;
            renderView();
        }

        function checkStoredSession() {
            const activeUserStr = localStorage.getItem('mathkids_active_user');
            if (activeUserStr) {
                currentUser = JSON.parse(activeUserStr);
            }
        }

        function renderView() {
            const container = document.getElementById('view-container');
            const header = document.getElementById('main-header');
            const playerBadge = document.getElementById('player-badge');

            if (currentUser) {
                header.classList.remove('hidden');
                playerBadge.classList.remove('hidden');
                document.getElementById('nav-username').innerText = currentUser.username;
                document.getElementById('nav-avatar').innerText = currentUser.avatar;
                document.getElementById('nav-score').innerText = currentUser.totalScore || 0;
            } else {
                header.classList.add('hidden');
            }

            if (!currentUser && currentView !== 'register' && currentView !== 'login') {
                currentView = 'welcome';
            }

            switch(currentView) {
                case 'welcome':
                    container.innerHTML = renderWelcomeView();
                    break;
                case 'register':
                    container.innerHTML = renderRegisterView();
                    break;
                case 'login':
                    container.innerHTML = renderLoginView();
                    break;
                case 'home':
                    container.innerHTML = renderHomeView();
                    break;
                case 'topics':
                    container.innerHTML = renderTopicsView();
                    break;
                case 'difficulty':
                    container.innerHTML = renderDifficultyView();
                    break;
                case 'game':
                    container.innerHTML = renderGameView();
                    renderQuestionVisual();
                    startGameLoop();
                    break;
                case 'result':
                    container.innerHTML = renderResultView();
                    break;
                case 'progress':
                    container.innerHTML = renderProgressView();
                    break;
                case 'leaderboard':
                    container.innerHTML = renderLeaderboardView();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsView();
                    break;
                default:
                    container.innerHTML = renderWelcomeView();
            }
        }

        function renderWelcomeView() {
            return `

        function renderQuestionVisual() {
            const canvas = document.getElementById('visual-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const q = currentGameSession.questions[currentGameSession.currentIndex];
            if (!q) return;

            if (q.visualType === 'grid') {
                const originX = 40, originY = 160, step = 25;
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;

                for (let i = 0; i <= 6; i++) {
                    ctx.beginPath();
                    ctx.moveTo(originX + i * step, 20);
                    ctx.lineTo(originX + i * step, originY);
                    ctx.stroke();
                    if (i > 0) {
                        ctx.fillStyle = '#64748b';
                        ctx.font = '10px Inter';
                        ctx.fillText(i, originX + i * step - 3, originY + 12);
                    }
                }

                for (let j = 0; j <= 6; j++) {
                    ctx.beginPath();
                    ctx.moveTo(originX, originY - j * step);
                    ctx.lineTo(originX + 6 * step, originY - j * step);
                    ctx.stroke();
                    if (j > 0) {
                        ctx.fillStyle = '#64748b';
                        ctx.font = '10px Inter';
                        ctx.fillText(j, originX - 15, originY - j * step + 4);
                    }
                }

                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(originX, originY);
                ctx.lineTo(originX + 160, originY);
                ctx.moveTo(originX, originY);
                ctx.lineTo(originX, originY - 160);
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.font = 'bold 11px Fredoka';
                ctx.fillText('O (0,0)', originX - 35, originY + 12);
                ctx.fillText('x', originX + 165, originY + 4);
                ctx.fillText('y', originX - 4, originY - 165);

                const px = q.visualData.x;
                const py = q.visualData.y;
                const plotX = originX + px * step;
                const plotY = originY - py * step;

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(plotX, plotY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#1e1b4b';
                ctx.font = 'bold 12px Fredoka';
                ctx.fillText(`${q.visualData.label}(${px},${py})`, plotX + 10, plotY - 5);

            } else if (q.visualType === 'ratio') {
                const d = q.visualData;
                ctx.fillStyle = '#1e1b4b';
                ctx.font = 'bold 12px Fredoka';
                ctx.fillText(`Comparing Quantities: ${d.countA} ${d.labelA} & ${d.countB} ${d.labelB}`, 20, 30);

                let startX = 30;
                let startY = 60;
                ctx.font = '22px sans-serif';
                for (let i = 0; i < d.countA; i++) {
                    ctx.fillText(d.iconA, startX + (i * 42), startY + 28);
                }
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 11px Fredoka';
                ctx.fillText(`Number of ${d.labelA} = ${d.countA}`, startX, startY + 65);

                for (let j = 0; j < d.countB; j++) {
                    ctx.fillText(d.iconB, startX + (j * 42), startY + 110);
                }
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 11px Fredoka';
                ctx.fillText(`Number of ${d.labelB} = ${d.countB}`, startX, startY + 145);

            } else if (q.visualType === 'proportion') {
                const d = q.visualData;
                ctx.fillStyle = '#1e1b4b';
                ctx.font = 'bold 13px Fredoka';
                ctx.fillText(`The Unitary Method`, 20, 30);

                ctx.fillStyle = '#f59e0b';
                ctx.font = '36px sans-serif';
                ctx.fillText(d.icon || '📦', 40, 95);

                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 14px Fredoka';
                ctx.fillText(`Price per item = RM${d.price}`, 100, 75);
                ctx.fillStyle = '#64748b';
                ctx.font = '12px Inter';
                ctx.fillText(`Use the price per item to work out the total.`, 100, 95);

            } else {
                ctx.fillStyle = '#4f46e5';
                ctx.font = 'bold 14px Fredoka';
                ctx.fillText('🧩 Everyday Maths Problem', 30, 80);
                ctx.fillStyle = '#64748b';
                ctx.font = '12px Inter';
                ctx.fillText('Read the question and choose the correct answer.', 30, 110);
            }
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        function startGameLoop() {
            if (currentGameSession.timerInterval) clearInterval(currentGameSession.timerInterval);
            if (currentGameSession.timerMode > 0) {
                currentGameSession.timeLeft = currentGameSession.timerMode;
                currentGameSession.timerInterval = setInterval(() => {
                    currentGameSession.timeLeft--;
                    const timerEl = document.getElementById('live-timer');
                    if (timerEl) timerEl.innerText = currentGameSession.timeLeft;
                    if (currentGameSession.timeLeft <= 0) {
                        clearInterval(currentGameSession.timerInterval);
                        handleTimeOut();
                    }
                }, 1000);
            }
        }

        function handleTimeOut() {
            const q = currentGameSession.questions[currentGameSession.currentIndex];
            currentGameSession.wrongCount++;
            currentGameSession.answersLog.push({ questionId: q.id, correct: false, userAns: 'TIME’S UP', correctAns: q.correct });
            
            showModal('⏰ TIME’S UP!', `The correct answer is: ${q.correct}\n\n${q.explanation}`, '⚠️');
            setTimeout(() => { closeModal(); nextQuestion(); }, 3000);
        }

        function submitAnswer(userAns) {
            if (currentGameSession.timerInterval) clearInterval(currentGameSession.timerInterval);
            const q = currentGameSession.questions[currentGameSession.currentIndex];
            const isCorrect = (userAns === q.correct);

            if (isCorrect) {
                currentGameSession.score += 5;
                currentGameSession.correctCount++;
                currentGameSession.answersLog.push({ questionId: q.id, correct: true, userAns, correctAns: q.correct });
                showModal('🎉 WELL DONE!', `Your answer is correct!\n\n+5 marks\n\n${q.explanation}`, '✨');
            } else {
                currentGameSession.wrongCount++;
                currentGameSession.answersLog.push({ questionId: q.id, correct: false, userAns, correctAns: q.correct });
                showModal('❌ INCORRECT ANSWER', `The correct answer is: ${q.correct}\n\n${q.explanation}`, '💡');
            }

            setTimeout(() => { closeModal(); nextQuestion(); }, 2500);
        }

        function nextQuestion() {
            currentGameSession.currentIndex++;
            if (currentGameSession.currentIndex >= 20) {
                finishGameSession();
            } else {
                renderView();
                renderQuestionVisual();
                startGameLoop();
            }
        }

        function finishGameSession() {
            if (currentGameSession.timerInterval) clearInterval(currentGameSession.timerInterval);
            
            currentUser.totalScore = (currentUser.totalScore || 0) + currentGameSession.score;
            currentUser.stats.totalAnswered += 20;
            currentUser.stats.totalCorrect += currentGameSession.correctCount;
            currentUser.stats.totalWrong += currentGameSession.wrongCount;

            if (!currentUser.topicsCompleted) currentUser.topicsCompleted = {};
            currentUser.topicsCompleted[currentGameSession.topicName] = Math.min(100, (currentUser.topicsCompleted[currentGameSession.topicName] || 0) + 20);

            const idx = usersList.findIndex(u => u.playerId === currentUser.playerId);
            if (idx !== -1) {
                usersList[idx] = currentUser;
            }
            localStorage.setItem('mathkids_users', JSON.stringify(usersList));
            localStorage.setItem('mathkids_active_user', JSON.stringify(currentUser));

            navigateTo('result');
        }

        function renderResultView() {
            const accuracy = Math.round((currentGameSession.correctCount / 20) * 100);
            return `
                <div class="max-w-md mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 text-center w-full">
                    <span class="text-5xl">🏆</span>
                    <h2 class="font-game font-bold text-2xl text-indigo-900 mt-2">WELL DONE ${currentUser.username.toUpperCase()}!</h2>
                    <p class="text-xs text-slate-500 mb-5">${currentGameSession.topicName} Completed</p>

                    <div class="bg-indigo-50/70 rounded-2xl p-4 mb-5 space-y-2 text-xs md:text-sm">
                        <div class="flex justify-between font-bold">
                            <span class="text-slate-600">Total Marks:</span>
                            <span class="text-indigo-600 text-base">${currentGameSession.score} / 100</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-600">Correct Answers:</span>
                            <span class="text-emerald-600 font-bold">${currentGameSession.correctCount}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-600">Incorrect Answers:</span>
                            <span class="text-rose-600 font-bold">${currentGameSession.wrongCount}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-600">Accuracy:</span>
                            <span class="text-purple-600 font-bold">${accuracy}%</span>
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <button onclick="startQuizSession()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-game py-3 rounded-xl shadow-lg text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i> Play Again
                        </button>
                        <button onclick="navigateTo('topics')" class="w-full bg-purple-100 text-purple-800 font-game py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-book-open"></i> Choose Another Topic
                        </button>
                        <button onclick="navigateTo('leaderboard')" class="w-full bg-amber-100 text-amber-800 font-game py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trophy"></i> Leaderboard
                        </button>
                        <button onclick="navigateTo('home')" class="w-full bg-slate-100 text-slate-700 font-game py-3 rounded-xl text-xs">
                            Main Menu
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProgressView() {
            const topics = ['Reading Coordinates', 'Plotting Coordinates', 'Ratio', 'Proportion', 'Problem Solving'];
            const stats = currentUser.stats || { totalAnswered: 0, totalCorrect: 0, totalWrong: 0 };
            const accuracy = stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0;

            return `
                <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 w-full">
                    <div class="flex items-center justify-between mb-5">
                        <div>
                            <h2 class="font-game font-bold text-xl md:text-2xl text-indigo-900">📊 MY PROGRESS</h2>
                            <p class="text-xs text-slate-500">${currentUser.username}’s Statistics</p>
                        </div>
                        <button onclick="navigateTo('home')" class="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-xl">Menu</button>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-5">
                        <div class="bg-indigo-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-indigo-600 font-bold">Marks</p>
                            <p class="font-game font-bold text-xl text-indigo-900 mt-1">${currentUser.totalScore || 0}</p>
                        </div>
                        <div class="bg-emerald-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-emerald-600 font-bold">Correct</p>
                            <p class="font-game font-bold text-xl text-emerald-900 mt-1">${stats.totalCorrect}</p>
                        </div>
                        <div class="bg-rose-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-rose-600 font-bold">Incorrect</p>
                            <p class="font-game font-bold text-xl text-rose-900 mt-1">${stats.totalWrong}</p>
                        </div>
                        <div class="bg-purple-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-purple-600 font-bold">Accuracy</p>
                            <p class="font-game font-bold text-xl text-purple-900 mt-1">${accuracy}%</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-game font-bold text-slate-800 text-xs uppercase">Progress by Topic</h3>
                        ${topics.map(t => {
                            const pct = currentUser.topicsCompleted?.[t] || 0;
                            return `
                                <div>
                                    <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                                        <span>${t}</span>
                                        <span>${pct}% Complete</span>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                        <div class="bg-gradient-to-r from-indigo-500 to-pink-500 h-2.5 rounded-full" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderLeaderboardView() {
            const sortedUsers = [...usersList].sort((a,b) => (b.totalScore || 0) - (a.totalScore || 0));

            return `
                <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 w-full">
                    <div class="flex items-center justify-between mb-5">
                        <div>
                            <h2 class="font-game font-bold text-xl md:text-2xl text-indigo-900">🏆 LEADERBOARD</h2>
                            <p class="text-xs text-slate-500">Top Players</p>
                        </div>
                        <button onclick="navigateTo('home')" class="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-xl">Menu</button>
                    </div>

                    <div class="space-y-2.5">
                        ${sortedUsers.length === 0 ? `<p class="text-center text-slate-400 text-xs py-8">There are no registered players yet.</p>` : ''}
                        ${sortedUsers.map((u, idx) => `
                            <div class="flex items-center justify-between p-3.5 rounded-2xl ${idx === 0 ? 'bg-amber-50 border-2 border-amber-300' : idx === 1 ? 'bg-slate-100' : 'bg-white border border-slate-100'}">
                                <div class="flex items-center gap-3">
                                    <span class="font-game font-bold text-base w-5 text-center ${idx === 0 ? 'text-amber-500' : idx === 1 ? 'text-slate-500' : 'text-slate-400'}">${idx + 1}</span>
                                    <span class="text-xl">${u.avatar}</span>
                                    <div>
                                        <p class="font-game font-bold text-slate-800 text-xs">${u.username}</p>
                                        <p class="text-[10px] text-slate-400">ID: ${u.playerId}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="font-game font-bold text-indigo-600 text-sm">${u.totalScore || 0} marks</p>
                                    <p class="text-[10px] text-slate-400">Accuracy: ${u.stats && u.stats.totalAnswered > 0 ? Math.round((u.stats.totalCorrect / u.stats.totalAnswered) * 100) : 0}%</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSettingsView() {
            return `
                <div class="max-w-md mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 w-full">
                    <div class="text-center mb-5">
                        <span class="text-3xl">⚙️</span>
                        <h2 class="font-game font-bold text-2xl text-indigo-900 mt-1">Account Settings</h2>
                        <p class="text-xs text-slate-500">Manage your player profile</p>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-indigo-50 p-4 rounded-2xl flex items-center gap-3">
                            <span class="text-2xl">${currentUser.avatar}</span>
                            <div>
                                <p class="font-game font-bold text-indigo-900 text-xs">${currentUser.username}</p>
                                <p class="text-[11px] text-indigo-600">ID: ${currentUser.playerId}</p>
                            </div>
                        </div>

                        <button onclick="logoutUser()" class="w-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-game py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-right-from-bracket"></i> Log Out
                        </button>
                        <button onclick="navigateTo('home')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-game py-3 rounded-xl text-xs">
                            Back to the Main Menu
                        </button>
                    </div>
                </div>
            `;
        }

        function showModal(title, message, icon = '🎉') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
