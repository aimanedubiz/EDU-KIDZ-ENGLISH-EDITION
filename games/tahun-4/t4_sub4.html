    <script>
        // --- Web Audio API Sound Synthesizer ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    osc.frequency.setValueAtTime(1046.50, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) { console.error("Audio error:", e); }
        }

        // --- Helper Function for Time String Formatting ---
        function formatTimeStr(h, m, isSec = false) {
            if (isSec) {
                if (h > 0 && m > 0) return `${h} minutes ${m} seconds`;
                if (h > 0) return `${h} minutes`;
                return `${m} seconds`;
            } else {
                if (h > 0 && m > 0) return `${h} hours ${m} minutes`;
                if (h > 0) return `${h} hours`;
                return `${m} minutes`;
            }
        }

        function formatClock12(hour, minute) {
            return `${hour % 12 || 12}:${String(minute).padStart(2, '0')} ${hour < 12 ? 'am' : 'pm'}`;
        }

        const difficultyLabels = { senang: 'Easy', sederhana: 'Medium', susah: 'Hard' };

        // --- Application State & Curriculum Data ---
        let appState = {
            currentScreen: 'auth',
            currentUser: null,
            profiles: JSON.parse(localStorage.getItem('edu_kidz_profiles')) || [
                { id: '1', name: 'Amirul', avatar: '👦', score: 120, completedTopics: [], answeredQuestionIds: [], badges: ['master-masa'], history: [] },
                { id: '2', name: 'Siti Sarah', avatar: '👧', score: 180, completedTopics: [], answeredQuestionIds: [], badges: ['master-masa', 'pakar-12-24'], history: [] }
            ],
            selectedTopic: 1,
            selectedGameMode: 'objektif',
            selectedDifficulty: 'senang',
            selectedTimer: 30,
            currentQuestions: [],
            currentQuestionIndex: 0,
            sessionScore: 0,
            sessionCorrect: 0,
            sessionWrong: 0,
            sessionStartTime: null,
            timerInterval: null,
            timeLeft: 0
        };

        const AVATARS = ['👦', '👧', '🤖', '🐱', '🐶', '🦊', '🐼', '🦁', '🚀', '⭐'];

        const TOPICS_DATA = [
            { id: 1, title: '12-Hour and 24-Hour Time', icon: 'fa-solid fa-clock', desc: 'Read and convert between 12-hour and 24-hour times.' },
            { id: 2, title: 'Duration', icon: 'fa-solid fa-hourglass-half', desc: 'Find start times, finish times and durations.' },
            { id: 3, title: 'Estimating Time and Relating Units', icon: 'fa-solid fa-calendar-days', desc: 'Explore units of time and estimate durations.' },
            { id: 4, title: 'Converting Units of Time', icon: 'fa-solid fa-arrows-rotate', desc: 'Convert between units of time.' },
            { id: 5, title: 'Adding Time', icon: 'fa-solid fa-plus', desc: 'Add durations and regroup when needed.' },
            { id: 6, title: 'Subtracting Time', icon: 'fa-solid fa-minus', desc: 'Subtract durations and regroup when needed.' },
            { id: 7, title: 'Multiplying Time', icon: 'fa-solid fa-xmark', desc: 'Multiply durations by whole numbers.' },
            { id: 8, title: 'Dividing Time', icon: 'fa-solid fa-divide', desc: 'Divide durations into equal parts.' },
            { id: 9, title: 'Problem Solving', icon: 'fa-solid fa-puzzle-piece', desc: 'Solve everyday problems involving time and money.' }
        ];

        // --- Question Bank Generator ---
        function generateQuestionBank() {
            const bank = {};
            TOPICS_DATA.forEach(topic => {
                bank[topic.id] = { senang: [], sederhana: [], susah: [] };
                ['senang', 'sederhana', 'susah'].forEach(diff => {
                    for (let i = 1; i <= 20; i++) {
                        let qObj = buildQuestion(topic.id, diff, i);
                        const singular = text => text.replace(/\b1 (hours|minutes|seconds|days|weeks|months|years|centuries|millennia)\b/g, (_, unit) =>
                            unit === 'centuries' ? '1 century' : unit === 'millennia' ? '1 millennium' : '1 ' + unit.slice(0, -1));
                        qObj.question = singular(qObj.question);
                        qObj.explanation = singular(qObj.explanation);
                        qObj.correct = singular(qObj.correct);
                        qObj.options = qObj.options.map(singular);
                        bank[topic.id][diff].push(qObj);
                    }
                });
            });
            return bank;
        }

        function buildQuestion(topicId, diff, index) {
            let id = `T${topicId}-${diff.toUpperCase()}-${index < 10 ? '0' + index : index}`;
            let modes = ['objektif', 'isikosong', 'padanan', 'dragdrop'];
            let mode = modes[(index - 1) % modes.length];
            
            if (topicId === 1) {
                if (diff === 'senang') {
                    if (index <= 10) {
                        let hours = ((index - 1) % 11) + 1;
                        let isPM = index % 2 === 0;
                        let h24 = isPM ? (hours === 12 ? 12 : hours + 12) : (hours === 12 ? 0 : hours);
                        let h24Str = String(h24).padStart(2, '0') + ":" + (index % 2 === 0 ? "15" : "00");
                        const ans12 = formatClock12(h24, index % 2 === 0 ? 15 : 0);

                        let wrong1 = `${(hours%12)+1}:00 ${isPM ? 'am' : 'pm'}`;
                        let wrong2 = `${hours}:45 ${isPM ? 'am' : 'pm'}`;
                        let wrong3 = `${Math.max(1, hours-1)}:30 ${isPM ? 'pm' : 'am'}`;

                        return {
                            id, topic: topicId, diff, aras: 'Remembering', mode: 'objektif',
                            question: `Convert this 24-hour time to the 12-hour format: ${h24Str}.`,
                            options: [ans12, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                            correct: ans12,
                            explanation: `The 12-hour equivalent of ${h24Str} is ${ans12}.`
                        };
                    } else {
                        let hours12 = ((index - 11) % 11) + 1;
                        let isPM = index % 2 !== 0;
                        let h24 = isPM ? (hours12 === 12 ? 12 : hours12 + 12) : (hours12 === 12 ? 0 : hours12);
                        let h24Correct = `${String(h24).padStart(2,'0')}:30`;
                        return {
                            id, topic: topicId, diff, aras: 'Remembering', mode: 'isikosong',
                            question: `Write ${hours12}:30 ${isPM ? 'pm' : 'am'} in the 24-hour format (HH:MM).`,
                            options: [],
                            correct: h24Correct,
                            explanation: `The 24-hour equivalent is ${h24Correct}.`
                        };
                    }
                } else if (diff === 'sederhana') {
                    let min = (index * 5) % 60;
                    let h24 = 10 + (index % 12);
                    let h12Val = h24 > 12 ? h24 - 12 : h24;
                    const timeOfDay = h24 < 12 ? 'am' : 'pm';

                    return {
                        id, topic: topicId, diff, aras: 'Understanding', mode: 'objektif',
                        question: `An express bus leaves at ${String(h24).padStart(2,'0')}:${String(min).padStart(2,'0')}. What time is this in the 12-hour format?`,
                        options: [
                            `${h12Val}:${String(min).padStart(2,'0')} ${timeOfDay}`,
                            `${h12Val === 12 ? 1 : h12Val + 1}:${String(min).padStart(2,'0')} ${timeOfDay}`,
                            `${h12Val}:${String((min+15)%60).padStart(2,'0')} ${timeOfDay}`,
                            `${h12Val > 1 ? h12Val - 1 : 12}:${String(min).padStart(2,'0')} am`
                        ].sort(() => Math.random() - 0.5),
                        correct: `${h12Val}:${String(min).padStart(2,'0')} ${timeOfDay}`,
                        explanation: `The 12-hour equivalent of ${h24}:${String(min).padStart(2,'0')} is ${h12Val}:${String(min).padStart(2,'0')} ${timeOfDay}.`
                    };
                } else {
                    let flightNo = 200 + index;
                    let totalMin = index * 5;
                    let extraH = Math.floor(totalMin / 60);
                    let m = totalMin % 60;
                    let h12 = 6 + extraH;
                    let h24 = 18 + extraH;
                    return {
                        id, topic: topicId, diff, aras: 'Applying', mode: 'objektif',
                        question: `Flight MH${flightNo} departs at ${h12}:${String(m).padStart(2,'0')} pm. What is the departure time in the 24-hour format?`,
                        options: [
                            `${h24}:${String(m).padStart(2,'0')}`,
                            `${h24 === 23 ? 0 : h24 + 1}:${String(m).padStart(2,'0')}`,
                            `${h24}:${String((m+15)%60).padStart(2,'0')}`,
                            `${h24 > 0 ? h24 - 1 : 23}:${String(m).padStart(2,'0')}`
                        ].sort(() => Math.random() - 0.5),
                        correct: `${h24}:${String(m).padStart(2,'0')}`,
                        explanation: `Add 12 to the hour: ${h12}:${String(m).padStart(2,'0')} pm becomes ${h24}:${String(m).padStart(2,'0')}.`
                    };
                }
            } else if (topicId === 2) {
                let startH = 8, startM = 10, durationM = index * 10;
                let endMTotal = startM + durationM;
                let endH = startH + Math.floor(endMTotal / 60);
                let endM = endMTotal % 60;
                return {
                    id, topic: topicId, diff, aras: 'Applying', mode: 'objektif',
                    question: `An activity starts at 8:10 am and finishes at ${endH}:${String(endM).padStart(2,'0')} am. How long does it last?`,
                    options: [`${durationM} minutes`, `${durationM + 15} minutes`, `${durationM - 10} minutes`, `${durationM + 30} minutes`],
                    correct: `${durationM} minutes`,
                    explanation: `The elapsed time from 8:10 am to ${endH}:${String(endM).padStart(2,'0')} am is ${durationM} minutes.`
                };
            } else if (topicId === 3) {
                let subType = index % 5;
                if (subType === 0) {
                    let centuries = ((index - 1) % 5) + 1;
                    let years = centuries * 100;
                    return {
                        id, topic: topicId, diff, aras: 'Understanding', mode: 'objektif',
                        question: `How many years are there in ${centuries} centuries?`,
                        options: [`${years} years`, `${years + 50} years`, `${years / 2} years`, `${years + 100} years`].sort(() => Math.random() - 0.5),
                        correct: `${years} years`,
                        explanation: `One century is 100 years. ${centuries} × 100 = ${years} years.`
                    };
                } else if (subType === 1) {
                    let alaf = 1;
                    let abadVal = alaf * 10;
                    return {
                        id, topic: topicId, diff, aras: 'Understanding', mode: 'objektif',
                        question: `How many centuries are there in ${alaf} millennia?`,
                        options: [`${abadVal} centuries`, `${abadVal + 5} centuries`, `${abadVal * 2} centuries`, `${abadVal - 2} centuries`].sort(() => Math.random() - 0.5),
                        correct: `${abadVal} centuries`,
                        explanation: `One millennium is 10 centuries or 1,000 years.`
                    };
                } else if (subType === 2) {
                    let tahunVal = ((index - 1) % 4) + 1;
                    let bulanVal = tahunVal * 12;
                    return {
                        id, topic: topicId, diff, aras: 'Understanding', mode: 'objektif',
                        question: `How many months are there in ${tahunVal} years?`,
                        options: [`${bulanVal} months`, `${bulanVal + 6} months`, `${bulanVal - 3} months`, `${bulanVal + 12} months`].sort(() => Math.random() - 0.5),
                        correct: `${bulanVal} months`,
                        explanation: `One year is 12 months. ${tahunVal} × 12 = ${bulanVal} months.`
                    };
                } else if (subType === 3) {
                    let mingguVal = ((index - 1) % 4) + 2;
                    let hariVal = mingguVal * 7;
                    return {
                        id, topic: topicId, diff, aras: 'Understanding', mode: 'objektif',
                        question: `How many days are there in ${mingguVal} weeks?`,
                        options: [`${hariVal} days`, `${hariVal + 2} days`, `${hariVal - 1} days`, `${hariVal + 7} days`].sort(() => Math.random() - 0.5),
                        correct: `${hariVal} days`,
                        explanation: `One week is 7 days. ${mingguVal} × 7 = ${hariVal} days.`
                    };
                } else {
                    return {
                        id, topic: topicId, diff, aras: 'Applying', mode: 'objektif',
                        question: `Which is the most reasonable estimate for the time it takes to bake a cake?`,
                        options: [`45 minutes`, `45 seconds`, `45 hours`, `45 days`].sort(() => Math.random() - 0.5),
                        correct: `45 minutes`,
                        explanation: `About 45 minutes is a reasonable estimate for baking a cake.`
                    };
                }
            } else if (topicId === 4) {
                let hours = (index % 5) + 1;
                let minutes = hours * 60;
                return {
                    id, topic: topicId, diff, aras: 'Remembering', mode: 'isikosong',
                    question: `${hours} hours = _____ minutes`,
                    options: [],
                    correct: `${minutes}`,
                    explanation: `One hour is 60 minutes. ${hours} × 60 = ${minutes} minutes.`
                };
            } else if (topicId === 5) {
                let h1 = 1, m1 = 15, h2 = 2, m2 = (index * 5) % 55;
                let totalM = m1 + m2;
                let extraH = Math.floor(totalM / 60);
                let finalM = totalM % 60;
                let finalH = h1 + h2 + extraH;
                return {
                    id, topic: topicId, diff, aras: 'Understanding', mode: 'objektif',
                    question: `Work out: ${h1} hours ${m1} minutes + ${h2} hours ${m2} minutes.`,
                    options: [`${finalH} hours ${finalM} minutes`, `${finalH + 1} hours ${finalM} minutes`, `${finalH} hours ${finalM + 10} minutes`, `${finalH - 1} hours ${finalM} minutes`],
                    correct: `${finalH} hours ${finalM} minutes`,
                    explanation: `Add the hours and minutes and regroup if needed. The total is ${formatTimeStr(finalH, finalM)}.`
                };
            } else if (topicId === 6) {
                let h1, m1, h2, m2;
                if (index % 3 === 0) {
                    h1 = 5 + (index % 4);
                    m1 = 35 + (index % 20);
                    h2 = 1 + (index % 3);
                    m2 = 10 + (index % 15);
                    if (m1 < m2) { let t = m1; m1 = m2; m2 = t; }
                } else if (index % 3 === 1) {
                    h1 = 4 + (index % 3);
                    m1 = 10 + (index % 15);
                    h2 = 1 + (index % 2);
                    m2 = 35 + (index % 20);
                } else {
                    h1 = 6 + (index % 3);
                    m1 = 50;
                    h2 = 2 + (index % 2);
                    m2 = 25;
                }

                let totalMin1 = h1 * 60 + m1;
                let totalMin2 = h2 * 60 + m2;
                if (totalMin2 > totalMin1) {
                    let tempH = h1; h1 = h2 + 3; h2 = tempH;
                }

                let diffMinTotal = (h1 * 60 + m1) - (h2 * 60 + m2);
                let resH = Math.floor(diffMinTotal / 60);
                let resM = diffMinTotal % 60;
                let correctAns = resM > 0 ? `${resH} hours ${resM} minutes` : `${resH} hours`;

                let wrong1 = `${resH + 1} hours ${resM} minutes`;
                let wrong2 = `${resH} hours ${resM > 15 ? resM - 15 : resM + 15} minutes`;
                let wrong3 = `${resH > 0 ? resH - 1 : 0} hours ${resM} minutes`;

                return {
                    id, topic: topicId, diff, aras: m1 < m2 ? 'Understanding' : 'Remembering', mode: 'objektif',
                    question: `Work out: ${h1} hours ${m1} minutes − ${h2} hours ${m2} minutes.`,
                    options: [correctAns, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                    correct: correctAns,
                    explanation: m1 < m2 ? `Since ${m1} minutes is less than ${m2} minutes, exchange one hour for 60 minutes. The difference is ${correctAns}.` : `Subtract the hours and minutes separately to get ${correctAns}.`
                };
            } else if (topicId === 7) {
                // --- TOPIC 7: DARAB MASA ---
                let h, m, s, multiplier, totalMin, resH, resM, ansStr, qText, expl, wrong1, wrong2, wrong3;
                
                if (diff === 'senang') {
                    h = (index % 3) + 1;
                    m = ((index * 7) % 50) + 5;
                    multiplier = (index % 3) + 2;
                    totalMin = (h * 60 + m) * multiplier;
                    resH = Math.floor(totalMin / 60);
                    resM = totalMin % 60;
                    ansStr = formatTimeStr(resH, resM);
                    qText = `Work out: ${h} hours ${m} minutes × ${multiplier}.`;
                    expl = `Multiply the hours and minutes by ${multiplier} and regroup. The result is ${ansStr}.`;
                    wrong1 = `${resH + 1} hours ${resM} minutes`;
                    wrong2 = `${resH} hours ${resM > 10 ? resM - 10 : resM + 15} minutes`;
                    wrong3 = `${resH > 0 ? resH - 1 : resH + 2} hours ${resM} minutes`;
                } else if (diff === 'sederhana') {
                    let isSec = index % 2 === 0;
                    if (isSec) {
                        m = (index % 4) + 1;
                        s = ((index * 9) % 45) + 5;
                        multiplier = (index % 4) + 3;
                        let totalSec = (m * 60 + s) * multiplier;
                        let resMin = Math.floor(totalSec / 60);
                        let resSec = totalSec % 60;
                        ansStr = formatTimeStr(resMin, resSec, true);
                        qText = `Work out: ${m} minutes ${s} seconds × ${multiplier}.`;
                        expl = `Multiply the minutes and seconds by ${multiplier} and regroup to get ${ansStr}.`;
                        wrong1 = `${resMin + 1} minutes ${resSec} seconds`;
                        wrong2 = `${resMin} minutes ${resSec > 15 ? resSec - 15 : resSec + 15} seconds`;
                        wrong3 = `${resMin > 0 ? resMin - 1 : resMin + 2} minutes ${resSec} seconds`;
                    } else {
                        h = (index % 4) + 2;
                        m = ((index * 11) % 40) + 10;
                        multiplier = (index % 3) + 3;
                        totalMin = (h * 60 + m) * multiplier;
                        resH = Math.floor(totalMin / 60);
                        resM = totalMin % 60;
                        ansStr = formatTimeStr(resH, resM);
                        qText = `Multiply: ${h} hours ${m} minutes × ${multiplier}.`;
                        expl = `Multiply the duration by ${multiplier} to get ${ansStr}.`;
                        wrong1 = `${resH + 1} hours ${resM} minutes`;
                        wrong2 = `${resH} hours ${resM > 20 ? resM - 20 : resM + 20} minutes`;
                        wrong3 = `${resH > 0 ? resH - 1 : resH + 2} hours ${resM} minutes`;
                    }
                } else {
                    let activityName = ['robotics', 'art', 'football training', 'maths revision', 'transport training', 'science', 'aerobics'][index % 7];
                    h = (index % 3) + 1;
                    m = ((index * 13) % 45) + 5;
                    multiplier = (index % 4) + 6;
                    totalMin = (h * 60 + m) * multiplier;
                    resH = Math.floor(totalMin / 60);
                    resM = totalMin % 60;
                    ansStr = formatTimeStr(resH, resM);
                    qText = `Each ${activityName} session lasts ${h} hours ${m} minutes. How long do ${multiplier} sessions take in total?`;
                    expl = `Multiply the time for one session by ${multiplier}. The total is ${ansStr}.`;
                    wrong1 = `${resH + 1} hours ${resM} minutes`;
                    wrong2 = `${resH} hours ${resM > 15 ? resM - 15 : resM + 15} minutes`;
                    wrong3 = `${resH > 0 ? resH - 1 : resH + 2} hours ${resM} minutes`;
                }

                return {
                    id, topic: topicId, diff, aras: diff === 'senang' ? 'Remembering' : (diff === 'sederhana' ? 'Understanding' : 'Applying'), mode: 'objektif',
                    question: qText,
                    options: [ansStr, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                    correct: ansStr,
                    explanation: expl
                };
            } else if (topicId === 8) {
                // --- REFINED TOPIC 8: BAHAGI MASA (Diverse, non-repeating questions across all 20 indices) ---
                let h, m, s, divisor, totalMin, resH, resM, ansStr, qText, expl, wrong1, wrong2, wrong3;

                if (diff === 'senang') {
                    // Senang: Clean hours & minutes division by 2 or 3
                    let hoursInput = (index % 3) + 2; // 2, 3, 4
                    let minInput = ((index * 10) % 50); // 0, 10, 20...
                    divisor = (index % 2 === 0) ? 2 : 3;
                    
                    let totalMInput = hoursInput * 60 + minInput;
                    totalMInput = Math.ceil(totalMInput / divisor) * divisor; // ensure clean division
                    let resTotalM = Math.floor(totalMInput / divisor);
                    resH = Math.floor(resTotalM / 60);
                    resM = resTotalM % 60;
                    let origH = Math.floor(totalMInput / 60);
                    let origM = totalMInput % 60;
                    
                    ansStr = formatTimeStr(resH, resM);
                    qText = `Work out: ${formatTimeStr(origH, origM)} ÷ ${divisor}.`;
                    expl = `Divide ${formatTimeStr(origH, origM)} by ${divisor} to get ${ansStr}.`;
                    
                    wrong1 = `${resH + 1} hours ${resM} minutes`;
                    wrong2 = `${resH} hours ${resM > 10 ? resM - 10 : resM + 15} minutes`;
                    wrong3 = `${resH > 0 ? resH - 1 : resH + 2} hours ${resM} minutes`;
                } else if (diff === 'sederhana') {
                    // Sederhana: Minutes and seconds division with remainder conversion
                    let minInput = (index % 4) + 2; // 2 to 5 minutes
                    let secInput = ((index * 7) % 45) + 10;
                    divisor = (index % 3) + 2; // 2, 3, 4
                    
                    let totalSec = minInput * 60 + secInput;
                    totalSec = Math.ceil(totalSec / divisor) * divisor;
                    let resTotalSec = Math.floor(totalSec / divisor);
                    let resMin = Math.floor(resTotalSec / 60);
                    let resSec = resTotalSec % 60;
                    let origMin = Math.floor(totalSec / 60);
                    let origSec = totalSec % 60;
                    
                    ansStr = formatTimeStr(resMin, resSec, true);
                    qText = `Work out: ${formatTimeStr(origMin, origSec, true)} ÷ ${divisor}.`;
                    expl = `Divide ${formatTimeStr(origMin, origSec, true)} by ${divisor} to get ${ansStr}.`;
                    
                    wrong1 = `${resMin + 1} minutes ${resSec} seconds`;
                    wrong2 = `${resMin} minutes ${resSec > 15 ? resSec - 15 : resSec + 15} seconds`;
                    wrong3 = `${resMin > 0 ? resMin - 1 : resMin + 2} minutes ${resSec} seconds`;
                } else {
                    // Susah: Word problems / Situasi harian division
                    let scenario = ['mentoring', 'science project', 'sports day', 'skills training', 'group revision', 'design workshop'][index % 6];
                    let totalH = (index % 3) + 2; // 2, 3, 4 hours
                    let totalM = ((index * 11) % 40) + 10;
                    divisor = (index % 3) + 2; // 2, 3, 4 equal sessions
                    
                    let totalMins = totalH * 60 + totalM;
                    totalMins = Math.ceil(totalMins / divisor) * divisor;
                    let resTotalMins = Math.floor(totalMins / divisor);
                    resH = Math.floor(resTotalMins / 60);
                    resM = resTotalMins % 60;
                    let origH = Math.floor(totalMins / 60);
                    let origM = totalMins % 60;
                    
                    ansStr = formatTimeStr(resH, resM);
                    qText = `A total of ${formatTimeStr(origH, origM)} is shared equally across ${divisor} ${scenario} sessions. How long is each session?`;
                    expl = `Divide the total time by ${divisor}. Each session lasts ${ansStr}.`;
                    
                    wrong1 = `${resH + 1} hours ${resM} minutes`;
                    wrong2 = `${resH} hours ${resM > 15 ? resM - 15 : resM + 15} minutes`;
                    wrong3 = `${resH > 0 ? resH - 1 : resH + 2} hours ${resM} minutes`;
                }

                return {
                    id, topic: topicId, diff, aras: diff === 'senang' ? 'Remembering' : (diff === 'sederhana' ? 'Understanding' : 'Applying'), mode: 'objektif',
                    question: qText,
                    options: [ansStr, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                    correct: ansStr,
                    explanation: expl
                };
            } else {
                // --- REFINED TOPIC 9: PENYELESAIAN MASALAH (Diverse & Non-repeating) ---
                let qText, correctAns, expl, wrong1, wrong2, wrong3;
                let subType = index % 5;
                
                if (subType === 0) {
                    let startH = 8 + (index % 3);
                    let startM = (index * 10) % 50;
                    let durationM = 45 + (index * 5);
                    let totalM = startM + durationM;
                    let endH = startH + Math.floor(totalM / 60);
                    let endM = totalM % 60;
                    correctAns = formatClock12(endH, endM);
                    qText = `A class revision session starts at ${formatClock12(startH, startM)} and lasts ${durationM} minutes. What time does it finish?`;
                    expl = `Add ${durationM} minutes to the start time to get ${correctAns}.`;
                    wrong1 = formatClock12(endH + 1, endM);
                    wrong2 = formatClock12(endH, (endM + 15) % 60);
                    wrong3 = formatClock12(endH - 1, endM);
                } else if (subType === 1) {
                    let hours = 1 + (index % 3);
                    let mins = 15 + ((index * 5) % 35);
                    let multiplier = 2 + (index % 3);
                    let totalMins = (hours * 60 + mins) * multiplier;
                    let resH = Math.floor(totalMins / 60);
                    let resM = totalMins % 60;
                    correctAns = formatTimeStr(resH, resM);
                    qText = `Each football training session lasts ${formatTimeStr(hours, mins)}. How long do ${multiplier} sessions take altogether?`;
                    expl = `Multiply the time for one session by ${multiplier}. The total is ${correctAns}.`;
                    wrong1 = formatTimeStr(resH + 1, resM);
                    wrong2 = formatTimeStr(resH, resM > 15 ? resM - 15 : resM + 15);
                    wrong3 = formatTimeStr(resH > 0 ? resH - 1 : resH + 2, resM);
                } else if (subType === 2) {
                    let totalH = 2 + (index % 2);
                    let totalM = 30 + ((index * 10) % 25);
                    let divisor = 2 + (index % 2);
                    let totalMins = totalH * 60 + totalM;
                    totalMins = Math.ceil(totalMins / divisor) * divisor;
                    let resTotalM = Math.floor(totalMins / divisor);
                    let resH = Math.floor(resTotalM / 60);
                    let resM = resTotalM % 60;
                    let origH = Math.floor(totalMins / 60);
                    let origM = totalMins % 60;
                    correctAns = formatTimeStr(resH, resM);
                    qText = `A total of ${formatTimeStr(origH, origM)} is shared equally across ${divisor} design workshops. How long is each workshop?`;
                    expl = `Divide the total duration by ${divisor}. Each workshop lasts ${correctAns}.`;
                    wrong1 = formatTimeStr(resH + 1, resM);
                    wrong2 = formatTimeStr(resH, resM > 10 ? resM - 10 : resM + 15);
                    wrong3 = formatTimeStr(resH > 0 ? resH - 1 : resH + 2, resM);
                } else if (subType === 3) {
                    let price1 = 30 + (index * 5);
                    let price2 = 15 + (index * 2);
                    let totalRM = price1 + price2;
                    let duration = 30 + (index * 10);
                    qText = `Mum buys a maths reference book for RM${price1}.00 and stationery for RM${price2}.00. Her visit to the shop takes ${duration} minutes. How much does she spend altogether?`;
                    correctAns = `RM${totalRM}.00`;
                    expl = `Add RM${price1}.00 and RM${price2}.00 to get RM${totalRM}.00.`;
                    wrong1 = `RM${totalRM + 10}.00`;
                    wrong2 = `RM${Math.max(10, totalRM - 10)}.00`;
                    wrong3 = `RM${totalRM + 20}.00`;
                } else {
                    let h1 = 1 + (index % 2);
                    let m1 = 20 + (index % 20);
                    let h2 = 1 + ((index + 1) % 2);
                    let m2 = 30 + ((index * 3) % 25);
                    let totalM = m1 + m2;
                    let extraH = Math.floor(totalM / 60);
                    let finalM = totalM % 60;
                    let finalH = h1 + h2 + extraH;
                    correctAns = formatTimeStr(finalH, finalM);
                    qText = `Amirul spends ${formatTimeStr(h1, m1)} revising and ${formatTimeStr(h2, m2)} doing homework. How much time does he spend altogether?`;
                    expl = `Add the time spent revising and doing homework to get ${correctAns}.`;
                    wrong1 = formatTimeStr(finalH + 1, finalM);
                    wrong2 = formatTimeStr(finalH, finalM > 15 ? finalM - 15 : finalM + 15);
                    wrong3 = formatTimeStr(finalH > 0 ? finalH - 1 : finalH + 2, finalM);
                }

                return {
                    id, topic: topicId, diff, aras: 'Applying', mode: 'objektif',
                    question: qText,
                    options: [correctAns, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                    correct: correctAns,
                    explanation: expl
                };
            }
        }

                    <button onclick="setScreen('difficulty')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Back
                    </button>
                    <h2 class="text-xl sm:text-2xl font-extrabold text-slate-800">Choose a Time Limit</h2>
                    <div class="w-20"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    ${timers.map(t => `
                        <div onclick="startGameSession(${t.seconds})" class="bouncy-btn bg-white border-2 border-slate-100 hover:border-emerald-500 p-6 rounded-2xl cursor-pointer flex flex-col justify-between shadow-sm">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg mb-2">${t.title}</h3>
                                <p class="text-slate-500 text-xs">${t.desc}</p>
                            </div>
                            <button class="mt-6 w-full bg-emerald-50 text-emerald-600 py-2.5 rounded-xl text-xs font-bold">Start Quiz 🚀</button>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        // --- Game Play Session ---
        function startGameSession(timerSeconds) {
            appState.selectedTimer = timerSeconds;
            const fullBank = QUESTION_BANK[appState.selectedTopic][appState.selectedDifficulty];
            
            if (!appState.currentUser.answeredQuestionIds) {
                appState.currentUser.answeredQuestionIds = [];
            }

            let unasked = fullBank.filter(q => !appState.currentUser.answeredQuestionIds.includes(q.id));
            
            if (unasked.length < 5) {
                const prefix = `T${appState.selectedTopic}-${appState.selectedDifficulty.toUpperCase()}`;
                appState.currentUser.answeredQuestionIds = appState.currentUser.answeredQuestionIds.filter(id => !id.startsWith(prefix));
                unasked = fullBank.filter(q => !appState.currentUser.answeredQuestionIds.includes(q.id));
            }

            const shuffledUnasked = [...unasked].sort(() => Math.random() - 0.5);
            let selected = shuffledUnasked.slice(0, 20);

            if (selected.length < 20) {
                const remainingNeeded = 20 - selected.length;
                const otherPool = fullBank.filter(q => !selected.some(s => s.id === q.id));
                const shuffledOther = [...otherPool].sort(() => Math.random() - 0.5).slice(0, remainingNeeded);
                selected = [...selected, ...shuffledOther];
            }

            appState.currentQuestions = selected.sort(() => Math.random() - 0.5);
            appState.currentQuestionIndex = 0;
            appState.sessionScore = 0;
            appState.sessionCorrect = 0;
            appState.sessionWrong = 0;
            appState.sessionStartTime = Date.now();
            
            setScreen('game');
        }

        function renderGameScreen() {
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            const topicInfo = TOPICS_DATA.find(t => t.id === appState.selectedTopic);
            
            return `
            <div class="game-card p-6 sm:p-8 rounded-3xl w-full max-w-3xl mx-auto relative">
                <div class="flex flex-wrap items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-2">
                    <div>
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">${topicInfo.title}</span>
                        <div class="text-xs text-slate-400 font-semibold">Difficulty: <span class="capitalize text-slate-700">${difficultyLabels[appState.selectedDifficulty]}</span> • Level: ${q.aras}</div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div id="game-timer-display" class="bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl font-bold text-xs ${appState.selectedTimer > 0 ? '' : 'hidden'}">
                            <i class="fa-solid fa-stopwatch mr-1"></i> <span id="timer-val">${appState.timeLeft}</span>s
                        </div>
                        <div class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-xl font-bold text-xs">
                            Marks: <span id="live-session-score">${appState.sessionScore}</span> / 100
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <div class="text-xs font-bold text-slate-400 mb-1">QUESTION ${appState.currentQuestionIndex + 1} / ${appState.currentQuestions.length} (ID: ${q.id})</div>
                    <h3 class="text-lg sm:text-xl font-extrabold text-slate-800 leading-snug">${q.question}</h3>
                </div>

                <div id="question-interactive-area" class="mb-8">
                    ${renderQuestionInputArea(q)}
                </div>

                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <button onclick="goToHome()" class="text-slate-400 hover:text-slate-600 text-xs font-bold">
                        <i class="fa-solid fa-house mr-1"></i> Home
                    </button>
                    <button id="submit-ans-btn" onclick="checkAnswer()" class="bouncy-btn bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md shadow-indigo-500/25">
                        Submit Answer <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>`;
        }

        function renderQuestionInputArea(q) {
            if (appState.selectedGameMode === 'isikosong' || q.mode === 'isikosong') {
                return `
                <div class="space-y-4">
                    <input type="text" id="user-input-answer" placeholder="Type your answer here…" class="w-full px-5 py-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-lg text-slate-700">
                    <p class="text-xs text-slate-400"><i class="fa-solid fa-circle-info mr-1"></i> Use the answer format shown in the question.</p>
                </div>`;
            } else {
                const mode = appState.selectedGameMode === 'campuran' ? q.mode : appState.selectedGameMode;
                const drag = mode === 'dragdrop';
                return `
                ${drag ? '<div ondragover="event.preventDefault()" ondrop="dropTimeAnswer(event)" class="mb-3 rounded-xl border-2 border-dashed border-indigo-300 bg-indigo-50 p-3 text-center text-sm font-semibold" id="time-drop-zone">Drag an answer here or select it below</div>' : ''}
                ${mode === 'padanan' ? '<p class="mb-3 text-sm font-semibold">Match the question to the correct answer.</p>' : ''}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="options-container">
                    ${q.options.map((opt, idx) => `
                        <button ${drag ? `draggable="true" ondragstart="event.dataTransfer.setData('text/plain', this.dataset.value)"` : ''} data-value="${opt}" onclick="selectOption(this.dataset.value)" class="option-btn text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-indigo-500 hover:bg-indigo-50/50 font-semibold text-slate-700 transition flex items-center justify-between group">
                            <span><span class="inline-block w-7 h-7 rounded-xl bg-slate-100 text-slate-600 font-bold text-center leading-7 mr-3 group-hover:bg-indigo-600 group-hover:text-white transition">${String.fromCharCode(65 + idx)}</span>${opt}</span>
                            <div class="w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center"></div>
                        </button>
                    `).join('')}
                </div>`;
            }
        }

        let selectedUserChoice = null;
        function dropTimeAnswer(event) {
            event.preventDefault();
            const answer = event.dataTransfer.getData('text/plain');
            const question = appState.currentQuestions[appState.currentQuestionIndex];
            if (question.options.includes(answer)) selectOption(answer);
        }

        function selectOption(opt) {
            selectedUserChoice = opt;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('border-indigo-600', 'bg-indigo-50');
                if (btn.dataset.value === opt) {
                    btn.classList.add('border-indigo-600', 'bg-indigo-50');
                }
            });
            const dropZone = document.getElementById('time-drop-zone');
            if (dropZone) dropZone.textContent = opt;
            playSound('click');
        }

        function setupGameHandlers() {
            if (appState.selectedTimer > 0) {
                appState.timeLeft = appState.selectedTimer;
                if (appState.timerInterval) clearInterval(appState.timerInterval);
                appState.timerInterval = setInterval(() => {
                    appState.timeLeft--;
                    const tEl = document.getElementById('timer-val');
                    if (tEl) tEl.innerText = appState.timeLeft;
                    if (appState.timeLeft <= 0) {
                        clearInterval(appState.timerInterval);
                        handleTimeOut();
                    }
                }, 1000);
            }
        }

        function handleTimeOut() {
            if (document.getElementById('feedback-modal')) return;
            playSound('wrong');
            appState.sessionWrong++;
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            markQuestionAsAnswered(q.id);
            showFeedbackModal(false, "Time’s Up!", q.correct, q.explanation);
        }

        function checkAnswer() {
            if (document.getElementById('feedback-modal')) return;
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            let userAns = null;

            if (q.mode === 'isikosong' || appState.selectedGameMode === 'isikosong') {
                const inp = document.getElementById('user-input-answer');
                userAns = inp ? inp.value.trim() : '';
            } else {
                userAns = selectedUserChoice;
            }

            if (!userAns) {
                showModalMessage('Choose or enter an answer first.');
                return;
            }
            if (appState.timerInterval) clearInterval(appState.timerInterval);

            const normalise = value => {
                const text = value.toLowerCase().trim().replace(/\s+/g, ' ');
                if (/^\d{2}:\d{2}$/.test(q.correct)) {
                    return text.replace(/^(?:jam|hours)\s+/, '').replace(/:/, '');
                }
                if (/^\d+$/.test(q.correct)) return text.replace(/\s+minutes?$/, '');
                return text;
            };
            const isCorrect = normalise(userAns) === normalise(q.correct);
            markQuestionAsAnswered(q.id);

            if (isCorrect) {
                playSound('correct');
                appState.sessionCorrect++;
                appState.sessionScore += 5;
                showFeedbackModal(true, "Correct!", q.correct, q.explanation);
            } else {
                playSound('wrong');
                appState.sessionWrong++;
                showFeedbackModal(false, "Incorrect", q.correct, q.explanation);
            }
        }

        function markQuestionAsAnswered(qid) {
            if (!appState.currentUser.answeredQuestionIds.includes(qid)) {
                appState.currentUser.answeredQuestionIds.push(qid);
                const idx = appState.profiles.findIndex(p => p.id === appState.currentUser.id);
                if (idx !== -1) {
                    appState.profiles[idx] = appState.currentUser;
                    localStorage.setItem('edu_kidz_profiles', JSON.stringify(appState.profiles));
                }
            }
        }

        function showFeedbackModal(isCorrect, title, correctAns, explanation) {
            const existingModal = document.getElementById('feedback-modal');
            if (existingModal) existingModal.remove();

            const modalHTML = `
            <div id="feedback-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="game-card bg-white p-6 sm:p-8 rounded-3xl w-full max-w-md text-center">
                    <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 ${isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                        ${isCorrect ? '🎉' : '❌'}
                    </div>
                    <h3 class="text-2xl font-extrabold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'} mb-2">${title}</h3>
                    ${!isCorrect ? `<p class="text-slate-600 text-sm font-semibold mb-1">Correct answer: <span class="text-indigo-600 font-bold">${correctAns}</span></p>` : ''}
                    <p class="text-slate-500 text-xs mb-6 bg-slate-50 p-3 rounded-xl border border-slate-100">${explanation}</p>
                    
                    <button onclick="nextQuestion()" class="bouncy-btn w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold text-sm shadow-lg shadow-indigo-500/25">
                        Next Question <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            selectedUserChoice = null;
        }

        function nextQuestion() {
            const modal = document.getElementById('feedback-modal');
            if (modal) modal.remove();

            appState.currentQuestionIndex++;
            if (appState.currentQuestionIndex < appState.currentQuestions.length) {
                setScreen('game');
            } else {
                finishGameSession();
            }
        }

        function finishGameSession() {
            if (!appState.currentUser.completedTopics.includes(appState.selectedTopic)) {
                appState.currentUser.completedTopics.push(appState.selectedTopic);
            }
            appState.currentUser.score += appState.sessionScore;
            
            const idx = appState.profiles.findIndex(p => p.id === appState.currentUser.id);
            if (idx !== -1) {
                appState.profiles[idx] = appState.currentUser;
                localStorage.setItem('edu_kidz_profiles', JSON.stringify(appState.profiles));
            }

            setScreen('result');
        }

                <div class="space-y-3">
                    <button onclick="setScreen('topics')" class="bouncy-btn w-full bg-indigo-600 text-white py-3.5 rounded-2xl font-bold text-sm shadow-lg shadow-indigo-500/25">

        function showModalMessage(msg) {
            const m = document.createElement('div');
            m.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50';
            m.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full text-center">
                    <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-xl mx-auto flex items-center justify-center text-xl mb-3">⚠️</div>

                    <button onclick="this.parentElement.parentElement.remove()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-xs">OK</button>

            document.body.appendChild(m);
        }

        window.onload = function() {
            setScreen('auth');
        };
    </script>
